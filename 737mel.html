red open."},"33-00-07":{"o":"Adequate lighting must be available for ground deice operations at night.","m":"If the EXTERIOR LIGHTING – WING SCAN circuit breaker on the P18-3 panel located at A14 is open and will not reset,\nsecure the breaker in the open position.\nNote: Both left and right wing illumination lights will be inoperative with circuit breaker secured open."},"33-00-08C":{"o":"The retractable landing lights may be inoperative in the extended position with no effect on flight characteristics.","m":"With the landing light(s) extend/retract motor inoperative, compare the light position with the operative light’s\nposition. If the light is not in the extended position, the light (lamp) is considered to be inoperative.\nFigure 33-2: Landing Light Array"},"33-00-11A":{"m":"If circuit breakers “EXTERIOR LIGHTING – POSITION - RIGHT” (A12) on the P18-3 Panel and/or “EXTERIOR LIGHTING –\nPOSITION – LEFT” A13 on the P18-3 Panel are open and will not reset, secure the breaker(s) in the open position."},"33-00-16A":{"o":"1. Check that associated system indicator light(s) on associated panel operates normally.\n2. Placard the inoperative System Annunciator Light “LIGHT INOP”.\n3. Ensure Master Caution Lights illuminate properly prior to pushback.\n4. If the MASTER CAUTION light illuminates with no annunciator light illuminated (for dispatch with a light\nextinguished) OR with no additional annunciator light illuminated (for dispatch with a light illuminated), it can\nbe assumed that the system with the placard light inop is affected and has triggered the Master Caution light to\nilluminate.\n5. Just prior to descent, check the associated panel for any light indications associated with the system annunciator\nwhich is inoperative.\nFigure 33-4: PILOT'S LIGHTSHIELD"},"34-00-01B":{"o":"Program KIAS/Mach speed restriction in FMS."},"34-00-02C":{"o":"Program KIAS/Mach speed restriction in FMS."},"34-00-02D":{"o":"Program KIAS/Mach speed restriction in FMS.","m":"If overspeed warning occurs below .76 Mach, system must be deactivated by pulling and securing the associated\ncircuit breaker:\n1. System MACH WARN SYS – 1 on the P18-2 panel located at E3.\n2. System MACH WARN SYS -2 on the P6-1 panel located at B7."},"34-00-15A":{"o":"1. Refer to the Remarks or Exceptions Column.\n2. Refer to the FCTM, Maneuvers, Windshear, Windshear Escape Maneuver."},"34-00-15B":{"o":"1. Refer to the Remarks or Exceptions Column.\n2. Refer to the FCTM, Maneuvers, Windshear, Windshear Escape Maneuver."},"34-00-15C":{"o":"1. Refer to the Remarks or Exceptions Column.\n2. Refer to the FCTM, Maneuvers, Windshear, Windshear Escape Maneuver."},"34-00-17A":{"o":"1. When dispatching with the NO.2 ILS System inoperative, manually tune the required ILS frequency on the left\nnavigation control panel prior to takeoff to prevent display of the GPWS INOP light in flight.\n2. When both NO.2 VOR and ILS are deferred, place the VHF NAV Transfer Switch on the forward overhead panel to\nBOTH ON 1 position."},"34-00-17B":{"o":"1. When dispatching with the NO.2 ILS System inoperative, manually tune the required ILS frequency on the left\nnavigation control panel prior to takeoff to prevent display of the GPWS INOP light in flight.\n2. When both NO.2 VOR and ILS are deferred, place the VHF NAV Transfer Switch on the forward overhead panel to\nBOTH ON 1 position."},"34-00-18B":{"o":"Refer to the Airway Manual 3.1.6 Reduced Vertical Separation Minimum (RVSM), for RVSM procedures and\ncontingencies.","m":"Defer TCAS per MEL 34-00-40A"},"34-00-18C":{"o":"Ensure the Flight Dispatch Release indicates that ATC approval has been obtained along the planned route.\nIf ATC approval cannot be confirmed, contact Flight Control for confirmation and an amended Flight Dispatch Release if\nrequired."},"34-00-18D":{"o":"For one inoperative ADS-B Out, select transponder to operative side."},"34-00-25A":{"o":"1. Use the autopilot and altitude hold for all operations for which it is appropriate.\n2. Cross-check Captain’s and First Officer’s altitude displays upon reaching and departing assigned altitude.\nPeriodically cross-check altitude indications when maintaining an assigned altitude.\n3. Flight crew must be aware that the usual alerts for altitude deviations will not occur."},"34-00-26A":{"o":"1. The following aural alerts are inoperative:\nA. V1 callout,\nB. Look Ahead Terrain Alerts,\nC. Radio Altitude Based Alerts,\nD. Obstacle Alerts, Windshear Alerts,\nE. Bank Angle Alerts,\nF. Radio Altitude Callouts ( i.e., TWENTY FIVE HUNDRED, ONE THOUSAND, ... , TWENTY, and TEN),\nG. DH / MDA Callouts (i.e., APPROACHING MINIMUMS and MINIMUMS).\nNote: Predictive Windshear Alerts will function normally.\n2. Review Standard Callout procedures. Refer to Operations Manual, Volume 1, Normal Procedures, Introduction,\nStandard Callouts.\n3. Preflight briefing to include review of terrain and/or obstructions in the proximity of the departure and arrival\nairports.\n4. Pilot monitoring should monitor flight path during takeoff, approach and landing, and alert the pilot flying If any of\nthe following conditions exist:\nA. Excessive descent rate.\nB. Excessive terrain closure rate.\nC. Altitude loss after takeoff or go-around.\nD. Unsafe terrain clearance while not in the landing mode.\nE. Deviation from glideslope.","m":"Pull and secure GPWS circuit breaker located on the P18-1 Panel"},"34-00-26B":{"o":"1. Review Standard Callout procedures. Refer to Operations Manual, Volume 1, Normal Procedures, Introduction,\nStandard Callouts.\n2. Preflight briefing should include review of terrain and/or obstructions in the proximity of the departure and arrival\nairports.\n3. Pilot monitoring should monitor flight path during takeoff, approach and landing, and alert the pilot flying if any of\nthe following conditions exist:\nA. Excessive descent rate.\nB. Excessive terrain closure rate.\nC. Altitude loss after takeoff or go-around.\nD. Unsafe terrain clearance while not in the landing mode.\nE. Deviation from glideslope."},"34-00-26C":{"o":"1. Review Standard Callout procedures. Refer to Operations Manual, Volume 1, Normal Procedures, Introduction,\nStandard Callouts.\n2. Preflight briefing should include review of terrain and/or obstructions in the proximity of the departure and arrival\nairports.\n3. Pilot monitoring should monitor flight path during takeoff, approach and landing, and alert the pilot flying if any of\nthe following conditions exist:\nA. Excessive descent rate.\nB. Excessive terrain closure rate.\nC. Altitude loss after takeoff or go-around.\nD. Unsafe terrain clearance while not in the landing mode.\nE. Deviation from glideslope.","m":"Pull and secure GPWS circuit breaker located on the P18-1 Panel"},"34-00-26E":{"o":"1. Review Standard Callout procedures. Refer to Operations Manual, Volume 1, Normal Procedures, Introduction,\nStandard Callouts.\n2. Preflight briefing should include review of terrain and/or obstructions in the proximity of the departure and arrival\nairports.\n3. Pilot monitoring should monitor flight path during takeoff, approach and landing, and alert the pilot flying if any of\nthe following conditions exist:\nA. Excessive descent rate.\nB. Excessive terrain closure rate.\nC. Altitude loss after takeoff or go-around.\nD. Unsafe terrain clearance while not in the landing mode.\nE. Deviation from glideslope."},"34-00-26H":{"o":"1. Review Standard Callout procedures. Refer to Operations Manual, Volume 1, Normal Procedures, Introduction,\nStandard Callouts.\n2. Preflight briefing should include review of terrain and/or obstructions in the proximity of the departure and arrival\nairports.\n3. Pilot monitoring should monitor flight path during takeoff, approach and landing, and alert the pilot flying if any of\nthe following conditions exist:\nA. Excessive descent rate.\nB. Excessive terrain closure rate.\nC. Altitude loss after takeoff or go-around.\nD. Unsafe terrain clearance while not in the landing mode.\nE. Deviation from glideslope."},"34-00-26F":{"o":"1. Refer to FCTM, Windshear.\n2. Review Standard Callout procedures. Refer to Operations Manual, Volume 1, Normal Procedures, Introduction,\nStandard Callouts."},"34-00-26G":{"o":"1. Refer to FCTM, Windshear.\n2. Review Standard Callout procedures. Refer to Operations Manual, Volume 1, Normal Procedures, Introduction,\nStandard Callouts."},"34-00-35A":{"o":"1. Place the IRS mode selector switch for the inoperative IRS to OFF.\n2. Use the remaining IRS for both attitude, heading and vertical speed indications.\n3. Verify remaining IRS is operating normally by observing attitude and heading flags on pilot’s and copilot’s ADI, ND,\nHSI and RDMI are out of view.\n4. Flight is restricted to day VMC.\n5. Verify that Standby Magnetic Compass operates normally.\n6. Verify Standby Horizon Indicator operates normally.\n7. When dispatching with one IRU inoperative, do not use the autopilots in any mode.\n8. Do not use TO/GA mode of Flight Director."},"34-00-36C":{"o":"With one FMC inoperative, operating with the FMC Source Select Switch selected to the operational FMC (BOTH ON L\nor BOTH ON R) is required to accomplish all Flight Management Computing tasks.","m":"1. An inoperative FMC may be deactivated by pulling and securing FMCS CMPTR 1 (P18-2 at A6) or FMCS CMPTR 2\n(P6-1 at D16) circuit breaker as appropriate.\n2. Place the FMC Source Select switch to the operational FMC (BOTH ON L or BOTH ON R) position."},"34-00-36D":{"o":"1. Refer to the Remarks or Exceptions Column.\n2. If both MCDUs are inoperative, refer to the Operations Manual, Volume 1, Supplementary Procedures section,\nFlight Management, Navigation, FMC INOPERATIVE.","m":"1. Defer Autothrottle System per MEL 22-00-04."},"34-00-36F":{"o":"1. Refer to the Remarks or Exceptions Column.\n2. If both MCDUs are inoperative, refer to the Operations Manual, Volume 1, Supplementary Procedures section,\nFlight Management, Navigation, FMC INOPERATIVE."},"34-00-36G":{"o":"PRIOR TO EACH DEPARTURE:\n1. Select the route to be flown from the (non-current) data base.\n2. Check the intended route against current Jeppesen pages for agreement of all navigation data, using applicable\ndeparture, enroute and arrival charts, or request Flight Control to validate the database using the RVAL tool.\n3. If all information agrees, the FMS may be used normally on the route which was checked. Each new route must be\nchecked in the same manner.\n4. Any time the FMS dat does not agree with current Jeppensen information, manual tuning and course selection\nmust be accomplished.","m":"1. Verify database to be within twenty eight (28) days of the effective and active date range.\n2. Enter a statement in the log book such as, “NAV Database out of currency.”\n3. MCC will CAR the log for update at next available RON\n4. MCC will close the applicable FMS Database Load forecast to prevent over-run.\n5. MCC or Maintenance will create a MON log."},"34-00-40A":{"o":"TCAS must be operative on routes outbound from the Continental United States to destinations outside the\nContinental United States, except Canada.","m":"Pull and secure the TCAS circuit breaker on the P18-1 Panel.\nNote: Do not pull the W/S, TCAS, GPWS Audio circuit breaker, as this will inhibit the Windshear and GPWS audio."},"34-00-40B":{"o":"Monitor the operative indications and advisories and respond as appropriate."},"34-00-40C":{"o":"Monitor the operative indications and advisories and respond as appropriate."},"34-00-40D":{"o":"Monitor the operative indications and advisories and respond as appropriate."},"34-00-40E":{"o":"Monitor the operative indications and advisories and respond as appropriate."},"35-00-02B":{"o":"1. Deploy passenger masks manually using the PASS OXYGEN Switch or Actuation / Reset Handle (if installed).Flight\naltitude is limited to FL 300.","m":"1. Apply electrical power to the aircraft.\n2. Pull down the test stop buttons on all service units and turn approximately 90 degrees. If service units do not have\ntest buttons, install adhesive tape approximately 4 inches long to prevent the door from fully opening.\n3. On the P5 aft overhead panel, push the PASS OXYGEN switch to on, verify the PASS OXY ON Light illuminates and\nboth MASTER CAUTION light and the OVERHEAD annunciator lights illuminate.\n4. Verify that the mask box doors in the passenger cabin, including lavatories are against the stop buttons or against\nthe adhesive tape.\n5. Open the OXYGEN SYSTEM IND circuit breaker on the P18 panel.\n6. Wait 10 seconds and close the OXYGEN SYSTEM IND circuit breaker.\nA. Verify that the OVERHEAD annunciator light on the P7 lightshield is off, both MASTER CAUTION lights are off\nand no other annunciator light is on, the PASS OXY ON light is off.\n7. Hold the mask door in its position, turn the test stop button 90 degrees and release the button.\n8. Push the test stop button up until you hear the sound of a click and then release the test stop button.\nA. Service units without the test button, push the door up till you hear the click and reset indicator pin.\n9. Return aircraft to normal condition."},"35-00-02A":{"m":"1. Close the inoperative door and secure it using adhesive tape.\n2. Rope, tie, tape or otherwise block the seats with the inoperative units against passenger use. Do likewise if\ninoperative unit is in a lavatory.\n3. Placard the blocked off seats or lavatory - \"NOT TO BE OCCUPIED\"."},"35-00-02C":{"m":"DOOR LATCH(ES) INOPERATIVE UNLATCHED:\n1. Verify that the related generator has not been expended. Color band will be black if generator has been expended\nand generator must be replaced.\n2. Tape door closed. Fashion the tape such that a non adhesive “handle'”, approximately 4 inches long, is left\npendant. This “handle” will be used in case of need by the passenger to strip the securing tape down, thus allowing\nthe door to fall open."},"35-00-03A":{"o":"1. Refer to Volume 1 737 3.4.4 Preflight Procedure - Pilot Monitoring for dispatch requirements.\nNote: If CREW OXYGEN pressure is less that 1,000 PSI, contact MCC for guidance. Aircraft may be able to continue\nin service in accordance with TOPP 40-40-05.","m":"PRIOR TO EACH DEPARTURE:\n1. Pressure must be verified at the oxygen bottle per AMM Task 12-15-21-210-801."},"35-00-03B":{"o":"1. When dispatching with the overpressure discharge indication disk damaged or missing, verify that oxygen pressure\nis adequate for dispatch.\nA. Observe system pressure using the flight deck crew and passenger (if installed) oxygen pressure indicator on\nthe aft overhead panel, or using the pressure indicator on the external service panel (if installed), or oxygen\ncylinder."},"35-00-04A":{"o":"1. Ensure cabin crew (Flight Leader) is notified of the unserviceable bottle and its location.","m":"1. Ensure serviceable bottles are evenly distributed throughout the cabin.\n2. Remove mask/hose assembly from the unserviceable unit. Secure the mask in a location where it can be retrieved\nat the next available maintenance facility.\nA. Disconnect mask assembly from oxygen cylinder outlet by rotating hose fitting 1/2 turn and pulling out.\n3. Place a piece of tape (or other suitable means) over the pressure gauge of oxygen bottle and label INOP. Position\nthe unserviceable cylinder in holder and fasten quick release clamp.\n4. Using tape or other suitable means, cover affected oxygen bottle location placarding.\nNote: For locations with two oxygen bottles installed, do NOT cover placard if remaining bottle is operative.\n737-800 Non-ETOPS: 738 FLEET\n(A/C 3701-3777)\nNumber of passengers and\nflight attendants\nMinimum Number of full oxygen bottles required based on duration of flight for\nwhich an enroute alternate is not available.\nFor Non-Extended Operations (ETOPS)\n0-165 4\n737-900ER Extended Operations (ETOPS): 73E FLEET(A/C 3876-3895)\nNumber of passengers and\nflight attendants\nMinimum Number of full oxygen bottles required based on duration of flight for\nwhich an enroute alternate is not available.\nFor Non-Extended\nOperations (ETOPS)\nFor Extended Operations\n(ETOPS) up to 120 minutes.\nFor Extended Operations\n(ETOPS) up to 180 minutes.\n0-50 4 4 4\n51-100 4 4 5\n101-150 4 5 7\n151-185 4 6 9\n737-900ER Non-ETOPS: 739 FLEET(A/C 3801-3875; 3896-3930)(A/C 3931-3963 - POST - AA 2500-01847)\nNumber of passengers and\nflight attendants\nMinimum Number of full oxygen bottles required based on duration of flight for\nwhich an enroute alternate is not available.\nFor Non-Extended Operations (ETOPS)\n0-50 4\n51-100 4\n101-150 4\n151-185 4\n737-900ER Non-ETOPS: 73J FLEET(A/C 3943-3952, 3955, 3956 - PRE-AA 2500-01847)\nNumber of passengers and\nflight attendants\nMinimum Number of full oxygen bottles required based on duration of flight for\nwhich an enroute alternate is not available.\nFor Non-Extended Operations (ETOPS)\n0-50 4\n51-100 4\n101-150 4\n151-186 4\n737-900ER Non-ETOPS: 73R FLEET(A/C 3931-3942, 3953, 3954, 3957-3963 - PRE-AA 2500-01847)\nNumber of passengers and\nflight attendants\nMinimum Number of full oxygen bottles required based on duration of flight for\nwhich an enroute alternate is not available.\nFor Non-Extended Operations (ETOPS)\n0-50 4\n51-100 4\n101-150 4\n151-180 4"},"35-00-04B":{"o":"1. Ensure cabin crew (Flight Leader) is notified of the inoperative, damaged, or missing tag and its location.\n2. PRIOR TO EACH DEPARTURE:\nA. Proper installation and servicing is verified."},"35-00-05A":{"o":"Refer to the Remarks or Exceptions Column.","m":"Refer to the Remarks or Exceptions Column.\nExample, Proviso e) 4 installed bottles, 40 passengers."},"35-00-06B":{"o":"PRIOR TO EACH DEPARTURE:\n1. Ensure cabin crew (Flight Leader) is notified of the inoperative, damaged, or missing tag and its location.\n2. PRIOR TO EACH DEPARTURE:\nA. Remove PBE and inspect for obvious damage (punctures, rips in pouch, etc.).\nB. Reinstall PBE and ensure proper installation.\nNote: If PBE is damaged or installation is in question, maintenance is required.\nFigure 35-1: Portable Protective Breathing Equipment (PBE)\n36 Pneumatic\nTable of Contents"},"36-00-02A":{"o":"Note: With the ground pneumatic check valve inoperative CLOSED, use APU air for starting engines.\nNote: With the ground pneumatic check valve inoperative OPEN, the right engine can only be started using a\nground pneumatic source.\nNote: When dispatching with a single engine bleed on for takeoff (airplane pressurized), V1(MCG) should be\ndetermined based on AC packs OFF. Takeoff performance should be based on packs AUTO. Refer to ODM,\nAbnormal Section, MEL Support, Minimum Control Speed, VMCA Chart.\n1. Following engine start, depressurize the right pneumatic duct prior to removing the ground pneumatic source.\nOperate airplane with:\n○ Right bleed OFF\n○ Right pack OFF\n○ Isolation valve CLOSE\n2. Operate the left pack using the left engine bleed or APU bleed with isolation valve CLOSE.\nNote: At altitudes 17,000 feet and below, increased airflow will occur when flaps are extended (takeoff and\nlanding) and the APU is used instead of engine bleed to supply bleed air to the operating pack. Refer to\nVolume 1, Supplementary Procedures for NO ENGINE BLEED TAKEOFF AND LANDING.\nNote: Bleeds off performance (on WDR) is not required. This procedure is used to prevent “back flow” to the\nAPU. This is not a performance issue.\nNote: With the PACK switch in AUTO, the pack will operate in the high flow mode when the APU is used as the\nbleed source.\n3. Maximum altitude is FL 250.","m":"1. Use a ground pneumatic source for starting the right engine.\n2. Prior to removing the ground pneumatic source, verify with the flight crew that the right pneumatic duct is\ndepressurized (right engine bleed OFF and isolation valve CLOSE).\n3. Ground pneumatic source will be required at down line stations if the right engine is shutdown."},"36-00-03A":{"o":"LEFT ENGINE BLEED UNUSABLE:\n1. Limit altitude to FL 250.\n2. For increased airflow at altitudes below 17,000 feet, operate the left pack using the APU bleed air, the right pack\nusing the right engine bleed and the isolation valve CLOSE.\n3. At altitudes above 17,000 feet operate with the APU bleed air OFF.\n4. Operate the left pack using the right engine bleed, the right pack OFF and isolation valve OPEN.\nRIGHT ENGINE BLEED UNUSABLE:\n1. Limit altitude to FL 250.\n2. Operate the left pack using the left engine bleed, right pack OFF, and isolation valve CLOSE.\nNote: At altitudes of 17,000 feet and below, increased airflow will occur when the flaps are extended (takeoff and\nlanding) and the APU is used instead of engine bleed to supply bleed air to the operating pack. Refer to\nOperations Manual, Volume I, Supplementary Procedures, No Engine Bleed Takeoff and Landing Procedure.\nNote: Bleeds off performance (on WDR) is not required. This procedure is used to prevent “back flow” to the APU.\nThis is not a performance issue.\nTWO ENGINE BLEEDS UNUSABLE:\n1. Limit altitude to 17,000 feet MSL.\n2. Operate the left pack using APU bleed and isolation valve CLOSE.\n3. Refer to Operations Manual, Volume I, Supplementary Procedures, No Engine Bleed Takeoff and Landing\nProcedure.\nNote: Bleeds off performance (on WDR) is not required. This procedure is used to prevent “back flow” to the APU.\nThis is not a performance issue."},"36-00-03B":{"m":"Deactivate precooler control valve in full open position by completing the following procedure.\nFor Precooler Control Valve P/N 3289562-5/-6/-7:\n1. Set each engine lever in the CUTOFF position.\n2. Remove pressure from the pneumatic system (AMM 36-00-00/201).\n3. Deactivate the leading edge slats in the retracted position (AMM 27-81-00/201).\n4. Deactivate the associated thrust reverser (AMM 78-31-00/201).\n5. Gain access to the precooler control valve by opening the appropriate thrust reverser (AMM 78-31-00/201).\n6. Remove the supply pressure sense line between the precooler control valve, bleed air regulator, and intersection\nmanifold duct (AMM 36-12-02/401).\n7. On the precooler control valve supply port, remove tubing fitting union J522P53 and replace with undrilled tubing\nfitting union C36002-1.\n8. Reinstall the supply pressure sense line between the precooler control valve, bleed air regulator, and intersection\nmanifold duct (AMM 36-12-02/401).\n9. Supply pressure to pneumatic system using supply pressure upstream of PRSOV and perform a leak check of all\ndistributed tubing fittings using snoop leak detector or equivalent soap solution (AMM 36-00-00/201).\n10. Verify that the visual position indicator on the precooler control valve indicates that the valve is in the full open\nposition.\n11. Remove pressure from the pneumatic system (AMM 36-00-00/201).\n12. Close thrust reverser (AMM 78-31-00/201).\n13. Activate thrust reverser (AMM 78-31-00/201).\n14. Activate leading edge slats (AMM 27-81-00/201).\nFor Precooler Control Valve P/N 63292146-1:\n1. Set each engine start lever in the CUTOFF position.\n2. Remove pressure from the pneumatic system (AMM 36-00-00/201).\n3. Deactivate the leading edge slats in the retracted position (AMM 27-81-00/201).\n4. Deactivate the associated thrust reverser (AMM 78-31-00/201).\n5. Gain access to the precooler control valve by opening the appropriate thrust reverser (AMM 78-31-00/201).\n6. Remove and reinstall pneumatic lock plug into engaged/locked position. Ensure plug bottoms in bore. Apply\n95-105 in-lb of torque on the pneumatic lock hex.\n7. Supply Pressure Upstream of the PRSOV and verify that the valve remain in the full open position as evidenced by\nvisual inspection.\n8. Remove pressure from pneumatic system (AMM 36-00-00/201).\n9. Close thrust reverser (AMM 78-31-00/201).\n10. Activate thrust reverser (AMM 78-31-00/201).\n11. Activate leading edge slats (AMM 27-81-00/201)."},"36-00-05A":{"o":"Note: Use of APU bleed air is limited to 17,000 feet. One air conditioning pack will be unusable when dispatching\nwith:\n1. The RIGHT engine bleed inoperative.\n2. The Left engine bleed inoperative and flight altitude greater than 17,000 feet.\n3. Both engine bleeds inoperative.\nNote: When dispatching with a single engine bleed ON for takeoff (airplane pressurized) V1 (MCG) should be\ndetermined based on AC packs OFF. Takeoff performance should be based on AC packs AUTO.\n1. Do not dispatch into known or forecast icing conditions.\n2. After engine start, position the associated engine BLEED switch to OFF.\n3. For LEFT engine bleed inoperative:\nA. At altitudes 17,000 feet and below, operate the LEFT pack using the APU bleed air, the RIGHT pack using the\nright engine bleed, and isolation valve CLOSED.\nB. At altitudes above 17,000 feet, operate with the APU bleed air OFF.\ni. Limit altitude to FL 250.\nii. Operate the LEFT pack using the right engine bleed, RIGHT pack OFF, and isolation valve OPEN.\n4. For RIGHT engine bleed inoperative:\nA. Limit altitude to FL 250.\nB. Operate the LEFT pack using the left engine bleed, RIGHT pack OFF, and isolation valve CLOSED.\nNote: At altitudes 17,000 feet and below, increased air flow will occur when flaps are extended (takeoff and\nlanding) and the APU is used instead of engine bleed to supply bleed air to the operating pack. Refer\nto Volume 1 737 5.2.12 No Engine Bleed Takeoff and Landing.\nNote: Bleeds off performance (on WDR) is not required. This procedure is used to prevent “back flow” to\nthe APU. This is not a performance issue.","m":"1. Comply with Preparation steps in AMM Task 36-00-00-040-804.\n2. Open the fan duct cowl and thrust reversers. (Ensure all precautionary measures are taken with cowl, slats and\nthrust reversers.)\n3. Lock the engine bleed air valve (PRSOV) in the CLOSED position:\nA. Turn the override nut to align the position indicator with the CLOSED position.\nB. Loosen the lock screw/knob bolt and push in locking knob to lock valve in closed position.\nC. Retighten lock screw/knob bolt.\n4. Close the fan duct cowl and thrust reversers."},"36-00-05B":{"o":"1. Do not dispatch into known or forecast icing conditions.\n2. Set BOTH engine bleed switches to the OFF position.\n3. For BOTH engine bleeds inoperative:\nA. Limit altitude to 17,000 feet MSL.\nB. Operate the left pack using APU bleed and isolation valve CLOSE.\nC. Refer to Volume 1 737 5.2.12 No Engine Bleed Takeoff and Landing.\nNote: Bleeds off performance (on WDR) is not required. This procedure is used to prevent “back flow” to\nthe APU. This is not a performance issue.","m":"1. Comply with Preparation steps in AMM Task 36-00-00-040-804.\n2. Open the fan duct cowl and thrust reversers. (Ensure all precautionary measures are taken with cowl, slats and\nthrust reversers.)\n3. Lock the engine bleed air valve (PRSOV) in the CLOSED position:\nA. Turn the override nut to align the position indicator with the CLOSED position.\nB. Loosen the lock screw/knob bolt and push in locking knob to lock valve in closed position.\nC. Retighten lock screw/knob bolt.\n4. Close the fan duct cowl and thrust reversers."},"38-00-01B":{"m":"Inoperative potable water system:\n1. Drain potable water system (AMM 12-14-01/801).\n2. Install additional placard on the inside of exterior potable water service panel(s) not to service potable water\nsystem."},"38-00-01A":{"m":"Inoperative individual components:\n1. Deactivate or isolate inoperative components.\n2. Verify associated system components do not have leaks."},"38-00-02B":{"o":"OPERATIONS NOTE\nNote: No changes to security procedures or passenger seating are required for an inoperative forward lavatory.","m":"Inoperative lavatory waste system:\n1. Deactivate inoperative system component(s) as necessary per AMM 38-32-00. No leakage is allowed.\n2. For known, suspected, or reported leaks at a lavatory servicing panel:\nNote: All lavatories are considered inoperative when the servicing panel is known, suspected, or reported to be\nleaking.\nA. Associated waste tank must be drained per AMM 12-17-01.\nB. Place a strip of Red colored OM2 “UNSERVICEABLE – DO NOT USE” tape (or equivalent*) on the interior of the\naffected exterior service panel(s).\n* An acceptable alternate to the OM2 tape is a section of two inch wide tape with the words “UNSERVICEABLE\n– DO NOT USE” printed legibly in one inch black letters\n3. Lock affected lavatory door closed.\n4. Place a strip of Red colored OM2 “UNSERVICEABLE – DO NOT USE” tape (or equivalent*) across the lavatory door,\nand across the toilet lid to prevent use.\nNote: An acceptable alternate to the OM2 tape is a section of two inch wide tape with the words\n“UNSERVICEABLE – DO NOT USE” printed legibly in one inch black letters."},"38-00-02A":{"m":"Inoperative individual lavatory waste system components:\n1. Deactivate inoperative system component(s) and isolate as necessary per AMM 38-32-00.\n2. Ensure system is properly serviced.\n3. Check deactivated component(s) for leakage. No leakage is allowed.\n4. If a lavatory servicing panel leak is known, suspected, or reported, use MEL item 38-00-02B."},"38-00-05A":{"m":"1. Deactivate associated components.\nNote: Contact Liaison Engineering for deactivation instructions.\n2. Verify associated components are not leaking.\n46 Information Systems\nTable of Contents"},"46-00-01A":{"o":"Refer to FOM Chapter 16 Section 1 for EFB battery and backup battery requirements."},"46-00-01B":{"o":"Refer to FOM Chapter 16 Section 1 for EFB battery and backup battery requirements."},"46-00-01C":{"o":"Utilize removable PED Mount","m":"1. Ensure that inoperative mount(s) is secured or removed from the aircraft.\n2. Install removable PED mount on affected side."},"46-00-01D":{"m":"1. Ensure that inoperative mount(s) is secured or removed from the aircraft."},"47-00-01A":{"m":"For either the amber operability indicator light or for no operability indicator lights illuminated, deactivate the NGS\nshutoff valve in the closed position (AMM 47-00-00/901).\n49 Airborne Auxiliary Power (APU)\nTable of Contents"},"49-00-01A":{"o":"Communication between the Captain and ground personnel is required prior to start. Refer to the B737 Operations\nManual Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU Inop, APU Bleed Inop, or APU\nGenerator System Inop.\n1. External electrical and an alternate air source is required for normal starting.\n2. Perform a visual inspection, from the ground, of the tailcone area and adjacent control surfaces. Inspection\nis to confirm that there is no evidence of heat damage or delamination evident from blistering paint and/or\ndiscoloration typically caused by a APU tailpipe fire or torching start."},"49-00-01B":{"o":"1. APU is shut down before takeoff.\n2. The start attempt must be initiated at the top of descent or at such time that will ensure a 2-hour cold soak at\nFL270 or above. Refer to Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU Inop or APU\nGenerator System Inop.\n3. In-flight start data will be entered into the Aircraft Log Book by the flight crew."},"49-00-01C":{"o":"1. Start APU prior to pushback.\n2. The APU must remain operating throughout the ETOPS portion of the flight.\nNote: APU fuel consumption is approximately 270 lbs per hour while airborne.","m":"Service APU oil to full."},"49-00-04B":{"o":"Refer to B737 Operations Manual Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU Inop,\nAPU Bleed Inop, or APU Generator System Inop."},"49-00-04A":{"m":"ONCE EACH FLIGHT DAY, verify APU oil level is satisfactory for dispatch (AMM 12-13-31/301)."},"49-00-06A":{"o":"Note: If the inlet door is inoperative in the CLOSED position then the performance penalties do not apply. If\nre-positioning of the inlet door is necessary to achieve the closed position, Maintenance is Required and\nFlight Crew May NOT Placard.\n1. Starting the APU requires Maintenance action.\n2. Do not turn the APU off unless the APU is no longer required or Maintenance is available.\n3. The following penalties are used to account for the increased drag resulting from the APU inlet door being\ninoperative in the open position (either fully or partially open) and APU not running.","m":"Note: With the APU Inlet Door inoperative in the OPEN position the APU may be used.\n1. APU switch is OFF.\n2. Pull and secure the AUX POWER UNIT CONT and APU FIRE SW POWER circuit breakers.\n3. Open the stabilizer trim access door.\n4. Position the air inlet door in the fully open position.\n5. Close the stabilizer trim access door.\n6. Close the AUX POWER UNIT CONT and APU FIRE SW POWER circuit breakers."},"49-00-06B":{"m":"INLET DOOR CLOSED\nNote: If the inlet door is inoperative in the CLOSED position then the performance penalties do not apply. If\nre-positioning of the inlet door is necessary to achieve the closed position, Maintenance is Required and\nFlight Crew May NOT Placard.\n1. Make sure the APU switch is off.\n2. Pull and secure the AUX POWER UNIT CONT, AUX POWER UNIT SCU FAN POWER, APU FIRE SW POWER, and APU\nSTART CONV circuit breakers.\n3. Open the stabilizer trim access door.\n4. Put the air inlet door in the closed position.\n5. Close the stabilizer trim access door.\nINLET DOOR OTHER THAN CLOSED POSITION\nNote: When the inlet door is inoperative in any position other than closed, performance penalties apply.\n1. Make sure APU switch is off\n2. Pull and secure the AUX POWER UNIT CONT, AUX POWER UNIT SCU FAN POWER, APU FIRE SW POWER, and APU\nSTART CONV circuit breakers.\nFigure 49-1: APU AIR INLET DOOR ACTUATOR INSTALLATION"},"49-00-07B":{"o":"Note: With the APU Bleed Valve failed OPEN, the DUAL BLEED light will be illuminated with the Engine 1 Bleed Air\nSwitch ON or the Engine 2 Bleed Air Switch ON with the Isolation Valve Switch in the OPEN position. The\nMaster Caution light will also be illuminated. This is a normal indication.\n1. Dispatch is not allowed if the APU is required by other procedures.\n2. APU must not be started.\n3. Refer to B737 Operations Manual Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU Inop,\nAPU Bleed Inop, or APU Generator System Inop."},"49-00-07A":{"m":"Determine the position of APU bleed air valve by using either the Input Monitoring page of APU BITE TEST\nor the following procedure (AMM 49-00-00/901):\n1. Make sure the APU BLEED switch on the P-5 overhead panel is OFF.\n2. Gain access to APU bleed air valve and look at the two indications on the position switch.\nA. If the indication on the bleed air valve shows OPEN, APU must be considered inoperative.\nB. If the indication on the bleed air valve shows CLOSED, APU may be used for electrical power only.\n3. Close the APU cowl door."},"49-00-09A":{"o":"Refer to B737 Operations Manual Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU Inop,\nAPU Bleed Inop, or APU Generator System Inop."},"49-00-09B":{"o":"1. Dispatch is not allowed if the APU is required by other procedures.\n2. APU must not be started.\n3. Refer to B737 Operations Manual Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU Inop,\nAPU Bleed Inop, or APU Generator System Inop."},"49-00-15A":{"o":"Refer to B737 Operations Manual Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU Inop or\nAPU Generator System Inop.","m":"1. Position the APU switch (P5 Panel) OFF.\n2. Pull and secure the following circuit breakers:\nA. P6-4 panel AUX POWER UNIT CONT\nB. P6-4 panel AUX POWER UNIT SCU FAN POWER\nC. P6-2 panel APU FIRE SW POWER\nD. P91 panel APU START CONV\n3. Disconnect, cap and stow the battery type connector to the SPU, located on the E2-2 shelf in the EE bay."},"49-00-16A":{"o":"Refer to B737 Operations Manual Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU Inop or\nAPU Generator System Inop.","m":"1. Position the APU switch (P5 panel) OFF.\n2. Pull and secure the following circuit breakers:\nA. P6-4 panel AUX POWER UNIT CONT\nB. P6-4 panel AUX POWER UNIT SCU FAN POWER\nC. P6-2 panel APU FIRE SW POWER\nD. P91 panel APU START CONV\n52 Doors\nTable of Contents"},"49-00-16B":{"o":"Refer to B737 Operations Manual Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU Inop or\nAPU Generator System Inop."},"52-00-03A":{"m":"PRIOR TO EACH DEPARTURE\n1. Do a visual inspection of the applicable door to make sure that the door is closed and locked.\nA. Open and close the applicable door.\ni. Make sure that the door operates correctly.\nB. Make sure that the door is closed and latched.\ni. Make sure that the outside skin of the door is flush with the fuselage skin.\nii. Make sure the that the vent panel(s) are closed and faired.\niii. Make sure that the liner of the door is faired with the passenger cabin wall.\niv. Make sure that the inside door handle is rotated to the latched position."},"52-00-03B":{"m":"PRIOR TO EACH DEPARTURE\n1. Check PSEU bite and verify that there are no faults associated with the overwing exit doors.\n2. If Flight Lock Failed Open faults are present, dispatch using MEL 52-00-15."},"52-00-05A":{"o":"1. Enroute altitude should be limited to 27,000 feet so that a cabin altitude of 8,000 feet can be maintained.\n2. Pressure differential must not exceed 6.0 PSI. Monitor differential pressure indicator during climb.\n3. Digital pressurization system must be operated in the AUTO or ALT mode.\n4. To ensure that the correct pressure differential is not exceeded, select cabin altitude in accordance with the\nappropriate schedule shown below.\nFigure 52-1: DIFFERENTIAL PRESSURE SCHEDULES","m":"Visually inspect remaining fittings for possible defects on affected door(s), body frames and sills."},"52-00-05B":{"o":"1. Enroute altitude should be limited to 17,000 feet so that a cabin altitude of 8,000 feet can be maintained.\n2. Pressure differential must not exceed 3.4 PSI. Monitor differential pressure indicator during climb.\n3. Digital pressurization system must be operated in the AUTO or ALT mode.\n4. To ensure that the correct pressure differential is not exceeded, select cabin altitude in accordance with the\nappropriate schedule shown below.\nFigure 52-2: DIFFERENTIAL PRESSURE SCHEDULES","m":"Visually inspect remaining fittings for possible defects on affected door(s), body frames and sills."},"52-00-06B":{"o":"1. Limit altitude to 10,000 feet MSL for passenger flights.\n2. Non-passenger flights above 10,000 feet MSL require flight crew to be on oxygen.\n3. Extended overwater flight is prohibited.\n4. Maintain main outflow valve open.\n5. To avoid passenger discomfort, limit climb and descent rates to 500 FPM.\n6. The following steps can be taken to improve both passenger cabin and crew compartment temperatures:\nA. If possible, pre-condition the cabin to a low temperature prior to dispatch. A low initial cabin temperature will\nresult in a lower peak temperature.\nB. Maintain the highest allowable flight altitude.\nC. Minimize cabin heat load by pulling the shades down and turning off unnecessary lights.\nD. Reciruclation Fan(s) AUTO.\nE. Because of reduced ventilation rate (with both packs inoperative), consideration should be given to flight\nduration and passenger load so that excessive cabin temperatures may be avoided. Estimated stabilized\ntemperatures at the end of 30 minutes flight are as follows:\nLimit number of passengers to 45\nTAT NO. OF PASS PASS. CABIN TEMPERATURE CREW CABIN TEMPERATURE\n°C °F °C °F °C\n-1 0 50 10 70 21\n-1 45 70 21 75 24\n10 0 70 21 90 32\n10 45 80 27 95 35\n21 0 90 32 110 43\n21 45 95 35 110 43\n32 0\n32 45\n7. To maintain isolated bleed sources, position the isolation valve switch to CLOSE.","m":"1. Visually inspect remaining fittings for possible defects on affected door, body frames and sills.\n2. Configure airplane for unpressurized flight by using the manual mode of the Cabin Pressure Control System to\nposition the outflow valve to the full open position. Hold outflow valve toggle switch in the OPEN position for 30\nseconds.\nFigure 52-3: LOWER CARGO DOOR PRESSURE STOP FITTINGS"},"52-00-06C":{"o":"1. Limit altitude to 10,000 feet MSL for passenger flights.\n2. Non-passenger flights above 10,000 feet MSL require flight crew to be on oxygen.\n3. Extended overwater flight is prohibited.\n4. Maintain main outflow valve open.\n5. To avoid passenger discomfort, limit climb and descent rates to 500 FPM.\n6. The following steps can be taken to improve both passenger cabin and crew compartment temperatures:\nA. If possible, pre-condition the cabin to a low temperature prior to dispatch. A low initial cabin temperature will\nresult in a lower peak temperature.\nB. Maintain the highest allowable flight altitude.\nC. Minimize cabin heat load by pulling the shades down and turning off unnecessary lights.\nD. Reciruclation Fan(s) AUTO.\nE. Because of reduced ventilation rate (with both packs inoperative), consideration should be given to flight\nduration and passenger load so that excessive cabin temperatures may be avoided. Estimated stabilized\ntemperatures at the end of 30 minutes flight are as follows:\nLimit number of passengers to 45\nTAT NO. OF PASS PASS. CABIN TEMPERATURE CREW CABIN TEMPERATURE\n°C °F °C °F °C\n-1 0 50 10 70 21\n-1 45 70 21 75 24\n10 0 70 21 90 32\n10 45 80 27 95 35\n21 0 90 32 110 43\n21 45 95 35 110 43\n32 0\n32 45\n7. To maintain isolated bleed sources, position the isolation valve switch to CLOSE.","m":"1. Visually inspect remaining fittings for possible defects on affected door, body frames and sills.\n2. Configure airplane for unpressurized flight by using the manual mode of the Cabin Pressure Control System to\nposition the outflow valve to the full open position. Hold outflow valve toggle switch in the OPEN position for 30\nseconds.\nFigure 52-3: LOWER CARGO DOOR PRESSURE STOP FITTINGS"},"52-00-06A":{"m":"On initial deferral and PRIOR TO 25 FLIGHTS:\nNote: On intitial deferral, a separate MON deferral must be created to track 25 cycle re-inspect. The MON log can\nbe closed after completion of re-inspection.\n1. Comply with AMM Task 52-00-00-210-807."},"52-00-14A":{"m":"Use a safety hold open device when associated door is in the open position."},"52-00-14B":{"m":"Use a safety hold open device when associated door is in the open position for inspection to ensure cargo\ncompartment is empty."},"52-00-17A":{"o":"Refer to QRH (1.7) for procedures to follow when flight deck security door automatic locking system or components\nare inoperative.\n1. On the ground, when the cabin is ready for pushback:\nA. Flight Attendant will close the flight deck door and lock with a key.\nB. Deadbolt Latch will be in the “+” configuration (LOCKED KEY OPERABLE). Refer to Volume 2 737 1.5.9.2\nEnhanced Flight Deck Door.\nNote: The FAA has authorized the use of the deadbolt for MEL dispatch. Disregard “For Ground Use Only” placard\nwhen dispatched under this MEL and procedures require use of the deadbolt.","m":"For deactivating the automatic locking system:\n1. Position the flight deck access system switch OFF (guard extended).\nNote: LOCK FAIL light will remain illuminated when the flight deck access system switch is in the OFF position\n(guard extended)."},"52-00-17B":{"o":"Refer to QRH (1.7) for procedures to follow when flight deck security door automatic locking system or components\nare inoperative.\n1. On the ground, when the cabin is ready for pushback:\nA. Flight Attendant will close the flight deck door and lock with a key.\nB. Deadbolt Latch will be in the “+” configuration (LOCKED KEY OPERABLE). Refer to Volume 2 737 1.5.9.2\nEnhanced Flight Deck Door.\nNote: The FAA has authorized the use of the deadbolt for MEL dispatch. Disregard “For Ground Use Only” placard\nwhen dispatched under this MEL and procedures require use of the deadbolt.","m":"For deactivating the keypad:\n1. Open the circuit breaker for the flight deck door lock.\n2. Disconnect the keypad electrical connector at the chime module side.\n3. Close the circuit breaker for the flight deck door lock.\nNote: When flight deck door is closed with the flight deck not occupied, make sure the Flight Deck Access System\nswitch is in the OFF position (guard extended)."},"52-00-17C":{"o":"Refer to QRH (1.7) for procedures to follow when flight deck security door automatic locking system or components\nare inoperative.\n1. On the ground, when the cabin is ready for pushback:\nA. Flight Attendant will close the flight deck door and lock with a key.\nB. Deadbolt Latch will be in the “+” configuration (LOCKED KEY OPERABLE). Refer to Volume 2 737 1.5.9.2\nEnhanced Flight Deck Door.\nNote: The FAA has authorized the use of the deadbolt for MEL dispatch. Disregard “For Ground Use Only” placard\nwhen dispatched under this MEL and procedures require use of the deadbolt."},"52-00-17F":{"o":"Refer to QRH (1.7) for procedures to follow when flight deck security door automatic locking system or components\nare inoperative.\n1. On the ground, when the cabin is ready for pushback:\nA. Flight Attendant will close the flight deck door and lock with a key.\nB. Deadbolt Latch will be in the “+” configuration (LOCKED KEY OPERABLE). Refer to Volume 2 737 1.5.9.2\nEnhanced Flight Deck Door.\nNote: The FAA has authorized the use of the deadbolt for MEL dispatch. Disregard “For Ground Use Only” placard\nwhen dispatched under this MEL and procedures require use of the deadbolt.","m":"1. For deactivating the keypad:\nA. Open the circuit breaker for the flight deck door lock.\nB. Disconnect the keypad electrical connector at the chime module side.\nC. Close the circuit breaker for the flight deck door lock.\nNote: When flight deck door is closed with the flight deck not occupied, make sure the Flight Deck Access\nSystem switch is in the OFF position (guard extended).\n2. For verifying automatic lock is operating normally:\nA. With the flight deck door open, supply electrical power on the airplane.\nB. Position Flight Deck Access System switch NORM (guard closed).\nC. Verify the electric strike is in the locked position (solenoid pin in the electric strike will be extended up such\nthat you can not rotate the strike).\nD. Position Flight Deck Access System switch OFF (guard extended).\nE. Verify the electric strike is in the unlocked position (solenoid pin in the electric strike will retract down such that\nyou can rotate the strike).\nF. Position Flight Deck Access System switch NORM (guard closed).\nG. Verify the electric strike is in the locked position (solenoid pin in the electric strike will be extended up such\nthat you can not rotate the strike)."},"52-00-17D":{"m":"For verifying automatic lock controls are operating normally:\n1. With the flight deck door open, supply electrical power on the airplane.\n2. Position Flight Deck Access System switch NORM (guard closed).\n3. Position the Flight Deck Door Lock selector AUTO.\n4. Verify the electric strike is in the locked position (solenoid pin in the electric strike will be extended up such that\nyou can not rotate the strike).\n5. Enter keypad access code and verify the door chime sounds.\n6. Position the Flight Deck Door Lock selector DENY.\n7. Before the DENY time delay has expired, enter the keypad access code and verify the door chime does not sound.\n8. Position and hold Flight Deck Door Lock selector UNLKD.\n9. Verify the electric strike is in the unlocked position (solenoid pin in the electric strike will retract down such that\nyou can rotate the strike).\n10. Position the Flight Deck Door Lock selector AUTO.\n11. Verify the electric strike is in the locked position (solenoid pin in the electric strike will be extended up such that\nyou can not rotate the strike)."},"52-00-17E":{"m":"For verifying automatic lock controls are operating normally:\n1. With the flight deck door open, supply electrical power on the airplane.\n2. Position Flight Deck Access System switch NORM (guard closed).\n3. Position the Flight Deck Door Lock selector AUTO.\n4. Verify the electric strike is in the locked position (solenoid pin in the electric strike will be extended up such that\nyou can not rotate the strike).\n5. Enter keypad access code and verify the door chime sounds.\n6. Position the Flight Deck Door Lock selector DENY.\n7. Before the DENY time delay has expired, enter the keypad access code and verify the door chime does not sound.\n8. Position and hold Flight Deck Door Lock selector UNLKD.\n9. Verify the electric strike is in the unlocked position (solenoid pin in the electric strike will retract down such that\nyou can rotate the strike).\n10. Position the Flight Deck Door Lock selector AUTO.\n11. Verify the electric strike is in the locked position (solenoid pin in the electric strike will be extended up such that\nyou can not rotate the strike)."},"52-00-25A":{"m":"PRIOR TO EACH DEPARTURE\n1. For the cargo door exterior handle:\nA. Secure the affected cargo door exterior handle in a recessed position flush with the fuselage.\nNote: Speed Tape may be used to secure affected cargo door exterior handle in a recessed position flush\nwith the fuselage. If speed tape is used, the area where the tape is applied should be cleaned with\nsolvent prior to application, and new speed tape should be applied each time the affected cargo door\nexterior handle is used to operate the door during the MEL deferral period."},"52-00-25B":{"m":"1. For the flapper door hinge spring assembly:\nA. No action required.\nFigure 52-4: Flapper Door Hinge Spring Assembly\n53 Fuselage\nTable of Contents"},"74-00-01A":{"o":"Normal operation of the operable ignition system may be confirmed as follows:\n1. Position ignition switch to IGN R for starting the associated engine.\n2. After engine start, position ignition switch to IGN BOTH."},"74-00-01B":{"o":"Normal operation of the operable ignition system may be confirmed as follows:\n1. Position ignition switch to IGN R for starting the associated engine.\n2. After engine start, position ignition switch to IGN BOTH."},"74-00-01C":{"o":"Normal operation of the operable ignition system may be confirmed as follows:\n1. Position ignition switch to IGN R for starting the associated engine.\nNote: IGN R is selected because the right power supply cable is swapped to the left exciter per (M) procedure\n(see below).\n2. After engine start, position ignition switch to IGN BOTH.","m":"Comply with preparation steps in AMM Task 74-00-00-040-801-F00.\nNote: Dispatch is not permitted if the ignition failure is due to an EEC right igniter fault.\nIf the Right Ignition System(s) is inoperative, connect the left Igniter to AC Standby Bus:\n1. Pull and secure the following C/B’s on the P-18-2 Panel:\nA. For # 1 Engine, ENGINE 1 IGN RIGHT (located at A1) and ENGINE 1 IGN LEFT (located at A3).\n2. Pull and secure the following C/B’s on the P-6-2 Panel:\nA. For # 2 Engine, ENGINE 2 IGN RIGHT (located at D4) and ENGINE 2 IGN LEFT (located at D6).\n3. Verify that start levers are in the CUTOFF position and start switches in the OFF position.\n4. Open fan cowl on affected engine.\nWARNING\nMAKE SURE THE IGNITION EXCITERS ARE DE-ENERGIZED BEFORE WORKING ON THE IGNITION\nSYSTEM. WAIT FOR A MINIMUM OF FIVE MINUTES TO RELEASE THE HIGH VOLTAGE FROM\nIGNITION EXCITER.\n5. Disconnect the power supply cables from the ignition exciters:\nA. Disconnect the DP0102 connector on the left power supply cable (Transfer Bus) from the left ignition exciter\nIGN 1.\nB. Disconnect the DP0201 connector on the right power supply cable (Standby Bus) from the right ignition exciter\nIGN 2.\n6. Connect the power supply cables:\nA. Connect the DP0102 connector on the left power supply cable (Transfer Bus) to the right ignition exciter IGN 2.\nB. Connect the DP0201 connector on the right power supply cable (Standby Bus) to the left ignition exciter IGN 1.\nC. Tighten the connectors.\n7. Close C/B’s on the P18-2 and/or P6-2 Panel(s).\n8. Perform Audible Test of Right Ignition System – EEC BITE.\n9. Close fan cowl.\nFigure 74-1: Ignition Excitors Normal Configuration\nFigure 74-2: Ignition Excitors Dispatch Configuration (After Swapping Connectors)\n77 Engine Indicating\nTable of Contents"},"74-00-01D":{"o":"Normal operation of the operable ignition system may be confirmed as follows:\n1. Position ignition switch to IGN R for starting the associated engine.\nNote: IGN R is selected because the right power supply cable is swapped to the left exciter per (M) procedure\n(see below).\n2. After engine start, position ignition switch to IGN BOTH.","m":"Comply with preparation steps in AMM Task 74-00-00-040-801-F00.\nNote: Dispatch is not permitted if the ignition failure is due to an EEC right igniter fault.\nIf the Right Ignition System(s) is inoperative, connect the left Igniter to AC Standby Bus:\n1. Pull and secure the following C/B’s on the P-18-2 Panel:\nA. For # 1 Engine, ENGINE 1 IGN RIGHT (located at A1) and ENGINE 1 IGN LEFT (located at A3).\n2. Pull and secure the following C/B’s on the P-6-2 Panel:\nA. For # 2 Engine, ENGINE 2 IGN RIGHT (located at D4) and ENGINE 2 IGN LEFT (located at D6).\n3. Verify that start levers are in the CUTOFF position and start switches in the OFF position.\n4. Open fan cowl on affected engine.\nWARNING\nMAKE SURE THE IGNITION EXCITERS ARE DE-ENERGIZED BEFORE WORKING ON THE IGNITION\nSYSTEM. WAIT FOR A MINIMUM OF FIVE MINUTES TO RELEASE THE HIGH VOLTAGE FROM\nIGNITION EXCITER.\n5. Disconnect the power supply cables from the ignition exciters:\nA. Disconnect the DP0102 connector on the left power supply cable (Transfer Bus) from the left ignition exciter\nIGN 1.\nB. Disconnect the DP0201 connector on the right power supply cable (Standby Bus) from the right ignition exciter\nIGN 2.\n6. Connect the power supply cables:\nA. Connect the DP0102 connector on the left power supply cable (Transfer Bus) to the right ignition exciter IGN 2.\nB. Connect the DP0201 connector on the right power supply cable (Standby Bus) to the left ignition exciter IGN 1.\nC. Tighten the connectors.\n7. Close C/B’s on the P18-2 and/or P6-2 Panel(s).\n8. Perform Audible Test of Right Ignition System – EEC BITE.\n9. Close fan cowl.\nFigure 74-1: Ignition Excitors Normal Configuration\nFigure 74-2: Ignition Excitors Dispatch Configuration (After Swapping Connectors)\n77 Engine Indicating\nTable of Contents"},"78-00-01":{"o":"During landing rollout, differential braking may be required to maintain directional control."}};</script>

<script>
const MEL = [{"n":"21-00-01A","t":"Air Conditioning Packs Left Pack (B737-800)","r":"(O)Left Pack may be inoperative provided: 1. Flight altitude remains at or below FL 250, and 2. Right Pack is operative. Note: If operational and not restricted from use by another MEL, APU pneumatics should be used to supply the operating pack to increase air flow when the flaps are extended for takeoff and landing. Theater Restrictions may apply"},{"n":"21-00-01B","t":"Air Conditioning Packs Right Pack (B737-800)","r":"(O)Right Pack may be inoperative provided: 1. Flight altitude remains at or below FL 250, and 2. Left Pack is operative. Note: If operational and not restricted from use by another MEL, APU pneumatics should be used to supply the operating pack to increase air flow when the flaps are extended for takeoff and landing. Theater Restrictions may apply"},{"n":"21-00-01C","t":"Air Conditioning Packs Both Packs (B737-800)","r":"(O)(M)Both Packs may be inoperative provided: 1. Flight is conducted in an unpressurized configuration, 2. Recirculation fan(s) operates normally, 3. Both E/E equipment cooling exhaust fans operate normally, and 4. Cargo compartments remain empty, or are verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions). Theater Restrictions may apply Date: 09-Apr-2025"},{"n":"21-00-01D","t":"Air Conditioning Packs Left Pack (B737-900ER)","r":"(O)(M)Except for Extended Operations (ETOPS), Left Pack may be inoperative provided: 1. Flight altitude remains at or below FL 250, 2. Right Pack is operative, 3. Forward cargo heat duct is secured closed, and 4. Airport ambient temperature does not exceed 103 degrees F (39 degrees C). Note: If operational and not restricted from use by another MEL, APU pneumatics should be used to supply the operating pack to increase air flow when the flaps are extended for takeoff and landing. Theater Restrictions may apply"},{"n":"21-00-01E","t":"Air Conditioning Packs Right Pack (B737-900ER)","r":"(O)(M)Except for Extended Operations (ETOPS), Right Pack may be inoperative provided: 1. Flight altitude remains at or below FL 250, 2. Left Pack is operative, 3. Forward cargo heat duct is secured closed, and 4. Airport ambient temperature does not exceed 103 degrees F (39 degrees C). Note: If operational and not restricted from use by another MEL, APU pneumatics should be used to supply the operating pack to increase air flow when the flaps are extended for takeoff and landing. Theater Restrictions may apply"},{"n":"21-00-01F","t":"Air Conditioning Packs Both Packs(-900ER)","r":"(O)(M)Except for Extended Operations (ETOPS), Both Packs may be inoperative provided: 1. Flight is conducted in an unpressurized configuration, 2. Recirculation fans operate normally, 3. Both E/E equipment cooling exhaust fans operate normally, 4. Cargo compartments remain empty, or are verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions), 5. Forward cargo heat duct is secured closed, and 6. Airport ambient temperature does not exceed 103 degrees F (39 degrees C). Theater Restrictions may apply Date: 09-Apr-2025"},{"n":"21-00-02A","t":"Pack Airflow / Shut-Off Valves","r":"(O)(M)May be inoperative provided: 1. Associated valve is deactivated closed, 2. Associated Air Conditioning Pack is considered inoperative and deferred perMEL 21-00-01A,21-00-01B,21-00-01Dor 21-00-01Eas applicable, and 3. Flight altitude remains at or below FL 250."},{"n":"21-00-02B","t":"Pack Airflow / Shut-Off Valves","r":"(O)(M)May be inoperative provided: 1. Valves are deactivated closed, 2. Flight is conducted in an unpressurized configuration, 3. Associated Air Conditioning Pack is considered inoperative and deferred perMEL 21-00-01Cor21-00-01Fas applicable,and 4. Cargo compartments remain empty, or are verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions)."},{"n":"21-00-02C","t":"High Flow Mode","r":"May be inoperative."},{"n":"21-00-02D","t":"APU High Flow Mode","r":"May be inoperative."},{"n":"21-00-02E","t":"Electronic Flow Control (B737-900ER Aircraft 3853-3930)","r":"(O)One or both may be inoperative provided: 1. Appropriate performance corrections are applied, 2. Procedures are used to ensure AFT lower cargo compartment remain empty, or is verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions), and 3. Performance correctionsare applied. Note 1: This item is AD related Note 2: Backup pneumatic flow control will result in larger flow transients and airflow noise associated with bleed air pressure changes. Note 3: With Electronic Flow Control Valve in backup pneumatic flow control, the associated PACK light will illuminate during Master Caution recall and will extinguish when Master Caution is reset. Date: 09-Apr-2025"},{"n":"21-00-02F","t":"Pack Flow Sensors (B737-900ER Aircraft 3853-3930)","r":"(M)May be inoperative provided pack inlet pressure sensor(s) for associated air conditioning pack(s) is verified to operate normally."},{"n":"21-00-02G","t":"Pack Flow Sensors (B737-900ER Aircraft 3853-3930)","r":"Maybe inoperative provided associated Electronic Flow Control is considered inoperative and deferred perMEL 21-00-02E."},{"n":"21-00-02H","t":"Pack Inlet Pressure Sensors (B737-900ER Aircraft 3853-3930)","r":"(M)May be inoperative provided pack flow sensor(s) for associated air conditioning pack(s) is verified to operate normally."},{"n":"21-00-02I","t":"Pack Inlet Pressure Sensors (B737-900ER Aircraft 3853-3930)","r":"Maybe inoperative provided associated Electronic Flow Control is considered inoperative and deferred perMEL 21-00-02E."},{"n":"21-00-03","t":"Pack Trip Warning Systems","r":"(O)(M)May be inoperative provided associated pack is deferred perMEL 21-00-01A,21-00-01B, 21-00-01D, or21-00-01Eas applicable."},{"n":"21-00-05","t":"PACK (RAM AIR","r":"DOOR)"},{"n":"21-00-07","t":"RAM","r":"LIGHTS"},{"n":"21-00-10A","t":"Cabin Rate of Climb Indicator","r":"May be inoperative provided AUTO and ALTN control modes operate normally."},{"n":"21-00-10B","t":"Cabin Rate of Climb Indicator (A/C 3701-3771, 3774-3777)","r":"(O)(M)May be inoperative provided: 1. Flight is conducted in an unpressurized configuration, 2. Outflow valve is positioned to 25% open position, and 3. Recirculation fan(s) operate normally."},{"n":"21-00-10C","t":"Cabin Rate of Climb Indicator (A/C 3772, 3773)","r":"(O)(M)May be inoperative provided: 1. Flight is conducted in an unpressurized configuration, 2. Lower forward cargo compartment remains empty, or is verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (seeMEL Instructions), 3. Outflow valve is positioned to 25% open position, and 4. Recirculation fan(s) operate normally."},{"n":"21-00-10D","t":"Cabin Rate of Climb Indicator (-900ER)","r":"(O)(M)May be inoperative provided: 1. Flight is conducted in an unpressurized configuration, 2. Outflow valve is positioned to 25% open position, 3. Recirculation fans operate normally, 4. Forward cargo heat duct is secured closed, and 5. Airport ambient temperature does not exceed 103 degrees F (39 degrees C)."},{"n":"21-00-11A","t":"Cabin Altitude Warning System","r":"May be inoperative provided flight altitude remains at or below 10,000 feet MSL"},{"n":"21-00-11B","t":"CABIN ALTITUDE Light","r":"(O)May be inoperative provided: 1. Associated TAKEOFF CONFIG warning light operates normally, and 2. Before engine start PRIOR TO EACH DEPARTURE, the flightcrew performs a briefing on cabin altitude warning indications and procedures. Repetitive Check Required (Yellow Placard)"},{"n":"21-00-12A","t":"Cabin Altitude Indicator","r":"(O)May be inoperative provided: 1. Cabin differential pressure indicator operates normally, and 2. A chart is provided to crew to convert differential pressure to cabin altitude."},{"n":"21-00-12B","t":"Cabin Altitude Indicator (A/C 3701-3771, 3774-3777)","r":"(O)(M)May be inoperative provided: 1. flight is conducted in an unpressurized configuration, 2. Outflow valve is positioned to 25% open position, and 3. Recirculation fan(s) operate normally."},{"n":"21-00-12C","t":"Cabin Altitude Indicator (A/C 3772, 3773)","r":"(O)(M)May be inoperative provided: 1. Flight is conducted in an unpressurized configuration, 2. Lower forward cargo compartment remains empty, or is verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions), 3. Outflow valve is positioned to 25% open position, and 4. Recirculation fan(s) operate normally."},{"n":"21-00-12D","t":"Cabin Altitude Indicator(-900ER) 21-00-13","r":"INDICATOR"},{"n":"21-00-13","t":"CABIN","r":"INDICATOR"},{"n":"21-00-13A","t":"Cabin Differential Pressure Indicator","r":"(O)May be inoperative provided: 1. Cabin altitude indicator operates normally, and 2. A chart is provided to crew to convert cabin altitude to differential pressure."},{"n":"21-00-13B","t":"Cabin Differential Pressure Indicator (A/C 3701-3771,","r":"3774-3777)"},{"n":"21-00-13C","t":"Cabin Differential Pressure Indicator (A/C 3772,","r":"3773)"},{"n":"21-00-13D","t":"Cabin Differential Pressure Indicator (-900ER)","r":"(O)(M)May be inoperative provided: 1. Flight is conducted in an unpressurized configuration, 2. Outflow valve is positioned to 25% open position, 3. Recirculation fans operate normally, 4. Forward cargo heat duct is secured closed, and 5. Airport ambient temperature does not exceed 103 degrees F (39 degrees C)."},{"n":"21-00-14A","t":"Automatic Modes","r":"(O)(M)May be inoperative provided: 1. Manual mode operates normally, and 2. Inoperative controller is deactivated."},{"n":"21-00-14B","t":"Automatic Modes (A/C 3701-3771, 3774-3777)","r":"(O)(M)May be inoperative for unpressurized flight provided: 1. Outflow valve is deactivated in 25% open position or removed, 2. Recirculation fan(s) operates normally, and 3. Extended overwater flight is prohibited."},{"n":"21-00-14C","t":"Automatic Modes (A/C 3772, 3773)","r":"(O)(M)May be inoperative for unpressurized flight provided: 1. Outflow valve is deactivated in 25% open position or removed, 2. Recirculation fan(s) operates normally, and 3. Extended overwater flight is prohibited. 4. Lower forward cargo compartment remains empty, or is verified to contain only empty cargo handling equipment, ballast, and/or Fly Away kits (see MEL Instructions)."},{"n":"21-00-14D","t":"Automatic Modes (-900ER)","r":"(O)(M)May be inoperative for unpressurized flight provided: 1. Outflow valve is deactivated in the 25% open position or removed, 2. Recirculation fans operate normally, 3. Extended overwater flight is prohibited, 4. Forward cargo heat duct is secured closed, and 5. Airport ambient temperature does not exceed 103 degrees F (39 degrees C)."},{"n":"21-00-14E","t":"Manual Mode (A/C 3701-3771, 3774-3777)","r":"(O)(M)May be inoperative for unpressurized flight provided: 1. Outflow valve is deactivated in 25% open position or removed, 2. Recirculation fan(s) operates normally, and 3. Extended overwater flight is prohibited. Date: 09-Apr-2025"},{"n":"21-00-14F","t":"Manual Mode (A/C 3772, 3773)","r":"(O)(M)May be inoperative for unpressurized flight provided: 1. Outflow valve is deactivated in 25% open position or removed, 2. Recirculation fan(s) operate normally, 3. Extended overwater flight is prohibited, and 4. Lower forward cargo compartment remains empty, or is verified to contain only empty cargo handling equipment, ballast, and/or Fly Away kits (see MEL Instructions)."},{"n":"21-00-14G","t":"Manual Mode (-900ER) 21-00-15","r":"MODE ACTUATORS"},{"n":"21-00-15","t":"MAIN","r":"MODE ACTUATORS"},{"n":"21-00-15A","t":"Main Outflow Valve Automatic Mode Actuators","r":"May be inoperative provided the manual mode actuator operates normally."},{"n":"21-00-15B","t":"Main Outflow Valve Automatic Mode Actuators","r":"(A/C 3701-3771, 3774-3777)"},{"n":"21-00-1 grille may be broken or missing is a return air grille may be broken or missing is designated location, it is acceptable to the allowed location if the two return air grill blocks the area. Date: 01-Nov-2023 Numbers Date: 29-Sep-2022"},{"n":"21-00-50","t":"Flight Deck Foot Air Diffusers","r":"Date: 09-Apr-2025"},{"n":"22-00-00","t":"LLM CATEGORY II/III STATUS (LOWER","r":"LANDING MINIMUMS)"},{"n":"22-00-00L","t":"LLM Category II/III Status (Lower Landing Minimums)","r":"(M)Aircraft restricted from autopilot coupled Autoland due to chronic problem or no Autoland in 30 days. 1. This Item number is only used for deferring the Autoland status of the aircraft and MCC authorization is required prior to its usage or removal. 2. Practice Autolands are permitted if authorized by MCC. 3. This item does not prohibit CAT II/III approaches using HUD."},{"n":"22-00-01A","t":"Autopilot Systems","r":"May be inoperative provided: 1. Approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, and 2. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Note 1: Any mode which functions normally may be used. Note 2: If operable, both the autopilot and Flight Director will be utilized for all ILS approaches when reported weather is below 4000 RVR or ¾ mile."},{"n":"22-00-01B","t":"Autopilot Systems","r":"Except for Extended Operations (ETOPS), may be inoperative provided: 1. Approach minimums do not require their use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, 2. Enroute operations do not require autopilot use, 3. Number of flight segments and segment duration is acceptable to flight crew, and 4. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Note 1: Any mode which functions normally may be used. If CWS is inoperative, do not use other modes (pitch or roll) Note 2: Autopilot required for Non-ILS approaches. RVSM Operations Not Authorized Theater restrictions may Apply"},{"n":"22-00-01C","t":"Autoland","r":"May be inoperative provided approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements. Date: 21-Aug-2024"},{"n":"22-00-01D","t":"Control Wheel Autopilot Disconnect Switches","r":"One may be inoperative provided: 1. Mode Control Panel autopilot DISENGAGE bar operates normally, 2. Autopilot is not used below 1500 feet AGL, and 3. Approach minimums do not require use of autopilot; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"22-00-01E","t":"Control Wheel Autopilot Disconnect Switches","r":"May be inoperative provided: 1. Autopilot is not used, and 2. Approach minimums do not require use of autopilot; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"22-00-01F","t":"Autopilot DISENGAGE Bar","r":"May be inoperative."},{"n":"22-00-02","t":"AUTOPILOT DISENGAGED WARNING Autopilot Disengaged Warning System","r":"SYSTEM"},{"n":"22-00-02A","t":"Lights","r":"May be inoperative provided autopilot disengage aural warning system operates normally."},{"n":"22-00-02B","t":"Lights","r":"Except for Extended Operations (ETOPS), one or both may be inoperative provided: 1. Autopilots are not used, and 2. Approach minimums do not require their use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"22-00-02C","t":"Aural Warning (Wailer)","r":"Except for Extended Operations (ETOPS), may be inoperative provided: 1. Autopilots are not used, and 2. Approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"22-00-03A","t":"Yaw Damper","r":"(O)May be inoperative provided yaw damper switch remains OFF."},{"n":"22-00-03B","t":"Yaw Damper Indicator Lights","r":"May be inoperative provided: 1. Autothrottle is not used, 2. Approach minimums do not require their use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, and 3. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements."},{"n":"22-00-11","t":"STAB OUT OF TRIM Light","r":"Except for Extended Operations (ETOPS), may be inoperative provided: 1. Autopilots are not used, and 2. Approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements. RVSM Operations Not Authorized"},{"n":"22-00-14A","t":"V/S Selector (DOWN, UP)","r":"May be inoperative provided procedures do not require its use. Non-Precision Approaches (V/S method) NOT Authorized"},{"n":"22-00-14B","t":"Bank Angle Selector (10, 15, 20, 25, 30) 22-00-15","r":"/ PADDLES"},{"n":"22-00-15","t":"MODE","r":"/ PADDLES"},{"n":"22-00-15A","t":"A/P CWS Engage Switches","r":"Note: If the light only is inoperative useMEL 22-00-18E."},{"n":"22-00-15B","t":"A/P CMD Engage Switches","r":"May be inoperative provided approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements. Note: If the light only is inoperative useMEL 22-00-18E."},{"n":"22-00-15C","t":"A/P CMD Engage Switches","r":"Except for Extended Operations (ETOPS), may be inoperative provided: 1. Autopilots are not used, and 2. Approach minimums do not require their use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements. RVSM Operations Not Authorized Note 1: Autopilot required for Non-ILS approaches Note 2: If the light only is inoperative useMEL 22-00-18E."},{"n":"22-00-15D","t":"Autothrottle Arm Switch","r":"May be inoperative provided approach minimums do not require autothrottle use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements. Note: If the light only is inoperative useMEL 22-00-18D."},{"n":"22-00-15E","t":"A/T SPEED Switch","r":"May be inoperative provided approach minimums do not require autothrottle use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements. Note: If the light only is inoperative useMEL 22-00-18E. Date: 27-Aug-2025"},{"n":"22-00-15F","t":"F/D Switches","r":"May be inoperative provided: 1. Approach minimums do not require their use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, and 2. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Note: If the light only is inoperative use MEL 22-00-18E."},{"n":"22-00-15G","t":"IAS/MACH Change Over Switch","r":"Note: If the light only is inoperative useMEL 22-00-18E."},{"n":"22-00-15H","t":"APP Switch","r":"May be inoperative provided approach minimums do not require use of autopilot or flight director; refer to Navigation Equipment Tab (this manual) for Lower Landing Minimum Requirements. Note 1: Autopilot required for Non-ILS approaches. Note 2: If the light only is inoperative useMEL 22-00-18E."},{"n":"22-00-15I","t":"N1, LNAV, VNAV, LVL CHG, V/S, HDG SEL,","r":"ALT HOLD, and VOR/LOC Switches"},{"n":"22-00-15J","t":"SPD INTV, and ALT INTV Switches","r":"Note: If the light only is inoperative useMEL 22-00-18E."},{"n":"22-00-16A","t":"Airspeed (IAS / MACH)","r":"May be inoperative provided selected airspeed indications on both PFD’s operate normally."},{"n":"22-00-16B","t":"Heading (HEADING)","r":"May be inoperative provided selected heading indications on both PFD’s operate normally."},{"n":"22-00-16C","t":"Vertical Speed (VERT SPEED)","r":"May be inoperative provided procedures do not require its use."},{"n":"22-00-16D","t":"Vertical Speed (VERT SPEED)","r":"May be inoperative and associated selector used provided selected vertical speed indications on both PFD’s operate normally."},{"n":"22-00-16E","t":"Altitude (ALTITUDE)","r":"May be inoperative provided selected altitude indications on both PFD’s operate normally."},{"n":"22-00-16F","t":"Course (COURSE)","r":"May be inoperative and associated selector used provided selected course indications operate normally."},{"n":"22-00-16G","t":"Window Lighting","r":"May be inoperative provided: 1. Selected airspeed indications operate normally, 2. Selected heading indications operate normally, 3. Selected vertical speed indications operate normally, 4. Selected altitude indications operate normally, and 5. Selected course indications operate normally."},{"n":"22-00-17A","t":"Takeoff / Go-Around (TO/ GA) Switches","r":"One may be inoperative provided approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"22-00-17B","t":"Takeoff / Go-Around (TO/ GA) Switches","r":"May be inoperative provided: 1. Both thrust levers are operated manually for takeoff, 2. Autopilot and Flight Director are not used below Minimum Descent Altitude or 500 feet, whichever is higher, 3. Approach minimums do not require their use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, and 4. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Note: Flight Director go-around and windshear guidance are not available with both TO / GA switches inoperative."},{"n":"22-00-18A","t":"Affected AFCS CWS Engage Switch Lights","r":"AFCS CWS Engage Switch Light(s) INOP"},{"n":"22-00-18B","t":"Autopilot CMD Engage Switch Lights","r":"One may be inoperative provided approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"22-00-18C","t":"Autopilot CMD Engage Switch Lights","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided autopilots are not used."},{"n":"22-00-18D","t":"A/T ARM Switch Light","r":"A/T ARM Switch Light INOP"},{"n":"22-00-18E","t":"Affected MCP Mode Selector Switch (O) PROCEDURES","r":"___ Mode Selector Switch Light INOP"},{"n":"22-00-19","t":"Thrust Mode Display","r":"Date: 29-Sep-2022"},{"n":"23-00-01A","t":"Flight Deck Speaker System","r":"May be inoperative provided: 1. Headset, earphones, or headphones associated with inoperative speaker(s) are installed and operate normally, 2. TCAS audio is considered inoperative and deferred perMEL 34-00-40F, 3. TAWS (GPWS) advisory callouts are considered inoperative and deferred perMEL 34-00-26E, and 4. Altitude Alert Tone is considered inoperative and deferred perMEL 34-00-25B. Note: Refer toMEL 34-00-26E(GPWS Advisory Callouts),MEL 34-00-40F (TCAS Audio), andMEL 34-00-25B (Altitude Alert Tone)."},{"n":"23-00-01B","t":"Flight Deck Speaker System","r":"(O)(M)May be inoperative provided: 1. Procedures do not require its use, 2. Headset earphones or headphones associated with inoperative speaker(s) are installed and operate normally, and 3. Aural Alert voices, TCAS, TAWS (GPWS), Altitude Alert, are verified to operate normally."},{"n":"23-00-02A","t":"Passenger Address System","r":"(O)May be inoperative provided: 1. Alternate, normal and emergency procedures and/or operating restrictions are used, and 2. Flight attendant alerting system (audio or visual) operates normally. Note: Any station that operates normally may be used."},{"n":"23-00-02B","t":"Lavatory Speakers","r":"(O)May be inoperative provided alternate procedures are used."},{"n":"23-00-02C","t":"Cabin Speakers","r":"May be inoperative provided speakers are not adjacent to each other."},{"n":"23-00-03A","t":"VHF Communication Systems","r":"One may be inoperative provided: 1. LEFT (No. 1) VHF Communication System operates normally, and 2. If CENTER (No.3) VHF Communication System is inoperative, ACARS is considered inoperative and deferred perMEL 23-00-09A. Note 1: Refer toAirway Manual, Communications, Communication Equipment Requirem
