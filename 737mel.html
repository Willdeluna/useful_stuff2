\nT2 25-00-05C\nT3 25-00-05E\nT4 25-00-05H\nAttach/Tie Down Points\nA1 25-00-05D\nA2 25-00-05F\nFigure 25-1: B737 Cargo Compartments"},"25-00-05F":{"m":"Refer to Aircraft Loading Manual (ALM):\nB737-900ER Weight and Balance Chapter 3943, Cargo Loading Section.\nB737-800 Weight and Balance Chapter 3991, Cargo Loading Section.\nB737 Cargo Compartment Item (refer to Figure 25-1) MEL Item Number\nDoor Netting\nD1 25-00-05B\nD2 25-00-05G\nTransverse Nets\nT1 25-00-05A\nT2 25-00-05C\nT3 25-00-05E\nT4 25-00-05H\nAttach/Tie Down Points\nA1 25-00-05D\nA2 25-00-05F\nFigure 25-1: B737 Cargo Compartments"},"25-00-05G":{"m":"Refer to Aircraft Loading Manual (ALM):\nB737-900ER Weight and Balance Chapter 3943, Cargo Loading Section.\nB737-800 Weight and Balance Chapter 3991, Cargo Loading Section.\nB737 Cargo Compartment Item (refer to Figure 25-1) MEL Item Number\nDoor Netting\nD1 25-00-05B\nD2 25-00-05G\nTransverse Nets\nT1 25-00-05A\nT2 25-00-05C\nT3 25-00-05E\nT4 25-00-05H\nAttach/Tie Down Points\nA1 25-00-05D\nA2 25-00-05F\nFigure 25-1: B737 Cargo Compartments"},"25-00-05H":{"m":"Refer to Aircraft Loading Manual (ALM):\nB737-900ER Weight and Balance Chapter 3943, Cargo Loading Section.\nB737-800 Weight and Balance Chapter 3991, Cargo Loading Section.\nB737 Cargo Compartment Item (refer to Figure 25-1) MEL Item Number\nDoor Netting\nD1 25-00-05B\nD2 25-00-05G\nTransverse Nets\nT1 25-00-05A\nT2 25-00-05C\nT3 25-00-05E\nT4 25-00-05H\nAttach/Tie Down Points\nA1 25-00-05D\nA2 25-00-05F\nFigure 25-1: B737 Cargo Compartments"},"25-00-06F":{"o":"1. If the baggage restraining bar needs to be removed, Maintenance is required and the Flight crew may not placard.\n2. Advise cabin crew to ensure baggage is not stowed under seats with inoperative or missing restraining bars.\n3. Advise cabin crew to inform passengers occupying seat with affected bar and passenger behind the seat with the\naffected bar not to stow baggage under the seat."},"25-00-06A":{"m":"Install Seat INOP Block-Out Cover part number 25-5136-001 per ERA 10-485792-14MA.\n1. If the seat is stuck in the recline position block off affected seat(s) and the seat directly behind the inoperative\nseat by installing a Seat INOP Block-Out Cover part number 25-5136-001 per ERA 10-485792-14MA. Affected seats\nwould be any seat with blocked access to an aisle by the inoperative seat.\nNote: The inoperative seat or affected seat(s) must not block access to an Emergency Exit or aisle.\n2. If the seatback is loose or blocks access to an Emergency Exit secure upright with a Seat INOP Block-Out Cover\npart number 25-5136-001 per ERA 10-485792-14MA or alternatively for seat backs without AVODinstalled remove\nthe seat back and placard the seatback “MUST REMAIN WITH AIRPLANE” and stow in available closet. Block\noff affected seat directly behind the inoperative seat(s) by installing a Seat INOP Block-Out Cover part number\n25-5136-001 per ERA 10-485792-14MA. Install a Seat INOP Block-Out Placard part number 11-0972-001 per ERA\n10-485792-14MA or equivalent* on seat with removed seat back.\nIn the event that the Seat INOP Block-Out Cover is not available the seat may be made inoperative per one of the\nfollowing provisions provided the MCC is contacted to schedule the installation of a Seat INOP Block-Out Cover at the\nnext maintenance station the cover is available:\n1. Secure the inoperative seat in the upright position and block seat per MEL applicable Remarks or Exceptions\nand placard “DO NOT OCCUPY” by installing a Seat INOP Block-Out Placard part number 11-0972-001 per ERA\n10-485792-14MA or equivalent*.\n2. If the recline mechanism is inoperative, ensure the seat remains in the upright position otherwise secure the\nseat in the upright or break over position as required maintaining a pleasant and professional appearance and\nblock off affected seat(s) and the seat directly behind the inoperative seat per MEL applicable Remarks or\nExceptions and placard “DO NOT OCCUPY” by installing a Seat INOP Block-Out Placard part number 11-0972-001\nper ERA 10-485792-14MA or equivalent*. Affected seats would be any seat with blocked access to an aisle by the\ninoperative seat.\nNote: The inoperative seat or affected seat(s) must not block access to an Emergency Exit or aisle.\n3. If the seatback is loose or blocks access to an Emergency Exit and the seat back does not have AVOD installed\nremove seatback and block off affected seat directly behind the inoperative seat per MEL applicable Remarks or\nExceptions and placard “DO NOT OCCUPY” by installing a Seat INOP Block-Out Placard part number 11-0972-001\nper ERA 10-485792-14MA or equivalent*. Placard seatback, “MUST REMAIN WITH AIRPLANE” and stow in available\ncloset. Seat back is to remain in closet until removed by maintenance for repair or re–installation. For seats with\nAVOD installed see prior step.\n*An acceptable alternative to the “DO NOT OCCUPY” placard is to apply a one or two sections of 2 inch wide masking\ntape as required over the head rest area (seat bottom if seat back is removed) with the words “UNSERVICEABLE – DO\nNOT USE” printed neatly and legibly in 1.5 inch black or red letters and contacting MCC to schedule the installation of\nthe approved Seat INOP Block-Out Cover part number 25-5136-001 and/or Seat INOP Block-Out Placard part number\n11-0972-001.25-00-06B"},"25-00-06B":{"m":"-800 Ships 3701 thru 3742 and 3744 thru 3773 without Recaro Seats:\nSecure seat by disconnecting the control cable at the seat cylinder or by locking the seat cylinder in the full upright\nposition.\n-800 Ships 3774 thru 3777, -900 Ships 3801-3930, and -900 Ships 3931-3963 Post AA 2500-01847:\nFor coach seats, secure seat by disconnecting the control cable at the seat cylinder or by locking the seat cylinder in\nthe full upright position by one of the following methods:\n1. Install nylon tie-wraps(s) around threaded area to restrict travel of hydrolok.\n2. Turn stroke limiting adjustment nut to obtain 0.00 stroke. Tighten jam nut against limiting adjustment nut.\nLink to Learning Video\nFigure 25-2: -800 Ships 3774 - 3777 and 3801 - 3930 and -900 Ships 3931-3963 Post AA 2500-01847 Coach Seat\nHydrolok\n-900 Ships 3931-3963 pre-AA 2500-01847:\nFor Coach Seats, secure seat back in the full upright position by locking out the recline as follows:\n1. Lock out the recline by moving the seat back to the full upright position.\n2. Turn the jam nut to UltraLOC and tighten.\nNote: Do not over tighten jam nut. Damage to UltraLOC may occur.\nFigure 25-3: Ships 3931 - 3963 Pre-AA 2500-01847 Coach Seat UltraLOC\n-800 Ships 3774 thru 3777, -900 Ships 3801-3930, 3931-3942, 3953, 3954, 3957-3963, and -900 Ships 3943-3952,\n3955, and 3956 Post AA 2500-01847:\nTo secure the recline on Zodiac seat assemblies:\n1. To lock the seat in the TTL position, add spacers on recline lock shaft to prevent movement per CMM 25-20-148\nPage 8001.\nFigure 25-4: Ships 3774-3777 and 3801-3930, 3931-3942, 3953,3954, 3957-3963, and Post AA 2500-01847 Ships\n3943-3952, 3955, and 3956 First Class Recline Mechanism\n-900 Ships 3943-3952, 3955, 3956 Pre-AA 2500-01847\nFor First Class Seats, secure seat back in the full upright position by locking out the recline as follows:\n1. Place the seat in the fully upright position and disconnect the control cable assembly from the hydraulic lock.\n2. Remove the retaining ring from the adjuster sleeve on the hydraulic lock. (Refer to Figure 25-5 Hydraulic Lock\nAssembly)\nFigure 25-5: Hydraulic Lock Assembly\n3. Rotate the collar on adjuster sleeve clockwise until the adjusting nuts touch the stop. (Refer to Figure 25-6\nHydraulic Lock Stop)\nNote: Once the adjusting nuts hit the stop, the collar will stop turning.\nFigure 25-6: Hydraulic Lock Stop\n4. Align the notches on the bottom of the adjuster sleeve into the tabs to lock the adjustment into place. (Refer to\nFigure 25-7 Hydraulic Lock Notches and Tabs)\nFigure 25-7: Hydraulic Lock Notches and Tabs\n5. Re-install the retaining ring.\n-800 ships 3744-3773 with Recaro seats\n1. Remove the seat cushion from the affected seat.\n2. Remove seat bottom from the affected seat.\n3. Lock seat in the Taxi, Takeoff, and Landing position:\nA. Move the backrest to the upright position.\nB. If the control cable or the release mechanism is damaged, the backrest needs to be moved manually to the\nupright position.\nC. Press the release mechanism together and move the backrest simultaneously to upright position.\nD. Remove cap (2), use Screwdriver (6) as shown.\nE. Basic adjustment by spacer washers (3).\nF. For actuator blocking:\ni. Installed as many spacer washers onto the position rod of the actuator as required for blocking the recline\nactuator.\nii. Checking the backrest blocking.\nG. Fine adjustment if necessary:\ni. Loosen setscrew (4) and turn alloy washer (5) until required adjustment is reached.\nH. Tighten setscrew (4) and move cap (2) into locked position, alloy washer (5).\n4. Reinstall the seat bottom.\n5. Reinstall the seat cushion.\nFigure 25-8: Recaro Passenger Seat Recline"},"25-00-06D":{"m":"1. Ensure the affected arm rest does not block access to an emergency exit or the aisle. If the arm rest needs to be\nremoved, Maintenance is required and the Flight crew may not placard.\n2. Secure seat by disconnecting the control cable at the seat cylinder or by locking the seat cylinder in the full upright\nposition."},"25-00-12A":{"o":"Captain to brief Lead Flight Attendant/Purser that the crewmember assign to the affected position has an equivelant\noperative flashlight readily available.","m":"Location placarding must be removed or obscured."},"25-00-12C":{"o":"PRIOR TO EACH DEPARTURE\nCaptain to brief Lead Flight Attendant/Purser that one or more flashlight(s) must be verified to be operational PRIOR\nTO EACH DEPARTURE."},"25-00-12B":{"m":"Location placarding must be removed or obscured."},"25-00-17A":{"o":"1. Re-seal the unit in a manner that will identify it as a unit that cannot be mistaken for a fully serviceable unit.\n2. Captain to inform Lead Flight Attendant/Purser of inoperative or missing emergency equipment.","m":"Location placarding is removed or obscured."},"25-00-17C":{"o":"1. Re-seal the unit in a manner that will identify it as a unit that cannot be mistaken for a fully serviceable unit.\n2. Captain to inform Lead Flight Attendant/Purser of inoperative or missing emergency equipment.","m":"Location placarding is removed or obscured."},"25-00-17F":{"o":"1. Re-seal the unit in a manner that will identify it as a unit that cannot be mistaken for a fully serviceable unit.\n2. Captain to inform Lead Flight Attendant/Purser of inoperative or missing emergency equipment.","m":"Location placarding is removed or obscured."},"25-00-17B":{"o":"PRIOR TO EACH DEPARTURE\nIf seals are broken, PRIOR TO EACH DEPARTURE, verify the First Aid Kit contains the following:\n1 pair Protective Gloves or equivalent 1 pair Bandage Scissors\n1 pkg Ammonia Inhalants (10/pkg) 1 pkg 1 Inch Adhesive Bandages (16/pkg)\n2 rolls Adhesive Tape 4 pkg 4 Inch Gauze Bandages (1/pkg)\n2 pkg Wire Splints (1/pkg) 5 pkg 40 Inch Triangular Bandages (1/pkg)\n2 pkg Antibiotic Ointment Packets or Antiseptic Wipes\n(10/pkg)\n8 pkg 4 Inch Compress Bandages (1/pkg)"},"25-00-17D":{"o":"PRIOR TO EACH DEPARTURE\nCaptain to brief Lead Flight Attendant/Purser that AED must be verified to be operational PRIOR TO EACH DEPARTURE."},"25-00-17H":{"o":"PRIOR TO EACH DEPARTURE\nCaptain to brief Lead Flight Attendant/Purser that one or more EEMKs have inoperative, damaged, or missing seals and\nmust be inventoried PRIOR TO EACH DEPARTURE."},"25-00-18D":{"o":"On aircraft equipped with single cell adult life vests, an infant life vest is normally available for each occupant under\n35 pounds for extended overwater operations. In the event that there are not enough infant life vests onboard for the\nextended overwater operation and all attempts have been made to locate and board additional infant life vests, notify\nan Airport Customer Service (ACS) Agent so that they can initialize their passenger handling procedures."},"25-00-18E":{"o":"If life raft is missing (removed), refer to the following Performance Adjustment:"},"25-00-21A":{"m":"For an inoperative recline mechanism, ensure the seat is secured in a position acceptable to the affected crewmember\nby performing a functional test to verify the seat back cannot be moved. Also verify that full travel of the seat on its\ntrack is not impaired."},"25-00-21B":{"m":"For an inoperative vertical adjustment mechanism, perform a functional test to verify the seat cannot be moved in\na vertical direction. If necessary, secure the seat in a fixed vertical position by disconnecting the vertical adjustment\noperating cable or removing the vertical adjustment pushrod mechanism, as appropriate."},"25-00-21C":{"m":"Secure an inoperative armrest in the up position or remove from seat.\nNote: If necessary to remove armrest, Maintenance is Required and the Flight Crew May NOT Placard."},"25-00-22A":{"o":"Captain to verify with Lead Flight Attendant/Purser that sufficient galley/cabin waste receptacles are available to\naccommodate all waste that may be generated on the flight.","m":"1. Refer to the Remarks or Exceptions column.\n2. Using suitable pressure sensitive tape, secure waste receptacle access door(s) or cover(s) closed."},"25-00-22B":{"o":"Refer to the Remarks or Exceptions column.","m":"1. Place a strip of Red Colored OM2 UNSERVICEABLE – DO NOT USE tape (or equivalent*) diagonally across the\nlavatory door, and across the waste receptacle access to prevent use.\n* An acceptable alternate to the OM2 tape is a section of 2 inch wide tape with the words “UNSERVICEABLE – DO\nNOT USE” printed legibly in 1 inch black letters.\n2. Lock the lavatory closed."},"25-00-24B":{"o":"Crewmembers are advised of inoperative bins. Passengers are briefed that associated bin or compartment is not used.","m":"1. Removed affected door. Securely store the removed door if it remains on the aircraft.\n2. Placard the affected bin, compartment, or closet using high visibility tape or a section of 2 inch wide masking tape\nwith the words “DO NOT USE” printed legibly in 1 inch black letters."},"25-00-24A":{"m":"1. Empty compartment (except for permanently affixed items).\n2. Using suitable pressure sensitive tape (i.e., bag bin tape, nylon or fiberglass reinforced tape, not masking tape,\netc.), secure compartment CLOSED.\n3. Placard compartment using ”Inoperative Cabin Appearance” placard or equivalent.\n4. The following items are considered “emergency equipment” and may not be relocated:\n○ Fire Extinguishers\n○ Megaphones\n○ Flashlights\n○ EEMK\n○ AED\n○ PBE\n○ Passenger Oxygen Bottles\n○ First Aid Kits\n5. Except for the items listed above, cabin equipment may be relocated provided:\nA. Location placarding (if installed) of the affected item is removed or obscured.\nB. Install temporary location placard on the outside of compartment / bin specifying the new location.\nC. Install temporary placard on the outside of compartment / bin where the item has been relocated.\nD. Note location of relocated equipment on aircraft logbook placard."},"25-00-24C":{"m":"1. Placard the affected bin, compartment, or closet using high visibility tape or a section of 2 inch wide masking tape\nwith the words “DO NOT USE” printed legibly in 1 inch black letters."},"25-00-24E":{"m":"1. Ensure the Key Lock is inoperative in the unlocked position.\n2. Ensure the associated door will stay latched closed. If door will not latch closed, the entire compartment must be\nconsidered inoperative and deferred per MEL 25-00-24A."},"26-00-03B":{"o":"1. PRIOR TO EACH DEPARTURE:\nA. Captain to brief Lead Flight Attendant/Purser that affect fire extinguisher must be verified for proper\ninstallation and servicing PRIOR TO EACH DEPARTURE."},"26-00-03A":{"m":"1. Cockpit HALON or HALON-FREE extinguisher must be operative.\n2. FWD and AFT Cabin HALON or HALON-FREE extinguishers must be operative.\n3. Use tape or other suitable means, cover affected fire extinguisher bottle location placarding.\nNote: For locations with two fire extinguisher bottles installed, do NOT cover placard if remaining bottle is\noperative."},"26-00-04":{"o":"1. After takeoff, avoid the possibility of retracting a wheel overheated from dragging brakes by leaving landing\ngear extended for 10 minutes. Performance for the two-engine/gear down configuration is better than for the\nengine-out/gear up configuration.\n2. In case of engine failure after V1, performance is the prime consideration. Landing gear should be retracted until\nobstruction clearance requirement has been met, then extended for a 10 minute cooling period.\n3. Pilots must consider the possibility of ice accumulation due to delayed landing gear retraction during winter\noperations from contaminated runways.\n4. Observe max gear down speed until landing gear is retracted.","m":"Deactivate the wheel well fire detection system.\n1. Perform a Compartment Overheat Detection Control (CODC) Module Unit “LOCAL TEST” (reference AMM\n26-18-01-740-801 C. (2)).\n2. If the fault code from the CODC “LOCAL TEST” is other than “84” or “MWW LOOP A FIRE” or “MWW LOOP B FIRE”,\nperform the following:\nA. Remove the two light bulbs from the WHEEL WELL light on the P8 panel.\nB. Disconnect the fire bell:\ni. Remove Flight Control Computer B (reference AMM 22-11-33) to get access to the wiring for the fire bell.\nii. Disconnect the wires from D742, pin 16 and pin 25 on the E1-4 shelf.\niii. Cap and stow the wires.\niv. Install Flight Control Computer B (reference AMM 22-11-33).\n3. If the fault code from the CODC “LOCAL TEST” is “84” or “MWW LOOP A FIRE” or “MWW LOOP B FIRE”, the wheel\nwell fire alarm function is the source of the fault. Perform the following:\nA. Disconnect the terminal lugs or connectors D840 and D842 (if installed) on both sides of the detection element.\nNote: Ships 3772-3777 and 3801-3963 do not have connectors D40 and D842.\nB. Perform a second CODC “LOCAL TEST” (reference AMM 26-18-01-740-801 C. (2)).\nC. If the second CODC “LOCAL TEST” presents any fault codes, perform the following:\ni. Reconnect connectors D840 and D842.\nii. Remove the two light bulbs from the WHEEL WELL light on the P8 panel.\niii. Disconnect the fire bell:\na. Remove Flight Control Computer B to get access to the wiring for the fire bell.\nb. Disconnect the wires from D742, pin 16 and pin 25 on the E1-4 shelf.\nc. Cap and stow the wires.\nd. Install Flight Control Computer B.\nD. If the second CODC “LOCAL TEST” shows no faults, perform the following:\ni. Stow the wiring going into connector D840 and D842 near the detector element.\nii. Perform the Overheat/Fire Warning System Test per AMM 26-18-00. All tests should pass except for the\nwheel well fire function with the disabled element."},"26-00-08A":{"o":"1. Dispatch is not allowed if the APU is required by other procedures.\n2. Use (O) procedure for inoperative APU per MEL 49-00-01A.\nNote: The MASTER CAUTION lights and the OVHT/DET system annunciator light do not illuminate during the\nFault/Inop test. The MASTER CAUTION lights and the OVHT/DET system annunciator light will illuminate\nduring a system annunciator panel recall.\nNote: When performing the Operations Manual, Volume 1, Supplementary Procedures, Engines APU, Battery Start,\nthe fire warning bell may not sound and the master FIRE WARN lights may not illuminate.","m":"1. Pull and secure the FIRE PROTECTION DETECTION APU circuit breaker on the P6-2 panel located at A23.\n2. Defer APU per MEL 49-00-01A.\nNote: To prevent nuisance/false warnings, the FIRE PROTECTION DETECTION APU circuit breaker can be pulled and\nsecured. With this circuit breaker open, the MASTER CAUTION lights and the OVHT/DET system annunciator\nlight do not illuminate during the Fault/Inop test. The APU DET INOP light will remain illuminated and\nthe MASTER CAUTION lights and the OVHT/DET system annunciator light will illuminate during a system\nannunciator panel recall."},"26-00-08B":{"o":"PRIOR TO EACH DEPARTURE:\nPerform OVERHEAT/FIRE test per Operations Manual, Volume 1, Supplementary Procedures, Engines APU, Battery\nStart.\nNote: If the APU DET INOP light does not illuminate but the APU Fire Warning switch illuminates during\nOVERHEAT/FIRE test, the APU fire detection system is operating normally. The APU can be used if the\nOVERHEAT/FIRE test is performed before each APU start."},"26-00-09B":{"o":"PRIOR TO EACH DEPARTURE\n1. Reference the following Operations Manual, Volume 1, Procedures:\nA. Normal Procedures - Amplified Procedures - Preflight Procedure - First Officer.\nB. Supplementary Procedures – Electrical - Electrical Power Up.\n2. Verify remaining APU squib test circuit operates normally in the “EXTINGUISHER TEST Switch - Check”:\nA. EXT TEST switch in position 1 or 2, APU green extinguisher test light illuminates.\nB. Release EXT TEST switch, APU green extinguisher test light extinguishes."},"26-00-09C":{"o":"1. Dispatch is not allowed if the APU is required by other procedures.\n2. APU is not used."},"26-00-09A":{"m":"1. Fabricate a squib test lamp with pigtail leads terminating in size #8 lugs or alligator clips, using lamp P/N 387 (28\nVolt, 40 Milliamp) in suitable holder.\nCAUTION RESTRICT PERSONNEL FROM FIRE BOTTLE AREA WHILE TESTING. LIMIT SQUIB CURRENT TO 50\nMILLIAMPERES MAXIMUM.\nONCE EACH FLIGHT DAY\n1. Verify that the squib circuit is operative as follows:\nA. For Engines:\ni. Open the two / four engine fire extinguisher circuit breakers on the P6-2 Panel as identified in the ENGINE\nSQUIB TEST TABLE on the following page.\nii. Gain access to the P6-2 circuit breaker panel.\niii. Connect the test lamp across the terminals of the appropriate circuit breaker for the inoperative test light\ncircuit to be tested.\niv. Pull out the Engine Fire Handle Switch for the suspect system by depressing the override button. Rotate\nthe Engine Fire Handle to one side to confirm squib circuit continuity.\nv. Test lamp illuminated indicates intact squib.\nvi. Remove test lamp from the circuit breaker and close all of the circuit breakers opened in Step 1.\nB. For APU:\ni. Open the APU fire extinguisher circuit breaker on the P6-2 panel.\nii. Gain access to the P6-2 circuit breaker panel.\niii. Connect the test lamp across the terminals of the APU fire extinguisher circuit breaker for the inoperative\ntest light circuit to be tested.\niv. Pull out the APU Fire Handle Switch for the suspect system by depressing the override button. Rotate the\nAPU Fire Handle to one side to confirm squib circuit continuity.\nv. Test lamp illuminated indicates intact squib.\nvi. Remove test lamp from the circuit breaker and close the circuit breaker opened in Step 1.\nBOTTLE SQUIB NO. SQUIB PLUG NO. C / B OPEN and TEST LAMP CONNECTION\nLeft\nLeft\nLeft\nLeft\nRight\nRight\nRight\nRight\n1\n1\n2\n2\n1\n1\n2\n2\nD582, Pin 4\nD582, Pin 6\nD1322, Pin 4\nD1322, Pin 6\nD584, Pin 4\nD584, Pin 6\nD1324, Pin 4\nD1324, Pin 6\nAcross C296 Left Ext Bottle\nAcross C1021 Left Ext Bottle\nAcross C296 Left Ext Bottle\nAcross C1021 Left Ext Bottle\nAcross C297 Right Ext Bottle\nAcross C1022 Right Ext Bottle\nAcross C297 Right Ext Bottle\nAcross C1022 Right Ext Bottle"},"26-00-12A":{"o":"1. Limit altitude to FL 250.\n2. Refer to MEL 21-00-01A, for (O) procedures.\n3. Except for engine start, do not use the APU for pneumatic air supply and/or electrical power.\n4. After engine start, make sure that:\nA. ISOLATION VALVE switch is set to CLOSE\nB. APU switch is set to OFF\nC. Engine No. 1 BLEED air switch is set to OFF.\nD. L PACK switch is set to OFF\nE. R PACK set as desired.\n5. Do not dispatch into known or forecast icing conditions.","m":"1. Defer the left air conditioning pack per MEL 21-00-01A, or MEL 21-00-01D as applicable."},"26-00-12B":{"o":"1. Limit altitude to FL 250.\n2. Refer to MEL 21-00-01D for (O) procedures.\n3. Except for engine start, do not use the APU for pneumatic air supply and/or electrical power.\n4. After engine start, make sure that:\nA. ISOLATION VALVE switch is set to CLOSE\nB. APU switch is set to OFF\nC. Engine No. 1 BLEED air switch is set to OFF.\nD. L PACK switch is set to HIGH\nE. R PACK set as desired.\nF. R RECIRC FAN switch is set to OFF.\n5. Do not dispatch into known or forecast icing conditions.","m":"1. Defer the left air conditioning pack per MEL 21-00-01A, or MEL 21-00-01D as applicable."},"26-00-13A":{"o":"1. Limit altitude to FL 250.\n2. Refer to MEL 21-00-01B for (O) procedures.\n3. After engine start, make sure that:\nA. ISOLATION VALVE switch is set to CLOSE.\nB. Engine No. 2 BLEED air switch is set to OFF.\nC. R PACK switch is set to OFF\nD. L PACK as desired.\n4. Do not dispatch into known icing or forecast icing conditions.\n5. Increased air flow will occur when flaps are extended (takeoff and landing) if the APU is used instead of engine\nbleed to supply bleed air to the left pack.\n6. With the L PACK switch in AUTO, the pack operates in the high flow mode.\n7. Do not set the L PACK to HIGH for takeoff and landing with the engine bleed on.\n8. Do not use APU bleed air at altitudes above 17,000 feet.","m":"1. Defer the right air conditioning pack per MEL 21-00-01B or 21-00-01E as applicable."},"26-00-13B":{"o":"1. Limit altitude to FL 250.\n2. Refer to MEL 21-00-01E for (O) procedures.\n3. After engine start, make sure that:\nA. ISOLATION VALVE switch is set to CLOSE.\nB. Engine No. 2 BLEED air switch is set to OFF.\nC. R PACK switch is set to HIGH\nD. L PACK as desired.\nE. R RECIRC FAN switch is set to OFF.\n4. Do not dispatch into known icing or forecast icing conditions.\n5. Increased air flow will occur when flaps are extended (takeoff and landing) if the APU is used instead of engine\nbleed to supply bleed air to the left pack.\n6. With the L PACK switch in AUTO, the pack operates in the high flow mode.\n7. Do not set the L PACK to HIGH for takeoff and landing with the engine bleed on.\n8. Do not use APU bleed air at altitudes above 17,000 feet.","m":"1. Defer the right air conditioning pack per MEL 21-00-01B or 21-00-01E as applicable."},"26-00-15B":{"o":"Make sure that the associated lavatory is kept locked and is not entered except for use or inspection by crew members.","m":"For an inoperative lavatory smoke detection system:\n1. Empty the waste receptacles.\n2. Lift the flap above the OCCUPIED/VACANT indicator and slide the lock to OCCUPIED.\n3. Placard door \"INOPERATIVE - DO NOT ENTER\".Place a strip of Red Colored OM2 UNSERVICEABLE – DO NOT USE\ntape (or equivalent*) diagonally across the lavatory door.\nNote: An acceptable alternate to the OM2 tape is a section of 2 inch wide tape with the words\n“UNSERVICEABLE – DO NOT USE” printed legibly in 1 inch black letters."},"26-00-16A":{"o":"Make sure that the associated lavatory is kept locked and is not entered except for use or inspection by crew members.","m":"For an inoperative lavatory smoke detection system:\n1. Empty the waste receptacles.\n2. Lift the flap above the OCCUPIED/VACANT indicator and slide the lock to OCCUPIED.\n3. Place a strip of Red Colored OM2 UNSERVICEABLE – DO NOT USE tape (or equivalent*) diagonally across the\nlavatory door.\nNote: An acceptable alternate to the OM2 tape is a section of 2 inch wide tape with the words\n“UNSERVICEABLE – DO NOT USE” printed legibly in 1 inch black letters."},"26-00-16B":{"m":"For each smoke detector, do the lavatory smoke detection system test (AMM 26-14-00/501)."},"26-00-16C":{"m":"For the associated smoke detector, do the lavatory smoke detection system test (AMM 26-14-00/501)."},"26-00-19A":{"o":"Refer to Remarks or Exceptions Column"},"26-00-19B":{"o":"Note: If a Cargo Fire Panel FWD or AFT warning light fails to illuminate during system test, one or more detection\nloops for the associated compartment is inoperative.\nTo determine specific inoperative loop(s):\n1. Position the Cargo Fire Panel FWD and AFT DET SELECT Switch to A.\n2. Press and hold Cargo Fire Panel TEST switch.\n3. Verify that the following indications occur within 4 seconds:\nA. Fire Bell sounds.\nB. Both Master FIRE WARN lights illuminate.\nC. Cargo Fire Panel FWD and AFT warning lights illuminate.\nD. Cargo Fire Panel DISCH light illuminates.\nE. Cargo Fire Panel EXT FWD and EXT AFT lights illuminate.\n4. If one or more smoke detectors in LOOP A is inoperative, the Cargo Fire Panel DETECTOR FAULT Light will illuminate\nand the associated FWD or AFT warning light will remain extinguished for the cargo compartment with the\ninoperative detector.\n5. Release the Cargo Fire Panel TEST switch. The DETECTOR FAULT light remains illuminated if a loop failure is\ndetected in either the forward or aft cargo compartment. Otherwise all indications will clear within half a second.\n6. Position Cargo Fire Panel FWD and AFT DET SELECT switch to B and repeat the above test (Steps 2 through 5).\n7. Select the operable loop(s) with the Cargo Fire Panel DET SELECT switches. Conduct a cargo fire test with the\nswitches in the positions selected for flight, and ensure a good test result. One detection loop (A or B) must\noperate normally in each cargo compartment or cargo loading restrictions must be observed."},"26-00-19C":{"o":"Refer to Remarks or Exceptions Column\nNote: With Extinguisher Bottle No.2 inoperative, fire suppression capability is reduced to 60 minutes, airplane\nmust remain within 60 minutes of a suitable airport.","m":"Do these steps to prevent anomalies in the indication of the DISCH light during operation and the EXT FWD test light\nduring system test.\n1. Disconnect, cap and stow electrical connector D12816 on the Extinguisher Bottle No. 2 pressure switch.\n2. Disconnect electrical connectors D12820 and D12818 from the Extinguisher Bottle No. 2 squibs.\n3. Install a jumper across pins 1 and 2 on both connectors. Cap and stow connectors."},"26-00-19F":{"o":"Before each flight, do a test of the cargo fire detection and suppression system using the TEST switch on the cargo fire\npanel. Refer to Operations Manual Volume 1, Supplementary Procedures for test."},"26-00-19D":{"m":"ONCE EACH FLIGHT DAY:\nDo these steps for an inoperative DISCH light circuit to make sure that the fire extinguisher bottle has an adequate\ncharge:\n1. Build a test lamp (28 Volts DC/40 milliamps) with pigtail leads terminating in pin contacts in a suitable holder.\nNote: Any suitable lamp (P/N 387) or digital multimeter can be used.\n2. Remove the Cargo Fire Panel.\n3. Disconnect the electrical connector D12760 from the panel.\n4. Connect the test lamp or digital multimeter between the airplane side of connector D12760, Pin 48 (+28 volt\nsource for Bottle No. 1) and Pin 28 (pressure switch ground).\n5. For ships 3774-3777, 3853-3898, and 3931-3963 with Extinguisher Bottle No. 2:\nA. Connect test lamp or digital multimeter between the airplane side of connector D12760, Pin 45 (+28 volt\nsource for Bottle No. 2) and Pin 28 (pressure switch ground).\n6. If the test lamp remains extinguished or the digital multimeter indicates an open circuit the associated bottle has\nan adequate charge.\n7. Remove the test lamp.\n8. Reconnect the electrical connector D12760 to the panel.\n9. Install the Cargo Fire Panel."},"26-00-19E":{"m":"ONCE EACH FLIGHT DAY:\nDo these steps for an inoperative EXT light circuit to verify normal operation of associated squib circuit:\n1. Build a test lamp (28 Volts DC/40 milliamps) with pigtail leads terminating in pin contacts in a suitable holder.\nA. Any suitable lamp (P/N 387) can be used.\n2. Remove the Cargo Fire Panel.\nDisconnect the electrical connector D12760 from the panel.\nCAUTION\nTO PREVENT INJURY, RESTRICT PERSONNEL FROM EXTINGUISHER BOTTLE AREA DURING SQUIB\nCIRCUIT TEST. LIMIT CURRENT TO 40 MILLIAMPS MAXIMUM DURING TEST. USE TEST LAMP (28\nVOLT, 40 MILLIAMPS ONLY). DO NOT USE A MULTIMETER.\n3. Use the table below to determine which pin numbers to connect between the test lamp and the airplane side of\nconnector D12760.\nA. If the test lamp illuminates, the squib circuit is intact.\nTEST LAMP CONNECTION\nBottle Squib Squib Plug No. Pin No. (+28 Vdc\nSource)\nPin No. (Ground\nPath)\n1 FWD D12794 D12760, Pin 48 D12760, Pin 26\n1 AFT D12796 D12760, Pin 48 D12760, Pin 24\n2 FWD D12818 D12760, Pin 45 D12760, Pin 12\n2 AFT D12820 D12760, Pin 45 D12760, Pin 23\n4. Remove the test lamp.\n5. Reconnect electrical connector D12760 to the panel.\n6. Install the Cargo Fire Panel."},"27-00-04C":{"o":"Program KIAS/Mach speed restriction in FMS.\nWith forward position indicator lights inoperative and one SLATS annunciator panel light inoperative:\n1. PRIOR TO EACH TAKEOFF AND LANDING, verify leading edge slat position for the inoperative indication.\n2. Limit airspeed:\nA. At or below FL 200, limit airspeed to 300 KIAS.\nB. Above FL 200, limit airspeed to 0.65 Mach.\nNote: Refer to ODM, Flight Planning Section, Buffet Onset Boundary Speeds chart for maintaining minimum\nmaneuvering speeds.\nNote: VNAV will limit the speed target to 230 KIAS unless speed intervention is used.","m":"With forward position indicator lights inoperative and one SLATS annunciator panel light inoperative:\n1. Perform Flaps cycle by extending and retracting the TE and LE flaps.\n2. Verify that the remaining LE DEVICES annunciator panel (P5) lights operate normally during flap extension and\nretraction.\nNote: If an annunciator panel TRANSIT light fails to illuminate while the corresponding device is in motion, then\nthis light must be considered inoperative.\nNote: This MEL item is applicable to inoperative leading edge SLAT indications and not the leading edge FLAP\nindications on the LE DEVICES annunciator panel. Dispatch is not allowed if the LE DEVICES annunciator\npanel FLAP lights do not illuminate properly and the forward panel light(s) are inoperative.\n3. After verification of a single inoperative LE Slat Position light, determine and record which TE Flap position settings\ncause this failure.\nA. If faulty indication on overhead annunciator panel can be replicated on the ground, record which TE Flap\nposition settings causes this failure.\nB. If faulty indication on overhead annunciator panel cannot be replicated on the ground, use FSEU BITE to\ndetermine if an FSEU input has been recently faulty.\ni. If FSEU BITE (Flight Leg 0) indicates fault message codes 27-81200 through 27-81223 or 27-81225 through\n27-81236, pull and secure the Stall Warning Asymmetry Mode circuit breaker on the P18-2 Panel.\nii. If FSEU BITE does not yield one of these fault codes because the faulty overhead indication light(s) flashes\nON/OFF for an instant such that the fault does not latch, first confirm that the applicable slat is stationary\nin the position where the intermittent indication was observed, then pull and secure the Stall Warning\nAsymmetry Mode circuit breaker.\n4. Remove the bulbs from the associated forward position indicator light(s) on the center instrument panel, P2.\n5. Use this data to make a placard and put it adjacent to the annunciator panel:\n737-800 except aircraft 3774 thru 3777 737-900ER and aircraft 3774 thru 3777\nFlap positions 1 thru 5:\n○ All slats in EXT position\n○ LE flaps extended\nFlap positions 10 thru 40:\n○ All slats in FULL EXT position\n○ LE flaps extended\nFlap positions 1 thru 25:\n○ All slats in EXT position\n○ LE flaps extended\nFlap positions 30 and 40:\n○ All slats in FULL EXT Position\n○ LE flaps extended\n6. Using the information recorded in step 3, set flaps to the position which produces the faulty indication.\n7. Verify that the leading edge and trailing edge devices are in the correct position.\n8. Verify normal operation of both Stall Warning Systems:\nNote: For -800, except 3774 thru 3777 aircraft, if the inoperative slat indication occurs at more than one flap\nposition, repeat the procedure to verify normal operation of both Stall Warning Systems at Flaps 0, Flaps\n1 and Flaps 10.\nNote: For -900ER aircraft and -800 aircraft 3774 thru 3777, if the inoperative slat indication occurs at more\nthan one flap position, repeat the procedure to verify normal operation of both Stall Warning Systems at\nFlaps 0, Flaps 1 and Flaps 30.\nA. Verify that hydraulic system B pressure is between 2900 and 3100 psi.\nB. While monitoring the control column for stick shaker operation, push and hold STALL WARNING TEST NO. 1 and\nNO. 2 switch on the stall warning test module (P5 Overhead Panel).\nC. Check that the control column stick shakers operate normally.\nD. If both stick shakers fail to operate normally, pull and secure the Stall Warning Asymmetry Mode circuit breaker\non the P18-2 Panel if not already accomplished in step 5 above, and then repeat test in steps B and C.\n9. If the stick shaker tests are normal the airplane can be dispatched."},"27-00-04D":{"o":"Program KIAS/Mach speed restriction in FMS.\nWith forward position indicator lights inoperative and one SLATS annunciator panel light inoperative:\n1. PRIOR TO EACH TAKEOFF AND LANDING, verify leading edge slat position for the inoperative indication.\n2. Limit airspeed:\nA. At or below FL 200, limit airspeed to 300 KIAS.\nB. Above FL 200, limit airspeed to 0.65 Mach.\nNote: Refer to ODM, Flight Planning Section, Buffet Onset Boundary Speeds chart for maintaining minimum\nmaneuvering speeds.\nNote: VNAV will limit the speed target to 230 KIAS unless speed intervention is used.","m":"With forward position indicator lights inoperative and one SLATS annunciator panel light inoperative:\n1. Perform Flaps cycle by extending and retracting the TE and LE flaps.\n2. Verify that the remaining LE DEVICES annunciator panel (P5) lights operate normally during flap extension and\nretraction.\nNote: If an annunciator panel TRANSIT light fails to illuminate while the corresponding device is in motion, then\nthis light must be considered inoperative.\nNote: This MEL item is applicable to inoperative leading edge SLAT indications and not the leading edge FLAP\nindications on the LE DEVICES annunciator panel. Dispatch is not allowed if the LE DEVICES annunciator\npanel FLAP lights do not illuminate properly and the forward panel light(s) are inoperative.\n3. After verification of a single inoperative LE Slat Position light, determine and record which TE Flap position settings\ncause this failure.\nA. If faulty indication on overhead annunciator panel can be replicated on the ground, record which TE Flap\nposition settings causes this failure.\nB. If faulty indication on overhead annunciator panel cannot be replicated on the ground, use FSEU BITE to\ndetermine if an FSEU input has been recently faulty.\ni. If FSEU BITE (Flight Leg 0) indicates fault message codes 27-81200 through 27-81223 or 27-81225 through\n27-81236, pull and secure the Stall Warning Asymmetry Mode circuit breaker on the P18-2 Panel.\nii. If FSEU BITE does not yield one of these fault codes because the faulty overhead indication light(s) flashes\nON/OFF for an instant such that the fault does not latch, first confirm that the applicable slat is stationary\nin the position where the intermittent indication was observed, then pull and secure the Stall Warning\nAsymmetry Mode circuit breaker.\n4. Remove the bulbs from the associated forward position indicator light(s) on the center instrument panel, P2.\n5. Use this data to make a placard and put it adjacent to the annunciator panel:\n737-800 except aircraft 3774 thru 3777 737-900ER and aircraft 3774 thru 3777\nFlap positions 1 thru 5:\n○ All slats in EXT position\n○ LE flaps extended\nFlap positions 10 thru 40:\n○ All slats in FULL EXT position\n○ LE flaps extended\nFlap positions 1 thru 25:\n○ All slats in EXT position\n○ LE flaps extended\nFlap positions 30 and 40:\n○ All slats in FULL EXT Position\n○ LE flaps extended\n6. Using the information recorded in step 3, set flaps to the position which produces the faulty indication.\n7. Verify that the leading edge and trailing edge devices are in the correct position.\n8. Verify normal operation of both Stall Warning Systems:\nNote: For -800, except 3774 thru 3777 aircraft, if the inoperative slat indication occurs at more than one flap\nposition, repeat the procedure to verify normal operation of both Stall Warning Systems at Flaps 0, Flaps\n1 and Flaps 10.\nNote: For -900ER aircraft and -800 aircraft 3774 thru 3777, if the inoperative slat indication occurs at more\nthan one flap position, repeat the procedure to verify normal operation of both Stall Warning Systems at\nFlaps 0, Flaps 1 and Flaps 30.\nA. Verify that hydraulic system B pressure is between 2900 and 3100 psi.\nB. While monitoring the control column for stick shaker operation, push and hold STALL WARNING TEST NO. 1 and\nNO. 2 switch on the stall warning test module (P5 Overhead Panel).\nC. Check that the control column stick shakers operate normally.\nD. If both stick shakers fail to operate normally, pull and secure the Stall Warning Asymmetry Mode circuit breaker\non the P18-2 Panel if not already accomplished in step 5 above, and then repeat test in steps B and C.\n9. If the stick shaker tests are normal the airplane can be dispatched."},"27-00-04B":{"m":"Note: For the -800, slat indications for slats 3, 4, 5 and 6 are not allowed to be inoperative due to the inability to\nvisually verify their position from the flight deck.\nNote: For the -900ER, slat indications for slats 2, 3, 4, 5, 6 and 7 are not allowed to be inoperative due to the\ninability to visually verify their position from the flight deck.\nWith forward position indicator lights inoperative:\n1. Cycle the flaps.\n2. Verify that the LE DEVICES annunciator panel (P5) operates normally during flap extension and retraction.\nNote: Dispatch is not allowed if the LE DEVICES annunciator panel FLAP TRANSIT lights do not illuminate\nproperly and the forward panel light(s) are inoperative.\n3. Remove the bulbs from the associated forward position indicator light(s) on the center instrument panel, P2.\n4. Use this data to make a placard and put it adjacent to the LE DEVICES annunciator panel:\n737-800 except aircraft 3774 thru 3777 737-900ER and aircraft 3774 thru 3777\nFlap positions 1 thru 5:\n● All slats in EXT position\n● LE flaps extended\nFlap positions 10 thru 40:\n● All slats in FULL EXT position\n● LE flaps extended\nFlap positions 1 thru 25:\n● All slats in EXT position\n● LE flaps extended\nFlap positions 30 and 40:\n● All slats in FULL EXT Position\n● LE flaps extended"},"27-00-20A":{"o":"For Airspeed limitation items;\nProgram KIAS/Mach speed restriction in FMS.\nRefer to MEL 27-00-07 for procedures applicable to the automatic speed brake system if necessary.","m":"1. Pull and secure ‘SPDBRK AUTOSTOW’ circuit breaker A10 located on P6-2 Panel."},"27-00-20B":{"o":"For Airspeed limitation items;\nProgram KIAS/Mach speed restriction in FMS.\nRefer to MEL 27-00-07 for procedures applicable to the automatic speed brake system if necessary.","m":"1. Pull and secure ‘SPDBRK AUTOSTOW’ circuit breaker A10 located on P6-2 Panel."},"28-00-01A":{"o":"1. Turn the affected boost pump switch (overhead panel) OFF.\nNote: Flight Manual Limitations concerning lateral fuel imbalance must be observed.\n2. The minimum fuel requirements for affected boost pump will assure that the operative boost pump and suction\nfeed inlet remain submerged during rotation to high nose up attitudes during takeoff or go around. In the event\nthe second boost pump in a tank fails, the engine will operate satisfactorily on suction feed. With both tank 1 boost\npumps inoperative, APU operation may become unreliable at altitudes above 25,000 feet.\nNote: At high altitude, thrust deterioration or engine flameout may occur without fuel pump boost pressure.","m":"Pull and secure the affected boost pump circuit breaker on the P91/P92 Distribution Panel located in the E & E\nCompartment."},"28-00-01B":{"o":"1. Turn the affected boost pump switch (overhead panel) OFF.\nNote: Flight Manual Limitations concerning lateral fuel imbalance must be observed.\n2. The minimum fuel requirements for affected boost pump will assure that the operative boost pump and suction\nfeed inlet remain submerged during rotation to high nose up attitudes during takeoff or go around. In the event\nthe second boost pump in a tank fails, the engine will operate satisfactorily on suction feed. With both tank 1 boost\npumps inoperative, APU operation may become unreliable at altitudes above 25,000 feet.\nNote: At high altitude, thrust deterioration or engine flameout may occur without fuel pump boost pressure.","m":"Pull and secure the affected boost pump circuit breaker on the P91/P92 Distribution Panel located in the E & E\nCompartment."},"28-00-02B":{"o":"1. Verify that the zero fuel weight and balance limitations have been accounted for.\n2. Adjust the zero fuel weight of the airplane by including the weight of center fuel tank, or adjust the maximum zero\nfuel weight by subtracting the weight of center tank fuel.\n3. Fuel usage takeoff condition:\nA. Position the CROSSFEED selector to the closed position.\nB. Position the AFT and FWD main tank FUEL PUMP switches to ON for all operating main pumps.\n4. Verify that the operating center tank FUEL PUMP switch is in the OFF position.\nNote: Fuel CONFIG alert may be displayed with fuel in the center tank.\n5. After takeoff:\nA. If the center tank contains usable fuel, position the operating center tank FUEL PUMP switch to ON.\nB. Position the CROSSFEED selector to the open position.\n6. When the center tank LOW PRESSURE light illuminates:\nA. Position the operating center tank FUEL PUMP switch to OFF.\nB. Position the CROSSFEED selector to the closed position.\nNote: Prior to the center tank LOW PRESSURE light illuminating, a fuel imbalance between the main tanks\nmay be indicated as a result of differences in fuel pump output pressures when operating with the\ncrossfeed valve open.\n7. For landing:\nA. Position the operating center tank FUEL PUMP switch to OFF whether or not the center tank contains usable\nfuel.\nB. Position the CROSSFEED selector to the closed position whether or not the center tank contains usable fuel.","m":"1. Position the associated CTR FUEL switch OFF.\n2. Pull and secure the associated center tank fuel pump circuit breaker on the Power Distribution Panel P91 or P92."},"28-00-02D":{"o":"If one center tank fuel boost pump is considered inoperative, use MEL 28-00-02B (O) procedures.","m":"Defer the center tank fuel boost pump(s) per MEL 28-00-02A, 28-00-02B or 28-00-02C as needed."},"28-00-02A":{"m":"1. Position the associated CTR FUEL switch OFF.\n2. Pull and secure the associated center tank fuel pump circuit breaker on the Power Distribution Panel P91 or P92."},"28-00-02C":{"m":"1. Position the associated CTR FUEL switch OFF.\n2. Pull and secure the associated center tank fuel pump circuit breaker on the Power Distribution Panel P91 or P92."},"28-00-03A":{"o":"Observe MEL Item 28-00-01 REMARKS OR EXCEPTIONS requirements and the Operational requirements when\ndispatching with a fuel boost pump low pressure warning system inoperative and the associated fuel pump is not\nused.","m":"Verify the MASTER CAUTION lights and FUEL system annunciator light operate normally in affected main tank.\n1. Reset the MASTER CAUTION lights by pressing either Master Caution light module.\n2. Set fuel boost pump switches in affected fuel tank to OFF.\n3. Confirm MASTER CAUTION lights and FUEL system annunciator panel light illuminate."},"28-00-03D":{"o":"Observe MEL Item 28-00-02 REMARKS OR EXCEPTIONS requirements and the Operational requirements when\ndispatching with a fuel boost pump low pressure warning system inoperative and the associated fuel pump is not\nused.","m":"Verify the MASTER CAUTION lights and FUEL system annunciator light operate normally.\n1. (Ships 3701-3771, 3774-3777)\nA. Set the two CTR FUEL PUMPS switches to OFF.\nB. Pull and secure the associated circuit breakers for both center pumps on Power Distribution Panel P91 and P92.\nC. Reset MASTER CAUTION lights by pressing either MASTER CAUTION light module.\nD. Set the two CTR FUEL PUMPS switches to ON.\nE. Confirm MASTER CAUTION lights and FUEL system annunciator panel light illuminate.\nF. Set the two CTR FUEL PUMPS switches to OFF.\nG. Close the associated circuit breakers for both center pumps on Power Distribution Panel P91 and P92.\nH. Reset MASTER CAUTION lights by pressing either MASTER CAUTION light module.\n2. (Ships 3772,3773, 3801-3963)\nA. Set the two CTR FUEL PUMPS switches to OFF.\nB. Pull and secure the operational center tank fuel boost pump circuit breaker for the center tank pump on Power\nDistribution Panel P91 or P92.\nC. Reset MASTER CAUTION lights by pressing either MASTER CAUTION light module.\nD. Set the operational center tank fuel boost pump switch to ON.\nE. Confirm MASTER CAUTION lights and FUEL system annunciator panel light illuminate after approximately 10\nseconds.\nF. Set the operational center tank fuel boost pump switch to OFF.\nG. Close the operational center tank fuel boost pump circuit breaker on Power Distribution Panel P91 or P92.\nH. Reset MASTER CAUTION lights by pressing either MASTER CAUTION light module."},"28-00-03F":{"o":"When dispatching with one or both center tank fuel pump LOW PRESSURE lights inoperative and center tank fuel is\nto be used, position the two CTR FUEL PUMPS switches to OFF when both the MASTER CAUTION lights and the FUEL\nsystem annunciator panel light illuminate as a result of center tank fuel depletion.","m":"When dispatching with one or both center tank fuel pump LOW PRESSURE lights inoperative and center tank fuel is to\nbe used, the MASTER CAUTION lights and FUEL system annunciator panel light must illuminate when center tank fuel\nis depleted.\nVerify the MASTER CAUTION lights and FUEL system annunciator light operate normally (AMM 28-00-00/901).\n1. (Ships 3701-3771, 3774-3777)\nA. Set the two CTR FUEL PUMPS switches to OFF.\nB. Pull and secure the associated circuit breakers for both center pumps on Power Distribution Panel P91 and P92.\nC. Reset MASTER CAUTION lights by pressing either MASTER CAUTION light module.\nD. Set the two CTR FUEL PUMPS switches to ON.\nE. Confirm that MASTER CAUTION lights and FUEL system annunciator panel light illuminate.\nF. Set the two CTR FUEL PUMPS switches to OFF.\nG. Close the associated circuit breakers for both center pumps on Power Distribution Panel P91 and P92.\nH. Reset MASTER CAUTION lights by pressing either MASTER CAUTION light module.\n2. (Ships 3772, 3773, 3801-3963)\nA. Set the two CTR FUEL PUMPS switches to OFF.\nB. Pull and secure the associated center tank fuel boost pump circuit breaker for the center tank pump on Power\nDistribution Panel P91 or P92.\nC. Reset MASTER CAUTION lights by pressing either MASTER CAUTION light module.\nD. Set the associated center tank fuel boost pump switch to ON.\nE. Confirm MASTER CAUTION lights and FUEL system annunciator panel light illuminate after approximately 10\nseconds.\nF. Set the associated center tank fuel boost pump switch to OFF.\nG. Close the associated circuit breaker on Power Distribution Panel P91 or P92.\nH. Reset MASTER CAUTION lights by pressing either MASTER CAUTION light module."},"28-00-07A":{"o":"Note: Fuel On Board is automatically displayed and cannot be overwritten by the pilot unless fuel quantity\nindication displays dashes.\nNote: The automatic flight VNAV mode will not be available.\nNote: If VNAV capability is desired during approach, enter current fuel on-board into the FMC at top of descent.","m":"1. Center Fuel Quantity: Intermittent, Erroneous Reading or Indication Showing Dashes\n○ If fuel quantity indication shows dashes, the fuel quantity will not need to be deactivated. (Flight crew may\nplacard)\n○ If fuel quantity is intermittent, FMS inputs incorrect fuel into flight plan erasing crew entered fuel – Fuel\nquantity will need to be deactivated. (Maintenance will be required – flight crew may not placard)\n○ If fuel quantity is reading erroneously high or low – Fuel quantity will need to be deactivated. (Maintenance\nwill be required – flight crew may not placard)\n2. Center Tank Deactivation / Reactivation\n○ Deactivate center tank fuel quantity per AMM Task 28-00-00-040-808 using harness, fuel quantity indication\nsystem deactivation tool (Jumper Harness MPN TER 92898). AMM Task calls for jumper harness COM-17017\nMPN CN1159-003. (TER92898 is a Delta equivalent and located in the tool room)\n○ Reactivation of center tank fuel quantity is per AMM Task 28-00-00-440-804 when MEL is being cleared. Jumper\nharness will need to be returned to the tool room per the instructions on the tools ID tag.\n3. For MEL 28-00-07B:\nA. PRIOR TO EACH DEPARTURE, verify alternate fueling procedures have been accomplished.\nB. For alternate fueling procedures, refer to the following sections of the Fueling Procedures Manual:\n4. For alternate fueling procedures, refer to the following sections of the Fueling Procedures Manual:\nB737.40 B737 Inoperative Gauge\nB737.94.0 B737-800 Stick Chart Procedures\nB737.94.X B737-800 Fuel Stick Charts (charts for sticks 1-8)\nB737.95.0 B737-900ER Fuel Stick Chart Procedures\nB737.95.X B737-900ER Fuel Stick Charts (charts for sticks 1-8)"},"28-00-07B":{"o":"1. Verify fuel remaining in the center tank using the fuel used indicators or the operative tank indicators.\n2. Gross weight calculations will be erroneous until the current fuel on board (FOB) and Zero Fuel Weight (ZFW) are\nentered via the FMC Performance Page. Once FOB and ZFW are entered, the Flap Maneuvering Speeds on the\nspeed tape, fuel remaining at destination, and additional FMC data will be valid. Periodic updating of the current\nFOB is required for FMC information to remain valid.\nNote: For optimum use of VNAV during climb out and descent, the fuel on board should be updated just prior to\ntakeoff and at the top of descent.","m":"1. Center Fuel Quantity: Intermittent, Erroneous Reading or Indication Showing Dashes\n○ If fuel quantity indication shows dashes, the fuel quantity will not need to be deactivated. (Flight crew may\nplacard)\n○ If fuel quantity is intermittent, FMS inputs incorrect fuel into flight plan erasing crew entered fuel – Fuel\nquantity will need to be deactivated. (Maintenance will be required – flight crew may not placard)\n○ If fuel quantity is reading erroneously high or low – Fuel quantity will need to be deactivated. (Maintenance\nwill be required – flight crew may not placard)\n2. Center Tank Deactivation / Reactivation\n○ Deactivate center tank fuel quantity per AMM Task 28-00-00-040-808 using harness, fuel quantity indication\nsystem deactivation tool (Jumper Harness MPN TER 92898). AMM Task calls for jumper harness COM-17017\nMPN CN1159-003. (TER92898 is a Delta equivalent and located in the tool room)\n○ Reactivation of center tank fuel quantity is per AMM Task 28-00-00-440-804 when MEL is being cleared. Jumper\nharness will need to be returned to the tool room per the instructions on the tools ID tag.\n3. For MEL 28-00-07B:\nA. PRIOR TO EACH DEPARTURE, verify alternate fueling procedures have been accomplished.\nB. For alternate fueling procedures, refer to the following sections of the Fueling Procedures Manual:\n4. For alternate fueling procedures, refer to the following sections of the Fueling Procedures Manual:\nB737.40 B737 Inoperative Gauge\nB737.94.0 B737-800 Stick Chart Procedures\nB737.94.X B737-800 Fuel Stick Charts (charts for sticks 1-8)\nB737.95.0 B737-900ER Fuel Stick Chart Procedures\nB737.95.X B737-900ER Fuel Stick Charts (charts for sticks 1-8)"},"28-00-10A":{"m":"Fueling shutoff valve(s) and float switch(es) inoperative.\n1. Verify that the fuel load for the associated tank does not exceed tank capacity.\n2. Manually open fuel shutoff valve(s).\nCAUTION\nOVERFILL PROTECTION IS INOPERATIVE. THE PRESSURE FUELING SYSTEM WILL NOT STOP THE\nREFUEL OPERATION AT A SET FUEL QUANTITY. STOP THE FUELING SOURCE AT THE DESIRED\nQUANTITY FOR THE ASSOCIATED TANK.\n3. Push manual override button\n4. Refuel the associated tank, release the manual override button at the desired fuel quantity. Refer to the Fueling\nProcedures Manual, B737.20, B737 Pressure Refueling and B737.40, B737 Inoperative gauge.\n5. Verify that the valve is closed.\n6. Stop the fuel source pump and disconnect the refueling nozzle.\n7. Verify that the fueling receptacle does not leak."},"28-00-10C":{"m":"Fueling shutoff valve(s) and float switch(es) inoperative.\n1. Verify that the fuel load for the associated tank does not exceed tank capacity.\n2. Manually open fuel shutoff valve(s).\nCAUTION\nOVERFILL PROTECTION IS INOPERATIVE. THE PRESSURE FUELING SYSTEM WILL NOT STOP THE\nREFUEL OPERATION AT A SET FUEL QUANTITY. STOP THE FUELING SOURCE AT THE DESIRED\nQUANTITY FOR THE ASSOCIATED TANK.\n3. Push manual override button\n4. Refuel the associated tank, release the manual override button at the desired fuel quantity. Refer to the Fueling\nProcedures Manual, B737.20, B737 Pressure Refueling and B737.40, B737 Inoperative gauge.\n5. Verify that the valve is closed.\n6. Stop the fuel source pump and disconnect the refueling nozzle.\n7. Verify that the fueling receptacle does not leak."},"28-00-10B":{"m":"1. Ensure that the associated fueling shutoff valve operates normally.\n2. Observe that the associated valve’s position light illuminates and extinguishes normally during refueling.\n3. After refueling nozzle is disconnected, visually check for fuel leakage."},"28-00-25B":{"o":"Set the associated CTR FUEL PUMP switch to OFF."},"30-00-01A":{"o":"Refer to the Remarks or Exceptions column.\nNote: Disconnecting the valve’s electrical connector per the (M) PROCEDURE will cause the associated wing\nanti-ice VALVE OPEN light to illuminate (BRIGHT).","m":"Reference AMM 30-00-00-040-801"},"30-00-01B":{"o":"Note: Disconnecting the valve’s electrical connector per the (M) PROCEDURE will cause the associated wing\nanti-ice VALVE OPEN light to illuminate (BRIGHT).\nNote: With the affected wing anti-ice valve open, bleed trip off and possible loss of cabin pressure above FL350\nmay occur. Refer to Volume 1 737 5.16.2.11.3 Wing Anti-Ice Operation – In Flight.\n1. When the left Wing Anti-ice Valve is failed open, do not use APU bleed air for air conditioning purposes on the\nground. APU may only be used for engine start.\n2. When the right Wing Anti-ice Valve is failed open, APU bleed air may be used for air conditioning purposes on the\nground using only the left AC pack and with the isolation valve closed.\n3. The appropriate engine bleed thrust limits to be used with the valve failed open are the normal limits for wing\nanti-ice ON.\n4. No wing anti-ice on decrements are published for takeoff, consequently the engine bleed to the affected manifold\nmust be OFF for takeoff.\n5. To isolate the wing anti-ice system if needed:\nA. Place the Isolation Valve Switch to the closed position\nB. Place the Pack Switch on the affected side to the off position\nC. Place the Engine Bleed Air Switch on the affected side to the off position\n6. The location of the wing anti-ice valve relative to the engine exhaust area prohibits personnel from accessing the\nvalve when the associated engine is running.\n7. To ensure sufficient air for engine start, only one valve may be inoperative open.\n8. The APU or ground air can be used to start one engine and the second engine (associated with open valve) then\ncan be started by cross bleed from the first.\n9. Establish communication with ground maintenance to coordinate engine start in accordance with (M)\nprocedures.\n10. Once airborne when TAT is ≤ 10 degrees C:\nA. Place the Isolation Valve Switch to AUTO.\nB. Place the engine bleed on the affected side to ON\nC. Place the PACK switch on the affected side to AUTO\nD. Select the Wing Anti-Ice to ON.\n11. On descent when the TAT is > 10 degrees C:\nA. Place the Isolation Valve Switch to CLOSE.\nB. Place the PACK switch on the affected side to OFF.\nC. Place the Engine Bleed Air Switch on the affected side to OFF.\nNote: Engine Bleed to the affected manifold must be in the OFF position for takeoff and landing.","m":"Reference AMM 30-00-00-040-801"},"30-00-03B":{"o":"Note: Dispatching with an engine and nose cowl anti-ice valve inoperative OPEN will cause the associated COWL\nVALVE OPEN light to illuminate bright and, the associated thermal anti-ice (TAI) indication to also illuminate\namber.\nTakeoff above 37.7°C (100°F) is prohibited.\n1. Operate with the associated ENG ANTI-ICE switch in the OFF position.\n2. Apply performance limited weights as laid out in the performance box.\n3. Autothrottle use encouraged to ensure commanded thrust (green carat on N1 display) is set during normal\noperations:\nA. Maintain a minimum of 60% N1 in flight on the associated engine in icing conditions,\nB. At temperatures ≤ 10C (50F), ensure actual N1 does not exceed 102.9% (1.1% below redline). Takeoff and\nGo-Around thrust are not limited,\nC. At temperatures > 10C (50F), ensure actual Takeoff and Go-Around N1 does not exceed 102.6% (1.4% below\nredline),\nD. The EECs should limit actual N1 below these values in all phases of flight, but diligence is advised to ensure EGT\nredline and N1 values described in notes (B) and (C) above are not exceeded.\n4. Observe maximum operating temperature restrictions.\n5. During ground operations with the APU running, turn the engine bleed OFF whenever the associated engine is not\nrunning.\nFigure 30-2: N1 Indication on Upper Display","m":"Note: Dispatching with an engine and nose cowl anti-ice valve inoperative OPEN will cause the associated COWL\nVALVE OPEN light to illuminate bright and, the associated thermal anti-ice (TAI) indication to also illuminate\namber.\n1. Comply with Preparation steps in AMM Task 30-00-00-040-803.\n2. Open the fan cowl panels and thrust reverser.\n3. Locate the duct Overpressure Switch, which is forward of the Nose Cowl TAI valve. Disconnect, cap and stow the\nelectrical connector DP1302 from the duct Overpressure Switch S806. Refer to Figure 30-3 below.\n4. Lock the Nose Cowl TAI Valve in the OPEN position as follows:\nA. Loosen the retaining screw on the manual locking assembly.\nB. Move the hex shaft to the OPEN position.\nC. Slide the locking assembly up the shaft into the recess in the cover plate.\nD. Tighten the retaining screw.\n5. Deactivate and defer the associated High Stage Valve per MEL 36-00-09.\n6. Close the fan cowl panels and thrust reverser.\nLink to TAI Deactivation Video\nFigure 30-3: Nose Cowl Thermal Anti-Ice Valve and Duct Overpressure Switch"},"30-00-03A":{"m":"1. Comply with Preparation steps in AMM Task 30-00-00-040-803.\n2. Open the fan cowl panels.\n3. To position the shutoff valve in the CLOSED position:\nA. Loosen the retaining screw on the manual locking assembly.\nB. Move the hex shaft to the CLOSED position.\nC. Slide the locking assembly up the shaft into the recess in the cover plate.\nD. Tighten the retaining screw.\n4. Close the fan cowl panels."},"30-00-04A":{"o":"PRIOR TO EACH DEPARTURE:\n1. Start the associated engine.\n2. Wait for the engine to stabilize at idle.\n3. Verify that the engine and apu bleed air switches are in the OFF position.\n4. Verify that the ENG ANTI-ICE switch is in the OFF position.\n5. Monitor the EGT:\nA. Wait for the EGT to stabilize and record the temperature.\nCAUTION LIMIT COWL TAI OPERATION TO 30 SECONDS MAXIMUM.\nB. Place the ENG ANTI-ICE switch to the ON position.\nC. Wait for the EGT to stabilize and record the temperature.\nD. Position ENG ANTI-ICE switch to OFF.\nE. Wait for the EGT to stabilize and record the temperature.\n6. Verify that the following changes occurred:\nA. The EGT increased by a minimum of 15 degrees C when the ENG ANTI-ICE switch was put in the ON position.\nB. The EGT returned to the original idle temperature when the ENG ANTI-ICE switch was put in the OFF position.\n7. Configure the airplane as needed for flight or shut down the engine if required.\nNote: This MEL refers to the blue “COWL VALVE OPEN” lights and the “TAI” indication on the Engine Display.\nFigure 30-4: Engine Anti-Ice Position Indications"},"30-00-09A":{"m":"For 30-00-09B the following must be accomplished PRIOR TO EACH DEPARTURE:\nCheck affected probe heater as follows:\n1. Station a ground observer at the associated probe heater and establish communications.\n2. Apply electrical power to the aircraft.\n3. Place the associated PROBE HEAT switch to the ON position.\n4. To test the TAT probe heat, press and hold the TAT TEST switch.\n5. Check that heat radiation can be detected from the associated probe, indicating that the heater is functioning. DO\nNOT TOUCH PROBE.\nCAUTION DO NOT PLACE HAND ON PROBE. TEMPERATURES ARE HIGH ENOUGH TO CAUSE BURNS.\nCAUTION DO NOT LEAVE HEATER ON LONGER THAN REQUIRED. HEATER LIFE MAY BE UNNECESSARILY\nSHORTENED.\n6. If TAT probe heat was tested, release the TAT TEST switch.\n7. Place the associated Probe Heat switch to the OFF/AUTO position.\n8. Restore aircraft electrical system to normal."},"30-00-09B":{"m":"For 30-00-09B the following must be accomplished PRIOR TO EACH DEPARTURE:\nCheck affected probe heater as follows:\n1. Station a ground observer at the associated probe heater and establish communications.\n2. Apply electrical power to the aircraft.\n3. Place the associated PROBE HEAT switch to the ON position.\n4. To test the TAT probe heat, press and hold the TAT TEST switch.\n5. Check that heat radiation can be detected from the associated probe, indicating that the heater is functioning. DO\nNOT TOUCH PROBE.\nCAUTION DO NOT PLACE HAND ON PROBE. TEMPERATURES ARE HIGH ENOUGH TO CAUSE BURNS.\nCAUTION DO NOT LEAVE HEATER ON LONGER THAN REQUIRED. HEATER LIFE MAY BE UNNECESSARILY\nSHORTENED.\n6. If TAT probe heat was tested, release the TAT TEST switch.\n7. Place the associated Probe Heat switch to the OFF/AUTO position.\n8. Restore aircraft electrical system to normal."},"30-00-11A":{"o":"1. Program KIAS/Mach speed restriction in FMS.\n2. Position affected Window Heat switch to OFF."},"30-00-11B":{"o":"1. Program KIAS/Mach speed restriction in FMS.\n2. Position affected Window Heat switch to OFF."},"30-00-13A":{"m":"Conditional maintenance procedure. If wiper blade obstructs forward vision, the wiper blade may be relocated to the\nparked position. If this procedure is necessary, maintenance is required and flight crew may not placard.\n1. Do this task: Windshield Wiper Arm Removal (AMM 30-42-31).\n2. Do this task: Windshield Wiper Arm Installation (AMM 30-42-31).\nNote: It is only necessary to put the wiper arm in the parked position and to apply the appropriate downward\nforce on the wiper blade. The steps related to the sweep of the wiper arm are not necessary."},"30-00-17B":{"o":"See (O) procedures for 30-00-03B.","m":"See (M) procedures for 30-00-03B, and 36-00-09."},"30-00-18A":{"m":"PRIOR TO EACH DEPARTURE:\n1. Station a ground observer at the associated vane heater and establish communications.\n2. Apply electrical power to the aircraft.\n3. Place the associated Pitot Static Heat switch to the ON position.\n4. Check that heat radiation can be detected from the associated vane, indicating that heater is functioning. DO NOT\nTOUCH VANE.\nCAUTION DO NOT PLACE HAND ON PROBE. TEMPERATURES ARE HIGH ENOUGH TO CAUSE BURNS. DO NOT\nLEAVE HEATER ON LONGER THAN REQUIRED. HEATER LIFE MAY BE UNNECESSARILY SHORTENED.\n5. Place the associated Pitot Static Heat switch to the OFF position.\n6. Restore aircraft electrical system to normal."},"30-00-21A":{"o":"1. Set WING ANTI-ICE switch to OFF on the ground and for takeoff.\nNote: Wing anti-ice will not be available on the ground. Wing anti-ice will operate normally in-flight.\nNote: Refer to Vol 1, Supplementary Procedures, Adverse Weather, Wing Anti-Ice Operation – On the Ground,\nand De/Anti-Icing Guide and Holdover Tables for ground operations."},"30-00-21B":{"o":"1. Set WING ANTI-ICE switch to OFF for takeoff.\nNote: Wing anti-ice is available on the ground. Wing anti-ice will operate normally in-flight."},"31-00-01B":{"o":"Note: When UTC time/date information is not being received from GPS, dashes will be displayed in clock’s UTC\ntime/date display.\nTo set manual mode on clock:\n1. Select Manual Mode (MAN) with the “TIME/DATE” push button on the clock.\n2. Manually set the correct time/date as required."},"31-00-07A":{"o":"1. Refer to Volume 1 737 5.5.3 ACARS Engine Condition Monitoring (ECM) Report.\n2. Ensure that a minimum of two (2) Engine Performance Logs are installed in the aircraft logbook. If not, contact\nMCC.\nNote: If an Engine Performance Report Form is not available and MCC determines that there is no requirement\nfor ENCON readings during that flight segment, the Engine Performance Report Form may be boarded at\nthe destination. It is desired to have the ENCON data available once per flight day."},"31-00-08A":{"o":"1. Verify that engine indications can be manually selected to either Captain’s or First Officer’s inboard DU. Select\nMulti Function Display (MFD) on the Main Panel DU’s.","m":"1. Deactivate the lower display unit to reduce display unit interference by pulling and securing the DISPLAY CTR LWR\ncircuit breaker on the P6-1 panel located at E12."},"31-00-14":{"o":"Before engine start, PRIOR TO THE FIRST FLIGHT OF THE DAY or following any change of either flight crew member:\n1. Perform Cabin Altitude Warning Indication Briefing using MEL 21-00-11 (O) procedures.\n32 Landing Gear\nTable of Contents"},"32-00-07A":{"m":"Reference AMM 32-00-00-040-805.\nFigure 32-1: AUTOBRAKE CONTROL MODULE"},"32-00-13B":{"m":"ONCE EACH FLIGHT DAY:\n1. Chock wheels and release parking brakes.\n2. Depressurize Hydraulic System A and B.\n3. Apply and release brakes 10 times with approximately 3 seconds between each application.\n4. Verify that the associated wheel well brake accumulator gauge pressure indication is within limits after 10\napplications (refer to the wheel well placard).\n5. Pressurize Hydraulic System A and B and verify that operative brake indicator is approximately 3000 psi.\n6. Set the parking brakes.\n7. Depressurize Hydraulic Systems A and B.\nFigure 32-2: BRAKE HYDRAULIC ACCUMULATOR SERVICING"},"32-00-16":{"o":"1. The captain will conduct a safety briefing on smoking, seat belts, emergency exits, oxygen, and if applicable,\nflotation equipment for EOW operations.\n2. Refer to ODM, Ferry section, Landing Gear Extended.\n3. Ensure maintenance has placed the Alternate Gear Down Dispatch switch to the ALTN position.","m":"1. Secure the landing gear in the down position (AMM Task 32-00-00-040-812).\nA. Install landing gear downlock pins (AMM Task 32-00-01-480-801).\n2. Place the ALTERNATE VMO/MMO switch (S01127), located in the main equipment center (E/E compartment), to\nthe ALTN position as follows (Reference Figure 32-3 Alternate VMO/MMO switch in ALTN position for GEAR DOWN\noperations and Figure 32-4 Alternate VMO/MMO switch in NORM position for NORMAL operations):\nA. Remove safety wire and open switch guard.\nB. Push switch up into the ALTN position.\nC. Close switch guard ensuring the switch guard captures the switch in the ALTN position.\nD. Re-install safety wire.\n3. Inoperative components are properly secured by an acceptable procedure.\nFigure 32-3: Alternate VMO/MMO switch in ALTN position for GEAR DOWN operations\nFigure 32-4: Alternate VMO/MMO switch in NORM position for NORMAL operations"},"32-00-17A":{"m":"PRIOR TO EACH DEPARTURE:\n1. Gain access to the PSEU through the forward access door.\n2. Power the PSEU BITE Control Panel by pressing the ON/OFF switch.\n3. EXISTING FAULTS? Will be displayed. Press the YES switch.\n4. One of the following messages will be displayed:\nA. NO FAULTS – airplane may be dispatched without further action.\nB. DISPATCH FAULT or DISPATCH PER MEL – msg # 32-64003\n■ Dispatch allowed for 10 days unless msg #32-62009, 32-62109, 32-62010, 32-62110, or 32-62014 are also\ndisplayed.\n■ If msg #32-62009, 32-62109, 32-62010, 32-62110, or 32-62014 are displayed, refer to MEL Item 32-00-21.\nC. NO DISP FAULT or DO NOT DISPATCH – msg # 32- 64004 – Dispatch is not allowed.\n■ If msg #32-62009, 32-62109, 32-62010, 32-62110, or 32-62014 are displayed, refer to MEL Item 32-00-21."},"32-00-17C":{"m":"PRIOR TO EACH DEPARTURE:\n1. Gain access to the PSEU through the forward access door.\n2. Power the PSEU BITE Control Panel by pressing the ON/OFF switch.\n3. EXISTING FAULTS? Will be displayed. Press the YES switch.\n4. One of the following messages will be displayed:\nA. NO FAULTS – airplane may be dispatched without further action.\nB. DISPATCH FAULT or DISPATCH PER MEL – msg # 32-64003\n■ Dispatch allowed for 10 days unless msg #32-62009, 32-62109, 32-62010, 32-62110, or 32-62014 are also\ndisplayed.\n■ If msg #32-62009, 32-62109, 32-62010, 32-62110, or 32-62014 are displayed, refer to MEL Item 32-00-21.\nC. NO DISP FAULT or DO NOT DISPATCH – msg # 32- 64004 – Dispatch is not allowed.\n■ If msg #32-62009, 32-62109, 32-62010, 32-62110, or 32-62014 are displayed, refer to MEL Item 32-00-21."},"32-00-17B":{"m":"For dispatchable faults, extinguish the PSEU light by one of these three steps:\n1. Pushing the MASTER CAUTION light, or\n2. Setting the parking brake, or\n3. Shutting down both engines."},"32-00-17D":{"m":"PRIOR TO EACH DEPARTURE check SPSEU BITE for faults:\n1. Supply power to the airplane.\n2. Gain access to the SPSEU through the electronic equipment access door.\n3. Press the DISPLAY FAULT button to cycle through all faults that may be present.\nNote: Fault codes 1-8 and B-E are NOT allowed for dispatch. Fault code A indicates a Tail Skid Overcurrent,\nrefer to MEL 32-00-22. A blinking F is an indication that one or more faults are latched, but is not a fault\ncode itself. Fault code 0 indicates that there are no faults."},"32-00-22A":{"o":"Aircraft 3774 – 3777 only: Refer to ODM, Abnormal section, Abnormal Configuration Actual Landing Distances and\nApproach Speeds tables, for Operational Landing Distances and VREF speeds.”\nNote: Landing Flap Setting 15 not authorized.","m":"Secure the tail skid in the fully retracted position (AMM 32-00-00/901):\n1. Open the stabilizer trim access door to get access to the tail skid assembly.\n2. Do a general visual inspection of the tail skid hydraulic actuator for evidence of leaks or damage.\n3. Do a general visual inspection of the tail skid linkage for evidence of corrosion or damage.\n4. Remove the split rings and the REMOVE BEFORE FLIGHT streamer from the retractable tail skid lockout pin.\n5. Install the retractable tail skid lockout pin in the lock links for the tail skid.\nNote: When the tail skid is in the retracted position, the lockout pin is installed from the right to the left from\ninside the aft unpressurized compartment.\n6. Install the lockpin, part of the retractable tail skid lockout pin, through the end of the retractable tail skid lockout\npin.\n7. Make sure the lockpin is closed.\n8. Close the access panel."},"32-00-22B":{"m":"Secure the tail skid in the fully extended position (AMM 32-00-00/901):\n1. Open the stabilizer trim access door to get access to the tail skid assembly.\n2. Do a general visual inspection of the tail skid hydraulic actuator for evidence of leaks or damage.\n3. Do a general visual inspection of the tail skid linkage for evidence of corrosion or damage.\n4. Remove the split rings and the REMOVE BEFORE FLIGHT streamer from the retractable tail skid lockout pin.\n5. Install the retractable tail skid lockout pin in the lock links for the tail skid.\nNote: When the tail skid is in the extended position, the lockout pin is installed from the left to the right by\nreaching between the drag lever skirt and the fairing.\n6. Install the lockpin, part of the retractable tail skid lockout pin, through the end of the retractable tail skid lockout\npin.\n7. Make sure the lockpin is closed.\n8. Close the access panel."},"32-00-22C":{"m":"Secure the tail skid in the fully retracted position (AMM 32-00-00/201):\n1. Remove the split rings and the REMOVE BEFORE FLIGHT streamer from the retractable tail skid lockout pin.\n2. Open the stabilizer trim access door to get access to the tail skid assembly.\n3. Do a general visual inspection of the tail skid hydraulic actuator for evidence of leaks or damage.\n4. Do a general visual inspection of the tail skid linkage for evidence of leaks or damage.\n5. Install the retractable tail skid lockout pin, in the lock links for the tail skid.\nNote: When the tail skid is in the retracted position the lockout pin is installed from the right to the left from\ninside the aft unpressurized compartment.\n6. Install the lockpin, part of the retractable tail skid lockout pin, through the end of the retractable tail skid lockout\npin.\n7. Make sure the lockpin is closed.\n8. Close the access panel.\n33 Lights\nTable of Contents"},"33-00-01B":{"o":"Figure 33-1: Background and AFDS Flood Light Control\n(1) BACKGROUND Light Control\n• Rotate – controls incandescent lighting brightness for Captain’s panel, First Officer’s panel, and center panel.\n(2) AFDS FLOOD Light Control\n• Rotate – controls brightness of lighting directed at AFDS panel.\nNote: AFDS Flood Lights are not restricted to DAY OPERATIONS ONLY and should be deferred per MEL 33-00-01A."},"33-00-03B":{"o":"Refer to the FOM, Briefings and Cabin Crew Communications (Chapter 5), for when the pilot in command shall notify\npassengers when seat belts should be fastened and smoking prohibited."},"33-00-03D":{"o":"Refer to the FOM, Briefings and Cabin Crew Communications (Chapter 5), for when the pilot in command shall notify\npassengers when seat belts should be fastened and smoking prohibited."},"33-00-03A":{"m":"1. If required, install tapes or ropes of conspicuous contrasting colors to block access to unusable seats prior to\nboarding passengers.\n2. Conspicuous signs or placards shall be placed in appropriate locations to indicate seats which are not to be\noccupied.\n3. For an individual sign inoperative, an observer with normal vision should sit in the passenger seat(s) which is\nnormally serviced by the sign and determine if both a “NO SMOKING” and “FASTEN SEAT BELT” sign can be read\nfrom the seat(s). In tests conducted at Boeing for the FAA, a sign was considered “readily legible” if enough of the\nsign could be seen to identify it. Example: “NO SMOK” and “FASTEN SEAT B” would be considered readily legible."},"33-00-04A":{"m":"1. With associated cargo compartment door open, verify the door warning light in cockpit is illuminated on the\noverhead panel:\nA. If door warning light is illuminated defer cargo compartment light system per MEL 33-00-04A.\nB. If door warning is not illuminated and the cargo compartment light system is inoperative, defer the door\nwarning system per MEL 52-00-03A and cargo compartment light system per MEL 33-00-04A."},"33-00-05":{"m":"If the EXTERIOR LIGHTING – ANTI-COLLISION – WHITE circuit breaker on the P18-3 panel located at B13 is open and\nwill not reset, secure the breaker in the open position.\nNote: All white strobe lights will be inoperative with circuit breaker secured open."},"33-00-06A":{"m":"If the EXTERIOR LIGHTING – ANTI-COLLISION – RED circuit breaker on the P18-3 panel located at B12 is open and will\nnot reset, secure the breaker in the open position.\nNote: Upper and Lower Anti-Collision lights will be inoperative with circuit breaker secured open."},"33-00-06B":{"m":"If the EXTERIOR LIGHTING – ANTI-COLLISION – RED circuit breaker on the P18-3 panel located at B12 is open and will\nnot reset, secure the breaker in the open position.\nNote: Upper and Lower Anti-Collision lights will be inoperative with circuit breaker secu
