5B","t":"Flight Deck Exit Light 33-00-16, LEFT","r":"AND RIGHT (PILOT"},{"n":"33-00-16","t":"SYSTEM ANNUNCIATOR LIGHTS, LEFT SHIELD)","r":"AND RIGHT (PILOT"},{"n":{},"t":"System Annunciator Lights, Left and Right (Pilot","r":","},{"n":{},"t":"System Annunciator Lights, Left and Right (Pilot","r":"S PRESS-TO-TEST"},{"n":"33-00-17","t":"Flight Deck Master Lights Test and Individual 33-00-18","r":"Light"},{"n":"33-00-18A","t":"Dome Service Lights","r":""},{"n":"33-00-18B","t":"Inspection Flood Lights 33-00-19","r":"PATH MARKING SYSTEM"},{"n":"33-00-19","t":"FLOOR","r":"PATH MARKING SYSTEM"},{"n":"33-00-19A","t":"Floor Proximity Emergency Escape Path Marking Incandescent Lighting Systems","r":"System – Seat Mounted LED and Date: 27-Aug-2025"},{"n":"33-00-19B","t":"Floor Proximity Emergency Escape Path Marking 33-00-20","r":"System – Photoluminescent Lighting System"},{"n":"33-00-20","t":"Adjacent to LOGO Light Switch","r":"LOGO Light System INOP Date: 29-Sep-2022"},{"n":"33-00-23","t":"Master Dim System","r":"Dim function may be inoperative provided: 1. TEST and BRT functions operate normally, 2. Except during light test, switch is placed in BRT, and 3. Light intensity is acceptable to flight crew."},{"n":"33-00-25","t":"Service Area Light Systems (Nose, Electrical Tailcone Compartments and Fueling Panel)","r":"Equipment, Air Conditioning, Aft Accessory, APU, Date: 09-Apr-2025"},{"n":"34-00-00","t":"LLM CATEGORY II/III STATUS (LOWER","r":"LANDING MINIMUMS"},{"n":"34-00-00L","t":"LLM Category II/III Status (Lower Landing Minimums","r":"(M)May be inoperative provided Aircraft restricted to CAT I due to AMT is non-AFQ authorized. Note: This Item Number is only used for deferring the CAT II/III status of the aircraft and MCC authorization is required prior to its useage or removal. CAT II/III Not Authorized"},{"n":"34-00-01A","t":"Mach / Airspeed Indications","r":"May be inoperative provided one Mach / Airspeed warning and Mach trim system operates normally."},{"n":"34-00-01B","t":"Mach / Airspeed Indications","r":"(O)May be inoperative provided: 1. Aircraft remains at or below FL 280, and 2. Airspeed remains at or below 320 KIAS. Theater restrictions may Apply"},{"n":"34-00-02A","t":"Maximum Operating Speed Indication","r":"May be inoperative provided clacker warning system operates normally and is independent from Mach Indicator."},{"n":"34-00-02B","t":"Near Associated PFD","r":"____ Mach Indications INOP"},{"n":"34-00-02C","t":"Clacker","r":"(O)Systems may be inoperative provided: 1. Both Mach indicators operate normally, 2. 330 KIAS /.76 Mach airspeed limitations are observed, 3. Aircraft is not operated within the boundaries of a Critical Terrain Box, and 4. If overspeed warning occurs earlier than scheduled during flight, speed must remain below point at which warning occurs. Theater restrictions may Apply"},{"n":"34-00-02D","t":"Clacker","r":"(O)(M)Systems may be inoperative provided; 1. Both Mach indicators operate normally, 2. 330 KIAS /.76 Mach airspeed limitations are observed, 3. Aircraft is not operated within the boundaries of a Critical Terrain Box, and 4. If overspeed warning occurs below .76 Mach, system must be deactivated by pulling associated circuit breaker (# 1 system P18-2, # 2 system P6-1) and observe speed limits. Theater restrictions may Apply"},{"n":"34-00-03","t":"Standby Altimeter Vibrator (Ships 3701-3771)","r":"May be inoperative provided VMC exists at departure and arrival airports. Note: Weather conditions at departure and arrival airports (including alternates) must beat least 1,000’ ceiling and 3SM visibility, or enough to allow a visual approach or whichever is greater.”"},{"n":"34-00-04","t":"Near Primary Engine Display Unit","r":"Static Air Temperature Indication INOP Date: 29-Sep-2022"},{"n":"34-00-05","t":"Total Air Temperature Indication","r":"May be inoperative provided an alternate air temperature indication (i.e. PDC, FMS, SAT) operates normally."},{"n":"34-00-07","t":"STANDBY HORIZON INDICATOR (STANDBY","r":"ATTITUDE)"},{"n":"34-00-07A","t":"Standby Horizon Indicator (Standby Attitude)","r":"May be inoperative provided 1. Operations are conducted in Day VMC only, and 2. Operations are not conducted into known or forecast over-the-top conditions."},{"n":"34-00-07B","t":"Standby Horizon Indicator","r":"Standby Horizon Indicator ILS Indication INOP Date: 29-Sep-2022"},{"n":"34-00-08","t":"Near Associated PFD","r":"____ Angle of Attack Indication INOP Date: 29-Sep-2022"},{"n":"34-00-10R","t":"RNP–10 Status","r":"(M)Authorized by MCC when: 1. RNP-10 airspace operations cannot be used, and 2. No specific MEL item applies. Note 1: Dispatch to remove equipment code “R” and NAV code “RNP10 from the flight plan. Note 2: This Item Number is only used for deferring the RNP-10 status of the aircraft and MCC authorization is required prior to its usage or removal. RNP-10 Operations Not Authorized"},{"n":"34-00-11","t":"Standby Magnetic Compass","r":"May be inoperative provided: 1. Any combination of two gyro or INS (IRU) stabilized compass systems are operative, and 2. Aircraft is operated with dual independent navigation capability, and under positive radar control by ATC on enroute portion of flight."},{"n":"34-00-12A","t":"Flight Director Systems","r":"May be inoperative provided takeoff and approach minimums do not require its use; refer to Navigation Equipment Tab (this manual) forNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements. TAKEOFF Captain’s Flight Director must be operative with visibility less than 1600 RVR (1/4 mile). Note: Both F/D switches must be in the ON position for LNAV to arm on the ground."},{"n":"34-00-12B","t":"Flight Director Systems 34-00-13","r":"SYSTEMS"},{"n":"34-00-13","t":"DISTANCE","r":"SYSTEMS"},{"n":"34-00-14","t":"Marker Beacon Receiver System","r":"May be inoperative provided approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"34-00-15A","t":"Weather Radar","r":"(O)Except for Outbound North America Extended Operations (ETOPS), may be inoperative provided: 1. Weather radar is not required by 14 CFR, and 2. Alternate procedures are used. Note: No person may dispatch an aircraft in IFR or night VFR conditions when current weather reports indicate that thunderstorms, or other potentially hazardous weather conditions that can be detected with airborne weather radar, may reasonably be expected along route to be flown. Theater Restrictions may apply"},{"n":"34-00-15B","t":"Windshear Detection and Avoidance System","r":"(Predictive)"},{"n":"34-00-15C","t":"Windshear Detection and Avoidance System","r":"(Predictive)"},{"n":"34-00-15D","t":"Autotilt/Multiscan Function(-900ER aircraft 3772-3777)(-800 34-00-17","r":"aircraft with AA 3442-01144)"},{"n":"34-00-17A","t":"VOR Systems","r":"(O)Right (No.2) may be inoperative provided approach minimums do not require its use; refer to Navigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"34-00-17B","t":"ILS Systems 34-00-18","r":"ALTITUDE REPORTING SYSTEMS"},{"n":"34-00-18","t":"ATC","r":"ALTITUDE REPORTING"},{"n":"34-00-18A","t":"ATC Transponder and Automatic Altitude Reporting","r":"Systems"},{"n":"34-00-18B","t":"ATC Transponder and Automatic Altitude Reporting","r":"Systems"},{"n":"34-00-18C","t":"ADS-B Out Extended Squitter Transmissions","r":"(O)Both may be inoperative provided prior to flight, authorization is obtained from ATC facilities having jurisdiction over planned route of flight using an approved process. Note: Any ADS-B Out function that operates normally may be used."},{"n":"34-00-18D","t":"ADS-B Out Extended Squitter Transmissions","r":"(O)One may be inoperative."},{"n":"34-00-20","t":"Radio Altimeter Systems","r":"(O)(M)May be inoperative deactivated provided: 1. Approach minimums or operating procedures do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, 2. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements, 3. Associated autopilot is not used for approach and landing, 4. Autothrottle is not used for approach and landing, and 5. Associated Flight director is not used for approach and landing. Note 1: An invalid radio altimeter signal will generate a dispatchable PSEU fault. Defer perMEL 32-00-17. Note 2: If arming LNAV on ground with one radio altimeter inoperative, the flight directors and autopilot should be controlled by the FCC on the same side as the valid radio altimeter (i.e., the first flight director and/or autopilot to be engaged must be receiving valid radio altitude data)."},{"n":"34-00-23","t":"True Airspeed Indication","r":"May be inoperative."},{"n":"34-00-25A","t":"Altitude Alerting System","r":"(O)May be inoperative provided: 1. Autopilot with altitude hold and altitude capture is operative, 2. Enroute operations do not require its use, 3. Repairs are made within three flight days, and 4. Airplane does not depart from a Delta maintenance station. RVSM Operations Not Authorized"},{"n":"34-00-25B","t":"Aural Alert","r":"May be inoperative provided: 1. Visual alert operates normally, and 2. Auto-pilot with altitude hold and altitude capture operates normally."},{"n":"34-00-25C","t":"Visual Alert 34-00-26","r":"(GPWS) (GPWS)"},{"n":"34-00-26","t":"GROUND (GPWS)","r":"(GPWS)"},{"n":"34-00-26A","t":"GPWS System","r":"Date: 27-Aug-2025"},{"n":"34-00-26B","t":"Terrain Avoidance Warning (Modes 1 thru 4)","r":"(O)May be inoperative provided: 1. Alternate procedures are used, and 2. Repairs are made within two flight days."},{"n":"34-00-26C","t":"Test Mode","r":"(O)(M)May be inoperative provided: 1. GPWS is deactivated, 2. Alternate procedures are used, 3. Repairs are made within two flight days, and 4. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements."},{"n":"34-00-26D","t":"GPWS Test Switch","r":"GPWS MODE 5 INOP"},{"n":"34-00-26E","t":"Advisory Callouts Minimums, Minimums","r":"(O)May be inoperative provided standard callouts are used."},{"n":"34-00-26F","t":"Windshear Warning and Flight Guidance System","r":"(Reactive)"},{"n":"34-00-26G","t":"Windshear Warning and Flight Guidance System","r":"(Reactive)"},{"n":"34-00-26H","t":"Terrain Mode (EGPWS / Enhanced Mode)","r":"(O)May be inoperative provided: 1. Alternate procedures are used, and 2. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Theater Restrictions may apply"},{"n":"34-00-26I","t":"Terrain Displays","r":"May Be Inoperative. Date: 09-Apr-2025"},{"n":"34-00-26J","t":"Terrain Displays","r":"May Be Inoperative."},{"n":"34-00-26K","t":"Runway Awareness and Advisory System (RAAS) 34-00-32","r":"SYSTEM"},{"n":"34-00-32","t":"INSTRUMENT","r":"SYSTEM"},{"n":"34-00-35A","t":"Inertial Reference Systems (IRS)","r":"(O)Except for Extended Operations (ETOPS), one may be inoperative provided: 1. Remaining IRS operates normally and is used for both Attitude Indications, VSI’s and heading information on both PFD and NDs, 2. Flight is restricted to day VMC, 3. Standby Magnetic Compass operates normally, 4. Standby Horizon Indicator or ISFD attitude display operates normally, 5. Autopilots (any mode) are not used, 6. The Automatic Brake System is considered inoperative and deferred perMEL 32-00-07A or32-00-07Bas appropriate, and 7. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. RVSM Operations Not Authorized"},{"n":"34-00-35B","t":"IRS Data Display (Aft Overhead Panel)","r":"May be inoperative provided one FMS CDU operates normally."},{"n":"34-00-35C","t":"IRS Ground Crew Call Horn 34-00-36","r":"SYSTEM (FMCS) (FMCS)"},{"n":"34-00-36","t":"FLIGHT (FMCS)","r":"SYSTEM (FMCS)"},{"n":"34-00-36A","t":"FMC Alert Lights","r":"May be inoperative provided FMC is not used for autopilot guidance during the approach. Note: RNAV approaches must be treated like single FMC approach."},{"n":"34-00-36B","t":"FMC Alert Lights","r":"May be inoperative provided: 1. FMC is not used for autopilot guidance, and 2. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements."},{"n":"34-00-36C","t":"Computer","r":"(O)May be inoperative provided RNAV operations do not require its use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Note: Refer toPBCS Equipment Requirements chart. Theater Restrictions may apply"},{"n":"34-00-36D","t":"Computer","r":"(O)(M)Except for Extended Operations (ETOPS), may be inoperative provided: 1. IRS display unit (on aft overhead panel) operates normally, 2. Speed Reference Selector operates normally, 3. Autothrottle System is deactivated, considered inoperative, and deferred perMEL 22-00-04, and 4. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Note: Refer to MEL Item 22-00-04 Autothrottle System. Theater Restrictions may apply"},{"n":"34-00-36E","t":"MCDU","r":"May be inoperative provided: 1. Enroute procedures do not require its use, and 2. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Note: Refer toPBCS Equipment Requirements chart. Theater Restrictions may apply Date: 21-Aug-2024"},{"n":"34-00-36F","t":"MCDU","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided: 1. IRS display unit (on aft overhead panel) operates normally, 2. Speed Reference Selector operates normally, and 3. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Theater Restrictions may apply"},{"n":"34-00-36G","t":"Navigation Databases Out of Currency","r":"(O)(M)May be out of currency provided: 1. Current Aeronautical Charts or current Nav Database is used to verify Navigation Fixes PRIOR TO EACH DEPARTURE, 2. Pilot or Flight Control use charts orRVAL tool to verify status and suitability of Navigation Facilities used to define route of flight, 3. Approach Navigation Radios are manually tuned and identified, and 4. Dispatch will not file a flight plan requiring RNAV data that is identified as changed within the current database. Refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Theater Restrictions may apply Repetitive Check Required (Yellow Placard)"},{"n":"34-00-38","t":"Pitch Limit Indication (PLI) 34-00-40","r":"SYSTEM (TCAS) (TCAS)"},{"n":"34-00-40","t":"TRAFFIC (TCAS)","r":"SYSTEM (TCAS)"},{"n":"34-00-40A","t":"Traffic Collision and Avoidance System (TCAS)","r":"(O)(M)May be inoperative provided: 1. Routing restrictions for TCAS are observed, 2. System is deactivated and secured, and 3. Repairs are made within 3 flight cycles. Theater restrictions may apply"},{"n":"34-00-40B","t":"Combined Traffic Alert (TA) and Resolution Advisory(RA)","r":"Dual Display"},{"n":"34-00-40C","t":"Resolution Advisory (RA) Display System(s)","r":"(O)May be inoperative on non-flying pilot side."},{"n":"34-00-40D","t":"Resolution Advisory (RA) Display System(s)","r":"(O)May be inoperative provided: 1. Traffic Alert (TA) visual display and audio functions are operative, 2. TA only mode is selected by crew, and 3. Enroute or approach procedures do not require its use."},{"n":"34-00-40E","t":"Traffic Alert (TA) Display System(s)","r":"(O)May be inoperative provided: 1. RA visual display and audio functions are operative, and 2. Enroute or approach procedures do not require its use."},{"n":"34-00-40F","t":"Audio Functions","r":"May be inoperative provided enroute or approach procedures do not require use of TCAS."},{"n":"34-00-40G","t":"Associated Navigational Display","r":"TCAS Airspace Selection Function INOP Date: 09-Apr-2025"},{"n":"34-00-43","t":"Radio Height Alert","r":"Date: 27-Aug-2025"},{"n":"34-00-44","t":"Head-Up Display System (HUD/HGS)","r":"May be inoperative provided approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements. Note: Any mode which operates normally may be used."},{"n":"34-00-45A","t":"Global Positioning System (GPS)","r":"One may be inoperative provided: 1. Associated ADS-B Out Extended Squitter Transmissions are considered inoperative and deferred perMEL 34-00-18D. 2. Approach minimums or operating procedures do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, 3. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements."},{"n":"34-00-45B","t":"Global Positioning System (GPS)","r":"Both may be inoperative provided: 1. Approach minimums or operating procedures do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, 2. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. 3. Both ADS-B Out Extended Squitter Transmissions are considered inoperative and deferred perMEL 34-00-18C. Note 1: If installed, the associated Automatic UTC Update Function(s) will be inoperative and must be deferred per MEL Item 31-00-01B. Note 2: ADS-C is inoperative beyond VHF range. Note 3: Refer toPBCS Equipment Requirements chart. Theater restrictions may apply"},{"n":"34-00-48A","t":"Associated EFIS Control Panel","r":"EFIS Control Panel POS Switch INOP"},{"n":"34-00-48B","t":"Associated EFIS Control Panel","r":"EFIS Control Panel STA Switch INOP"},{"n":"34-00-48C","t":"Associated EFIS Control Panel","r":"EFIS Control Panel ARPT Switch INOP"},{"n":"34-00-48D","t":"Associated EFIS Control Panel","r":"EFIS Control Panel DATA Switch INOP"},{"n":"34-00-48E","t":"Associated EFIS Control Panel","r":"EFIS Control Panel WPT Switch INOP"},{"n":"34-00-48F","t":"Decision Height/Mins Selector","r":"May be inoperative provided approach procedures do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"34-00-49","t":"Right IRS DC Power Supply System 34-00-54","r":"(ISFD) SYSTEM (ISFD) SYSTEM"},{"n":"34-00-54","t":"INTEGRATED (ISFD) SYSTEM","r":"(ISFD) SYSTEM"},{"n":"34-00-54A","t":"(ISFD) Attitude Display","r":"May be inoperative provided: 1. Operations are conducted in Day VMC only, and 2. Operations are not conducted into known or forecast Over-The-Top conditions."},{"n":"34-00-54B","t":"Integrated Standby Flight Display","r":"Integrated Standby Flight Display (ISFD) ILS Indication INOP"},{"n":"34-00-54C","t":"Integrated Standby Flight Display","r":"Integrated Standby Flight Display (ISFD) Heading Indication INOP"},{"n":"34-00-54D","t":"(ISFD) Dedicated Battery 34-00-55 (VSD)","r":"SYSTEM"},{"n":"34-00-55","t":"Vertical Situation Display (VSD) System 34-00-56","r":"LANDING SYSTEM (GLS)"},{"n":"34-00-56","t":"Global Navigation Satellite Landing System (GLS)","r":"Date: 29-Sep-2022"},{"n":"35-00-02A","t":"Passenger Service Units (PSU’s)","r":"(M)May be inoperative provided: 1. Associated seats are blocked and placarded to prevent occupancy, and 2. Units operate normally for all usable lavatory and flight attendant locations. Note: MCC must contact Flight Control for coordinating with ACS and ROC to remove seat from inventory until repaired."},{"n":"35-00-02B","t":"Automatic Presentation","r":"(O)(M)May be inoperative provided: 1. Alternate deployment system is verified to operate normally, and 2. Aircraft remains at or below FL 300."},{"n":"35-00-02C","t":"Door Latches","r":"(M)Automatic opening feature of door latch(es) may be inoperative unlatched, and taped closed provided: 1. PSU oxygen system operates normally, 2. Flight remains at or below FL 250, and 3. Passenger(s) occupying the seat(s) with inoperative door latch(es) are briefed on oxygen mask procedure."},{"n":"35-00-03A","t":"Crew Indicator","r":"(O)(M)May be inoperative provided all cylinder indicators are checked to verify that oxygen supply is above minimum required for flight PRIOR TO EACH DEPARTURE. (Logbook Entry Required) Note: If CREW OXYGEN pressure indicator is less than 1,000 PSI, contact MTC for guidance. Aircraft may be able to continue in service in accordance with TOPP 40-40-05. Repetitive Check Required (Yellow Placard)"},{"n":"35-00-03B","t":"Overpressure Discharge Indication Disk","r":"(O)May be damaged or missing."},{"n":"35-00-04","t":"PORTABLE","r":"UNITS"},{"n":"35-00-04A","t":"Portable Oxygen Bottles or Units (Including Masks and Hoses)","r":"(O)(M)Any in excess of those required by 14 CFR may be inoperative or removed provided: 1. An inoperative or not properly serviced portable oxygen bottle/unit remains in a certified location until removed or serviced at the next suitable maintenance facility, 2. Location placarding is removed or obscured, 3. Required distribution is maintained, and 4. Maintenance Control Center is notified regarding affected bottle. Note 1: See(M)procedure for location placard disposition. Note 2: Inoperative portable oxygen bottles or units, removed from a certified location or removed from the aircraft are subject to 49 CFR dangerous goods regulations. Note 3: Medical equipment installed in the aircraft as part of an EMS operation is not considered part of the normal complement of equipment. No MEL relief applies to that equipment and 14 CFR maintenance and inspection requirements do not apply. Note 4: Reference charts in the(M) procedure for minimum number of full oxygen bottles required for dispatch."},{"n":"35-00-04B","t":"Portable Oxygen Bottles or Units - Tamper Seals or Tags","r":"(O)May be inoperative, damaged, or missing provided proper installation and servicing is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard) OR TAG INOP/DAMAGED/MISSING Date: 18-Dec-2024"},{"n":"35-00-05A","t":"Passenger Oxygen System","r":"(O)(M)May be inoperative provided: 1. Flight remains at or below FL 250, 2. Flight is not conducted where minimum enroute altitude is above 14,000 feet MSL, 3. Both air conditioning packs operate normally, 4. Remaining components of pressurization system operate normally, 5. Portable oxygen units are provided for 10% of passengers, based on installed portable oxygen bottles, and 6. Passengers are appropriately briefed."},{"n":"35-00-05B","t":"Passenger Oxygen System","r":"May be inoperative provided flight is conducted at or below 10,000 ft. MSL."},{"n":"35-00-06","t":"PBE (COCKPIT","r":"AND PASSENGER CABIN)"},{"n":"35-00-06A","t":"PBE Smoke Hood -Tamper Seals or Tags (Cockpit and Passenger Cabin)","r":"One Tamper Seal or Tag on each PBE may be inoperative, damaged, or missing."},{"n":"35-00-06B","t":"PBE Smoke Hood Tamper Seals or Tags (Cockpit and Passenger Cabin) (O) PROCEDURES","r":"(O)Both Tamp Seals or Tags may be inoperative, damaged, or missing provided proper installation and operation is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard) MISSING MISSING"},{"n":"36-00-01","t":"Manifold Isolation Shutoff Valve","r":"(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Valve remains CLOSED except for engine start, and 2. Aircraft is not operated in known or forecast icing conditions."},{"n":"36-00-02","t":"GROUND","r":"CHECK VALVE"},{"n":"36-00-02A","t":"Ground Pneumatic Connector Check Valve","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative OPEN provided: 1. Right pneumatic manifold remains depressurized after starting right engine, 2. Aircraft is not operated in known or forecast icing conditions, and 3. Altitude remains at or below FL 250."},{"n":"36-00-02B","t":"Ground Pneumatic Connector Check Valve","r":"May be inoperative in CLOSED position. Note: With the ground pneumatic connector check valve inoperative closed, engines cannot be started from ground source. Use APU as air source for starting engines."},{"n":"36-00-03A","t":"Precooler Control Valves","r":"(O)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative in any position provided: 1. Associated engine bleed shutoff valve remains closed, 2. Aircraft is not operated in known or forecast icing conditions, and 3. Flight level restrictions are applied."},{"n":"36-00-03B","t":"Precooler Control Valves","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative full open provided: 1. Airplane is not operated in known or forecast icing conditions, and 2. Performance correctionsare applied."},{"n":"36-00-04","t":"PNEUMATIC","r":"SYSTEMS"},{"n":"36-00-05","t":"ENGINE","r":"(PRSOV)"},{"n":"36-00-05A","t":"Engine Bleed Air Shutoff Valves (PRSOV)","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Valve is secured closed before engine start, 2. Aircraft is not operated in known or forecast icing conditions, and 3. Flight altitude remains at or below FL 250."},{"n":"36-00-05B","t":"Engine Bleed Air Shutoff Valves (PRSOV)","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Valve is secured closed before engine start, 2. Aircraft is not operated in known or forecast icing conditions, 3. APU bleed air system operates normally, and 4. Flight altitude remains at or below 17,000 feet."},{"n":"36-00-06","t":"Dual Bleed Light System","r":"(O)May be inoperative provided: 1. APU bleed air is not used in flight, and 2. APU bleed valve is verified closed PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"36-00-08","t":"Engine Bleed Trip Off Lights","r":"(O)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Associated engine bleed is not used except for engine start, 2. Aircraft is not operated in known or forecast icing conditions, and 3. Flight level restrictions are applied."},{"n":"36-00-09","t":"High Stage Valves","r":"(O)(M)May be inoperative locked closed provided a minimum of 60% N1 is maintained on associated engine during flight above FL300 or in icing conditions."},{"n":"38-00-01A","t":"Potable Water Systems","r":"(M)Individual components may be inoperative provided: 1. Associated components are deactivated or isolated, and 2. Associated system components are verified not to have leaks. Note: Any portion of system which operates normally may be used."},{"n":"38-00-01B","t":"Potable Water Systems (O) PROCEDURES","r":"(O)(M)May be inoperative provided: 1. System is drained, 2. Procedures are used to ensure that system is not serviced, and 3. Performance Corrections are applied."},{"n":"38-00-02A","t":"Lavatory Waste Systems","r":"(M)Individual components may be inoperative provided: 1. Associated components are deactivated or isolated, and 2. Associated system components are verified not to have leaks. Note: Any portion of system which operates normally may be used."},{"n":"38-00-02B","t":"Lavatory Waste Systems (O) PROCEDURES","r":"(O)(M)Associated lavatory system(s) may be inoperative provided: 1. Associated components are deactivated or isolated to prevent leaks, 2. Pilot-in-Command will determine if flight duration is acceptable with a FWD lavatory unusable, and 3. Associated lavatory door is secured closed and placarded “UNSERVICEABLE - DO NOT USE”. Note: These provisions are not intended to prohibit inspections by crewmembers."},{"n":"38-00-03","t":"Vacuum Blower (O) PROCEDURES Captain to brief Flight Attendants to lock affected lavatories above 16,000 feet. (M) PROCEDURES Deactivate the inoperative vacuum blower (AMM 38-32-00-040-803). DO OF THE P91 AND P92 OR DONOTOPENVACUUMWASTECONTROLCIRCUITBREAKERC1388(C11) (LOCATION C11 16,000 FEET. 1. Gain access to the inside of the P91 Distribution panel by 2. Pull and Secure Circuit Breaker (F2) locatedINSIDEthe BLOWER. (seeGraphic 38-1 Vacuum Waste Blower Circuit Note: DO NOT PULLCircuit Breaker (C11) labeled 38-2 Vacuum Waste Control Circuit Breaker 3. Close and secure all fasteners on the P91 front panel.","r":"(O)(M)May be inoperative provided: 1. Vacuum blower is deactivated, and 2. Lavatories are not used on the ground or at flight altitudes below 16,000 feet. below 16,000 feet and unlock affected lavatories IN THE P91 AND P92 PANELS. BE TO THE CIRCUIT BREAKERS ON THE PANELS (ROW F). IF IT IS POSSIBLE, POWER FIRST. THE P91 AND P92 AND CURRENTS. ELECTRICAL VOLTAGE CAUSE INJURIES. DISTRIBUTION PANEL NUMBER 1, P91). BREAKER IS REQUIRED FOR TOILET unlocking cam lock fasteners on panel face. P91 panel labeled VACUUM WASTE Breaker) VACUUM WASTE CONT shown inGraphic Date: 27-Aug-2025 is in a zero energy state. the vacuum blower. Circuit Breaker Date: 27-Aug-2025 Circuit Breaker Date: 27-Aug-2025"},{"n":"38-00-05","t":"INTERNATIONAL","r":"INC. POTABLE WATER"},{"n":"38-00-05A","t":"International Water-Guard Industries Inc. Potable Water Quantity Pre-Select System","r":"(M)Individual components may be inoperative provided: 1. Associated components are deactivated, and 2. Associated components are verified not to have leaks."},{"n":"38-00-05B","t":"International Water-Guard Industries Inc. Potable Water Quantity Pre-Select System","r":"System may be inoperative provided procedures do not require its use. Note: AMM procedures for filling potable water tank are unchanged whether system is operative or inoperative."},{"n":"46-00-01A","t":"Electronic Flight Bag (EFB) Systems – Power Supply / Power Connection","r":"(O)May be inoperative provided alternate procedures are used."},{"n":"46-00-01B","t":"Electronic Flight Bag (EFB) Systems – Power Supply / Power Connection","r":"(O)May be inoperative provided procedures do not require its use."},{"n":"46-00-01C","t":"Electronic Flight Bag (EFB) Systems - Mounting Device (Fixed Mount)","r":"(O)(M)May be inoperative provided: 1. Associated EFB and hardware is stowed, secured by an alternate means, or removed from the aircraft, and 2. Alternate procedures are used."},{"n":"46-00-01D","t":"Electronic Flight Bag (EFB) Systems - Mounting Device (Fixed Mount)","r":"(M)May be inoperative provided: 1. Associated EFB and hardware is stowed, secured by an alternate means, or removed from the aircraft, and 2. Procedures do not require its use."},{"n":"46-00-02","t":"Onboard Network System (ONS) (-900ER)","r":"May be inoperative provided procedures do not require its use. Date: 15-Mar-2023"},{"n":"47-00-01","t":"NITROGEN","r":"(NGS)"},{"n":"47-00-01A","t":"Nitrogen Generation System (NGS)","r":"(M)May be inoperative provided: 1. NGS shutoff valve is deactivated closed, and 2. Repairs are made within ten flight days."},{"n":"47-00-01B","t":"Aircraft Logbook (M) PROCEDURES","r":"Nitrogen Generation System Degraded"},{"n":"49-00-01A","t":"Auxiliary Power Unit","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided: 1. Procedures do not require its use, and 2. Visual confirmation is made that no damage has occurred to APU exhaust area. Note: Use of coastal routing is recommended for operations from Alaska \"to\" 48 contiguous states. Theater Restrictions may apply"},{"n":"49-00-01B","t":"APU System – Cold Soak Not Verified","r":"(O)Inflight verification of cold soak start capability has not been accomplished. Extended Operations (ETOPS) Not Authorized: 1. APU is shut down before takeoff and remains OFF until cold soak start is attempted, 2. Cold soak inflight start of APU may be accomplished after at least two flight hours at or above FL270, 3. In-flight start data will be entered into the aircraft log book, and 4. Verification is accomplished within 6 flight cycles."},{"n":"49-00-01C","t":"APU System – Cold Soak Not Verified","r":"(O)(M)Inflight verification of cold soak start capability has not been accomplished. Extended Operations (ETOPS) Authorized: 1. APU oil quantity is serviced to full, 2. APU is started on the ground, 3. APU remains operating throughout the ETOPS portion of the flight, 4. Authorization limited to one flight, and 5. Performance Corrections are applied."},{"n":"49-00-02","t":"APU","r":"AND OVER SPEED LIGHTS"},{"n":"49-00-04A","t":"APU Annunciator MAINT Light","r":"(M)May be inoperative and APU used provided APU oil quantity is checked ONCE EACH FLIGHT DAY (Log Book Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"49-00-04B","t":"APU Annunciator MAINT Light","r":"(O)May be inoperative provided APU is not used."},{"n":"49-00-05","t":"APU EGT Indicator","r":"May be inoperative."},{"n":"49-00-06A","t":"APU Inlet Door","r":"(O)(M)May be inoperative open provided performance correctionsare applied."},{"n":"49-00-06B","t":"APU Inlet Door","r":"(O)(M)Except for Extended Operations (ETOPS), may be inoperative in any other position if APU is not used and performance corrections are applied."},{"n":"49-00-07A","t":"APU Bleed Air Valve","r":"(M)May be inoperative closed. Note 1: Airstart cart will be required for engine start. Note 2: APU may be used to provide electrical power."},{"n":"49-00-07B","t":"APU Bleed Air Valve","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided: 1. APU bleed air check valve operates normally, and 2. APU is not operated. Note: Airstart cart will be required for engine start."},{"n":"49-00-09A","t":"APU Surge Control Valve","r":"(O)May be inoperative in open position provided APU bleed air is not used. Note: APU may be used to provide electrical power."},{"n":"49-00-09B","t":"APU Surge Control Valve","r":"(O)Except for Extended Operations (ETOPS), may be inoperative in closed position provided APU is not used."},{"n":"49-00-12","t":"FAULT Light","r":"APU Annunciator FAULT Light INOP Power (APU) Date: 29-Sep-2022"},{"n":"49-00-15A","t":"Start Power Unit (SPU)","r":"(O)(M)Except for Extended Operations (ETOPS), may be inoperative provided procedures do not require use of APU."},{"n":"49-00-15B","t":"APU Switch (O) PROCEDURES","r":"APU AC / DC Start INOP"},{"n":"49-00-16A","t":"Start Converter Unit","r":"(O)(M)Except for Extended Operations (ETOPS), May be inoperative provided procedures do not require use of APU."},{"n":"49-00-16B","t":"Voltage Regulation Function","r":"Power (APU) Date: 10-Apr-2024"},{"n":"52-00-03A","t":"Entry / Service / Cargo / Equip / Mid-Exit","r":"(M)May be inoperative provided door(s) are verified closed and locked PRIOR TO EACH DEPARTURE. Note: Cargo door warning light system may disable the associated cargo compartment light system. Refer toMEL 33-00-04A. Repetitive Check Required (Yellow Placard)"},{"n":"52-00-03B","t":"Overwing","r":"(M)May be inoperative provided PRIOR TO EACH DEPARTURE (Log Book Entry Required): 1. Associated door is verified closed and latched, and 2. Associated flight lock is verified to operate normally. repetitivecheckrequired (Yellow Placard)"},{"n":"52-00-05","t":"LEFT","r":"STOP FITTINGS"},{"n":"52-00-05A","t":"Forward Entry Door","r":"(O)(M)One per door may be broken or missing provided: 1. There are no visible defects on other fittings for associated door, 2. Pressure differential does not exceed 6.0 psi, 3. Digital cabin pressure control system AUTO or ALTN control mode operates normally, 4. Alternate procedures are used, and 5. Limit altitude to FL270."},{"n":"52-00-05B","t":"Aft Entry Door","r":"(O)(M)One per door may be broken or missing provided: 1. There are no visible defects on other fittings for associated door, 2. Pressure differential does not exceed 3.4 psi, 3. Digital cabin pressure control system AUTO or ALTN control mode operates normally, 4. Alternate procedures are used, and 5. Limit altitude to FL170."},{"n":"52-00-06","t":"LOWER","r":"STOP FITTINGS"},{"n":"52-00-06A","t":"Lower Cargo Doors Pressure Stop Fittings","r":"(M)Any one may be broken or missing on each door or frame provided: 1. No defects are visible on other fittings for associated door, 2. Cabin pressure AUTO mode operates normally, 3. Adjacent stop fittings are inspected on initial deferral and PRIOR TO 25 FLIGHTS (Log book entry required) (Create separate MON deferral to track 25 cycle re-inspect), and 4. Not more than 50 flights are made before completion of repairs or replacements (to be tracked on MEL log). Repetitive Check Required (Yellow Placard)"},{"n":"52-00-06B","t":"Lower Cargo Doors Pressure Stop Fittings (3701-3771, 3774-3777, 3801-3930)","r":"(O)(M)Two may be broken or missing on each door or frame provided: 1. Airplane is operated in an unpressurized configuration at or below 10,000 feet MSL, and 2. Extended overwater flight is prohibited.."},{"n":"52-00-06C","t":"Lower Cargo Doors Pressure Stop Fittings (3772, 3773)","r":"(O)(M)Two may be broken or missing on each door or frame provided: 1. Flight is conducted in an unpressurized configuration, 2. Procedures are used to ensure lower forward cargo compartment remains empty, or is verified to contain only empty cargo handling equipment, ballast (ballast may be loaded in ULDs), and/or Fly Away Kits (see MEL Instructions), and 3. Extended overwater flight is prohibited."},{"n":"52-00-07","t":"ENTRY /-OPEN","r":"LATCH RELEASE LEVER"},{"n":"52-00-09","t":"LOWER","r":"MECHANISM"},{"n":"52-00-14","t":"LOWER","r":"MECHANISM / DEVICE"},{"n":"52-00-14A","t":"Lower Cargo Doors Hold Open Mechanism/ Device","r":"(M)May be inoperative provided door balance mechanism operates normally."},{"n":"52-00-14B","t":"Lower Cargo Doors Hold Open Mechanism/ Device (M) PROCEDURES","r":"(M)May be inoperative provided cargo compartment remains empty, or is verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions)."},{"n":"52-00-15","t":"Overwing Exit Flight Lock System","r":"(O)(M)May be inoperative provided: 1. For inoperative flight lock(s) inputs to associated flight deck indications are deactivated, 2. Each affected exit is verified to be capable of being unlatched and opened PRIOR TO EACH DEPARTURE (Log Book Entry Required), and 3. A Delta employee is designated to remain seated in passenger seat nearest affected exit when cabin differential pressure is less than 4.0 psi. Repetitive Check Required (Yellow Placard)"},{"n":"52-00-17","t":"ENHANCED","r":"DOOR AUTOMATIC LOCKING"},{"n":"52-00-17A","t":"Flight Deck Security Door Automatic Locking System","r":"(O)(M)May be inoperative provided: 1. Automatic locking system is deactivated, 2. Door dead bolt operates normally and is used to lock door, and 3. Alternate procedures are used for locking and unlocking door using the dead bolt."},{"n":"52-00-17B","t":"Flight Deck Access Panel System (Keypad, Door Chime)","r":"(O)(M)May be inoperative provided: 1. Keypad is deactivated, and 2. Alternate procedures are used."},{"n":"52-00-17C","t":"LEDs","r":"(O)May be inoperative provided alternate procedures are used."},{"n":"52-00-17D","t":"Flight Deck Door LOCK FAIL Light","r":"(M)May be inoperative provided automatic lock controls are verified to operate normally."},{"n":"52-00-17E","t":"Flight Deck Door AUTO UNLK Light","r":"(M)May be inoperative provided: 1. Automatic lock controls are verified to operate normally, and 2. Door chime operates normally."},{"n":"52-00-17F","t":"Flight Deck Door Lock Control Selector","r":"(O)(M)May be inoperative provided: 1. Keypad is deactivated, 2. Automatic lock is verified to operate normally, and 3. Alternate procedures are used."},{"n":"52-00-18","t":"Flight Deck Security Door Dead Bolt 52-00-20","r":"RELIEF LATCHES"},{"n":"52-00-20","t":"Flight Deck Door Panel Pressure Relief Latches 52-00-22","r":"(E.G. DOOR STOP, FOOT PLUNGER, ETC.)"},{"n":"52-00-22","t":"Flight Deck Door Hold Open Device (e.g. Door 52-00-25","r":"Stop, Foot Plunger, etc.) RECESS/HINGE SPRING ASSEMBLIES"},{"n":"52-00-25","t":"CARGO","r":"RECESS/HINGE SPRING"},{"n":"52-00-25A","t":"Cargo Door Exterior Handle Recess","r":"(M)May be inoperative or missing provided PRIOR TO EACH DEPARTURE the affected cargo door exterior handle is secure in a recessed position flush with the fuselage. Note: This MEL may be applied to an inoperative exterior handle retract spring/ spring assembly and/or to an inoperative flapper door hinge spring assembly. Repetitive Check Required (Yellow Placard)"},{"n":"52-00-25B","t":"Cargo Door Exterior Handle Hinge Spring Assemblies","r":"Date: 14-Feb-2024"},{"n":"53-00-00V","t":"RVSM Status","r":"(M)Authorized by MCC when: 1. RVSM operations cannot be used, 2. No specific MEL item applies, and 3. The aircraft must remain at or below FL280. Note: This SYS/SEQ number is to be used for deferring the RVSM Status of the aircraft. This number also requires Maintenance Control’s authorization prior to its usage or removal. RVSM Operations Not Authorized"},{"n":"73-00-04","t":"FUEL","r":"WARNING SYSTEMS"},{"n":"73-00-05","t":"Fuel Flow Indication Systems","r":"One may be inoperative provided: 1. N1, N2 for associated engine operate normally, and 2. Both main tank fuel quantity indicators operate normally."},{"n":"73-00-06","t":"Near Primary Engine Display","r":"____ Fuel Used Indicator(s) INOP Control Date: 29-Sep-2022"},{"n":"73-00-10","t":"FUEL","r":"INDICATING SYSTEM"},{"n":"73-00-11","t":"Normal (ON) Mode","r":"(O)May be inoperative provided: 1. Both engines are operated in ALTERNATE mode, and 2. Performance correctionsare applied."},{"n":"73-00-12","t":"ELECTRONIC ENGINE CONTROL (EEC) SYSTEM","r":"ALTERNATE POWER SUPPLY"},{"n":"73-00-90A","t":"Short Time Fault","r":"May be dispatched with EEC BITE-RECENT FAULTS, SHORT TIME, provided repairs are made within 5 flight days."},{"n":"73-00-90B","t":"Long Time Fault","r":"May be dispatched with EEC BITE-RECENT FAULTS, LONG TIME, provided repairs are made within 10 flight days."},{"n":"74-00-01A","t":"Left Ignition Systems","r":"(O)May be inoperative provided: 1. Ignition Select Switch remains in BOTH position, and 2. Right ignition systems operate normally."},{"n":"74-00-01B","t":"Left Ignition Systems","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided: 1. Ignition Select Switch remains in BOTH position, and 2. Associated engine right ignition system operates normally."},{"n":"74-00-01C","t":"Right Ignition Systems","r":"(O)(M)One may be inoperative provided: 1. Ignition Select Switch remains in BOTH position, 2. Left ignition system operates normally, and 3. Associated engine left igniter is connected to AC Standby Bus by an acceptable configuration."},{"n":"74-00-01D","t":"Right Ignition Systems","r":"(O)(M)Except for Extended Operations (ETOPS), may be inoperative provided: 1. Ignition Select Switch remains in BOTH position, 2. Associated engine left ignition system operates normally, and 3. Associated engine left igniter is connected to AC Standby Bus by an acceptable configuration."},{"n":"77-00-02A","t":"Engine Display Control Unit","r":"N1 Tachometers Reference N1 Bugs INOP"},{"n":"77-00-02B","t":"Engine Display Control Unit","r":"N1 Tachometers Manual Set Indication INOP Date: 29-Sep-2022"},{"n":"77-00-05","t":"Secondary Engine Control Display Unit","r":"____ Vibration Indicating System INOP Date: 01-Nov-2023"},{"n":"78-00-01","t":"Thrust Reverser Systems","r":"(O)(M)May be inoperative provided: 1. Thrust reverser is locked in forward thrust position, and 2. Performance corrections are applied."},{"n":"78-00-07","t":"REVERSER LIGHTS (AFT OVERHEAD","r":"PANEL)"},{"n":"79-00-01","t":"Oil Quantity Indication Systems","r":"(M)Except for Extended Operations (ETOPS), may be inoperative provided: 1. Oil Tank is filled to maximum recommended capacity PRIOR TO EACH DEPARTURE (Logbook Entry Required), 2. There is no evidence of above normal oil consumption or leakage, and 3. Associated low oil pressure warning system operates normally. Repetitive Check Required (Yellow Placard)"},{"n":"79-00-02","t":"Oil Filter Bypass Warning Systems","r":"(M)May be inoperative provided: 1. Malfunction is in the warning system, 2. Magnetic chip Detector is inspected for presence of contaminants, 3. Oil supply filter pop-out indicator is not extended, and 4. Oil filter is inspected for presence of contaminants WITHIN ONE FLIGHT DAY and ONCE EACH FLIGHT DAY thereafter. (Logbook Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"79-00-04","t":"Oil Low Pressure Warning Systems","r":"May be inoperative provided associated oil pressure, oil temperature, and oil quantity indicators operates normally."},{"n":"80-00-01","t":"Starter Valve Open Indications","r":"(O)May be inoperative provided it is checked AFTER ENGINE START that associated valve is closed. Note: The associated PRSOV will be commanded closed when the START VALVE OPEN indication is inoperative ON. This will result in the loss of the associated engine bleed. Defer associated PRSOV perMEL 36-00-05. Repetitive Check Required (Yellow Placard)"},{"n":"80-00-02","t":"Engine Starter Auto Cutout","r":"May be inoperative provided crew manually selects Start Switch OFF at 55% N2."},{"n":"80-00-03","t":"Starter Valves","r":"(O)(M)Except for Extended Operations (ETOPS), may be inoperative provided: 1. Associated start valve indication operates normally, and 2. PRIOR TO EACH DEPARTURE manual override start procedures are used. Repetitive Check Required (Yellow Placard)"},{"n":{},"t":"NAME / DESCRIPTION","r":"REMARKS OR EXCEPTIONS"},{"n":"11-00-01","t":"AIRCRAFT PLACARDS/MARKINGS","r":"REPAIR INSTALLED"},{"n":"21-00-01A","t":"Air Conditioning Packs Left Pack (B737-800)","r":"(O)Left Pack may be inoperative provided: 1. Flight altitude remains at or below FL 250, and 2. Right Pack is operative. Note: If operational and not restricted from use by another MEL, APU pneumatics should be used to supply the operating pack to increase air flow when the flaps are extended for takeoff and landing. Theater Restrictions may apply"},{"n":"21-00-01B","t":"Air Conditioning Packs Right Pack (B737-800)","r":"(O)Right Pack may be inoperative provided: 1. Flight altitude remains at or below FL 250, and 2. Left Pack is operative. Note: If operational and not restricted from use by another MEL, APU pneumatics should be used to supply the operating pack to increase air flow when the flaps are extended for takeoff and landing. Theater Restrictions may apply"},{"n":"21-00-01C","t":"Air Conditioning Packs Both Packs (B737-800)","r":"(O)(M)Both Packs may be inoperative provided: 1. Flight is conducted in an unpressurized configuration, 2. Recirculation fan(s) operates normally, 3. Both E/E equipment cooling exhaust fans operate normally, and 4. Cargo compartments remain empty, or are verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions). Theater Restrictions may apply Date: 09-Apr-2025"},{"n":"21-00-01D","t":"Air Conditioning Packs Left Pack (B737-900ER)","r":"(O)(M)Except for Extended Operations (ETOPS), Left Pack may be inoperative provided: 1. Flight altitude remains at or below FL 250, 2. Right Pack is operative, 3. Forward cargo heat duct is secured closed, and 4. Airport ambient temperature does not exceed 103 degrees F (39 degrees C). Note: If operational and not restricted from use by another MEL, APU pneumatics should be used to supply the operating pack to increase air flow when the flaps are extended for takeoff and landing. Theater Restrictions may apply"},{"n":"21-00-01E","t":"Air Conditioning Packs Right Pack (B737-900ER)","r":"(O)(M)Except for Extended Operations (ETOPS), Right Pack may be inoperative provided: 1. Flight altitude remains at or below FL 250, 2. Left Pack is operative, 3. Forward cargo heat duct is secured closed, and 4. Airport ambient temperature does not exceed 103 degrees F (39 degrees C). Note: If operational and not restricted from use by another MEL, APU pneumatics should be used to supply the operating pack to increase air flow when the flaps are extended for takeoff and landing. Theater Restrictions may apply"},{"n":"21-00-01F","t":"Air Conditioning Packs Both Packs(-900ER)","r":"(O)(M)Except for Extended Operations (ETOPS), Both Packs may be inoperative provided: 1. Flight is conducted in an unpressurized configuration, 2. Recirculation fans operate normally, 3. Both E/E equipment cooling exhaust fans operate normally, 4. Cargo compartments remain empty, or are verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions), 5. Forward cargo heat duct is secured closed, and 6. Airport ambient temperature does not exceed 103 degrees F (39 degrees C). Theater Restrictions may apply Date: 09-Apr-2025"},{"n":"21-00-02A","t":"Pack Airflow / Shut-Off Valves","r":"(O)(M)May be inoperative provided: 1. Associated valve is deactivated closed, 2. Associated Air Conditioning Pack is considered inoperative and deferred perMEL 21-00-01A,21-00-01B,21-00-01Dor 21-00-01Eas applicable, and 3. Flight altitude remains at or below FL 250."},{"n":"21-00-02B","t":"Pack Airflow / Shut-Off Valves","r":"(O)(M)May be inoperative provided: 1. Valves are deactivated closed, 2. Flight is conducted in an unpressurized configuration, 3. Associated Air Conditioning Pack is considered inoperative and deferred perMEL 21-00-01Cor21-00-01Fas applicable,and 4. Cargo compartments remain empty, or are verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions)."},{"n":"21-00-02C","t":"High Flow Mode","r":"May be inoperative."},{"n":"21-00-02D","t":"APU High Flow Mode","r":"May be inoperative."},{"n":"21-00-02E","t":"Electronic Flow Control (B737-900ER Aircraft 3853-3930)","r":"(O)One or both may be inoperative provided: 1. Appropriate performance corrections are applied, 2. Procedures are used to ensure AFT lower cargo compartment remain empty, or is verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions), and 3. Performance correctionsare applied. Note 1: This item is AD related Note 2: Backup pneumatic flow control will result in larger flow transients and airflow noise associated with bleed air pressure changes. Note 3: With Electronic Flow Control Valve in backup pneumatic flow control, the associated PACK light will illuminate during Master Caution recall and will extinguish when Master Caution is reset. Date: 09-Apr-2025"},{"n":"21-00-02F","t":"Pack Flow Sensors (B737-900ER Aircraft 3853-3930)","r":"(M)May be inoperative provided pack inlet pressure sensor(s) for associated air conditioning pack(s) is verified to operate normally."},{"n":"21-00-02G","t":"Pack Flow Sensors (B737-900ER Aircraft 3853-3930)","r":"Maybe inoperative provided associated Electronic Flow Control is considered inoperative and deferred perMEL 21-00-02E."},{"n":"21-00-02H","t":"Pack Inlet Pressure Sensors (B737-900ER Aircraft 3853-3930)","r":"(M)May be inoperative provided pack flow sensor(s) for associated air conditioning pack(s) is verified to operate normally."},{"n":"21-00-02I","t":"Pack Inlet Pressure Sensors (B737-900ER Aircraft 3853-3930)","r":"Maybe inoperative provided associated Electronic Flow Control is considered inoperative and deferred perMEL 21-00-02E."},{"n":"35-00-04A","t":"Portable Oxygen Bottles or Units (Including Masks and Hoses)","r":"(O)(M)Any in excess of those required by 14 CFR may be inoperative or removed provided: 1. An inoperative or not properly serviced portable oxygen bottle/unit remains in a certified location until removed or serviced at the next suitable maintenance facility, 2. Location placarding is removed or obscured, 3. Required distribution is maintained, and 4. Maintenance Control Center is notified regarding affected bottle. Note 1: See(M)procedure for location placard disposition. Note 2: Inoperative portable oxygen bottles or units, removed from a certified location or removed from the aircraft are subject to 49 CFR dangerous goods regulations. Note 3: Medical equipment installed in the aircraft as part of an EMS operation is not considered part of the normal complement of equipment. No MEL relief applies to that equipment and 14 CFR maintenance and inspection requirements do not apply. Note 4: Reference charts in the(M) procedure for minimum number of full oxygen bottles required for dispatch."},{"n":"35-00-04B","t":"Portable Oxygen Bottles or Units - Tamper Seals or Tags","r":"(O)May be inoperative, damaged, or missing provided proper installation and servicing is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard) OR TAG INOP/DAMAGED/MISSING Date: 18-Dec-2024"},{"n":"35-00-05A","t":"Passenger Oxygen System","r":"(O)(M)May be inoperative provided: 1. Flight remains at or below FL 250, 2. Flight is not conducted where minimum enroute altitude is above 14,000 feet MSL, 3. Both air conditioning packs operate normally, 4. Remaining components of pressurization system operate normally, 5. Portable oxygen units are provided for 10% of passengers, based on installed portable oxygen bottles, and 6. Passengers are appropriately briefed."},{"n":"35-00-05B","t":"Passenger Oxygen System","r":"May be inoperative provided flight is conducted at or below 10,000 ft. MSL."},{"n":"35-00-06","t":"PBE (COCKPIT","r":"AND PASSENGER CABIN)"},{"n":"35-00-06A","t":"PBE Smoke Hood -Tamper Seals or Tags (Cockpit and Passenger Cabin)","r":"One Tamper Seal or Tag on each PBE may be inoperative, damaged, or missing."},{"n":"35-00-06B","t":"PBE Smoke Hood Tamper Seals or Tags (Cockpit and Passenger Cabin) (O) PROCEDURES","r":"(O)Both Tamp Seals or Tags may be inoperative, damaged, or missing provided proper installation and operation is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard) MISSING MISSING"},{"n":"36-00-01","t":"Manifold Isolation Shutoff Valve","r":"(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Valve remains CLOSED except for engine start, and 2. Aircraft is not operated in known or forecast icing conditions."},{"n":"36-00-02","t":"GROUND","r":"CHECK VALVE"},{"n":"36-00-02A","t":"Ground Pneumatic Connector Check Valve","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative OPEN provided: 1. Right pneumatic manifold remains depressurized after starting right engine, 2. Aircraft is not operated in known or forecast icing conditions, and 3. Altitude remains at or below FL 250."},{"n":"36-00-02B","t":"Ground Pneumatic Connector Check Valve","r":"May be inoperative in CLOSED position. Note: With the ground pneumatic connector check valve inoperative closed, engines cannot be started from ground source. Use APU as air source for starting engines."},{"n":"36-00-03A","t":"Precooler Control Valves","r":"(O)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative in any position provided: 1. Associated engine bleed shutoff valve remains closed, 2. Aircraft is not operated in known or forecast icing conditions, and 3. Flight level restrictions are applied."},{"n":"36-00-03B","t":"Precooler Control Valves","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative full open provided: 1. Airplane is not operated in known or forecast icing conditions, and 2. Performance correctionsare applied."},{"n":"36-00-04","t":"PNEUMATIC","r":"SYSTEMS"},{"n":"36-00-05","t":"ENGINE","r":"(PRSOV)"},{"n":"36-00-05A","t":"Engine Bleed Air Shutoff Valves (PRSOV)","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Valve is secured closed before engine start, 2. Aircraft is not operated in known or forecast icing conditions, and 3. Flight altitude remains at or below FL 250."},{"n":"36-00-05B","t":"Engine Bleed Air Shutoff Valves (PRSOV)","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Valve is secured closed before engine start, 2. Aircraft is not operated in known or forecast icing conditions, 3. APU bleed air system operates normally, and 4. Flight altitude remains at or below 17,000 feet."},{"n":"36-00-06","t":"Dual Bleed Light System","r":"(O)May be inoperative provided: 1. APU bleed air is not used in flight, and 2. APU bleed valve is verified closed PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"36-00-08","t":"Engine Bleed Trip Off Lights","r":"(O)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Associated engine bleed is not used except for engine start, 2. Aircraft is not operated in known or forecast icing conditions, and 3. Flight level restrictions are applied."},{"n":"36-00-09","t":"High Stage Valves","r":"(O)(M)May be inoperative locked closed provided a minimum of 60% N1 is maintained on associated engine during flight above FL300 or in icing conditions."},{"n":"38-00-01A","t":"Potable Water Systems","r":"(M)Individual components may be inoperative provided: 1. Associated components are deactivated or isolated, and 2. Associated system components are verified not to have leaks. Note: Any portion of system which operates normally may be used."},{"n":"38-00-01B","t":"Potable Water Systems (O) PROCEDURES","r":"(O)(M)May be inoperative provided: 1. System is drained, 2. Procedures are used to ensure that system is not serviced, and 3. Performance Corrections are applied."},{"n":"38-00-02A","t":"Lavatory Waste Systems","r":"(M)Individual components may be inoperative provided: 1. Associated components are deactivated or isolated, and 2. Associated system components are verified not to have leaks. Note: Any portion of system which operates normally may be used."},{"n":"38-00-02B","t":"Lavatory Waste Systems (O) PROCEDURES","r":"(O)(M)Associated lavatory system(s) may be inoperative provided: 1. Associated components are deactivated or isolated to prevent leaks, 2. Pilot-in-Command will determine if flight duration is acceptable with a FWD lavatory unusable, and 3. Associated lavatory door is secured closed and placarded “UNSERVICEABLE - DO NOT USE”. Note: These provisions are not intended to prohibit inspections by crewmembers."},{"n":"38-00-03","t":"Vacuum Blower (O) PROCEDURES Captain to brief Flight Attendants to lock affected lavatories above 16,000 feet. (M) PROCEDURES Deactivate the inoperative vacuum blower (AMM 38-32-00-040-803). DO OF THE P91 AND P92 OR DONOTOPENVACUUMWASTECONTROLCIRCUITBREAKERC1388(C11) (LOCATION C11 16,000 FEET. 1. Gain access to the inside of the P91 Distribution panel by 2. Pull and Secure Circuit Breaker (F2) locatedINSIDEthe BLOWER. (seeGraphic 38-1 Vacuum Waste Blower Circuit Note: DO NOT PULLCircuit Breaker (C11) labeled 38-2 Vacuum Waste Control Circuit Breaker 3. Close and secure all fasteners on the P91 front panel.","r":"(O)(M)May be inoperative provided: 1. Vacuum blower is deactivated, and 2. Lavatories are not used on the ground or at flight altitudes below 16,000 feet. below 16,000 feet and unlock affected lavatories IN THE P91 AND P92 PANELS. BE TO THE CIRCUIT BREAKERS ON THE PANELS (ROW F). IF IT IS POSSIBLE, POWER FIRST. THE P91 AND P92 AND CURRENTS. ELECTRICAL VOLTAGE CAUSE INJURIES. DISTRIBUTION PANEL NUMBER 1, P91). BREAKER IS REQUIRED FOR TOILET unlocking cam lock fasteners on panel face. P91 panel labeled VACUUM WASTE Breaker) VACUUM WASTE CONT shown inGraphic Date: 27-Aug-2025 is in a zero energy state. the vacuum blower. Circuit Breaker Date: 27-Aug-2025 Circuit Breaker Date: 27-Aug-2025"},{"n":"38-00-05","t":"INTERNATIONAL","r":"INC. POTABLE WATER"},{"n":"38-00-05A","t":"International Water-Guard Industries Inc. Potable Water Quantity Pre-Select System","r":"(M)Individual components may be inoperative provided: 1. Associated components are deactivated, and 2. Associated components are verified not to have leaks."},{"n":"38-00-05B","t":"International Water-Guard Industries Inc. Potable Water Quantity Pre-Select System","r":"System may be inoperative provided procedures do not require its use. Note: AMM procedures for filling potable water tank are unchanged whether system is operative or inoperative."},{"n":"46-00-01A","t":"Electronic Flight Bag (EFB) Systems – Power Supply / Power Connection","r":"(O)May be inoperative provided alternate procedures are used."},{"n":"46-00-01B","t":"Electronic Flight Bag (EFB) Systems – Power Supply / Power Connection","r":"(O)May be inoperative provided procedures do not require its use."},{"n":"46-00-01C","t":"Electronic Flight Bag (EFB) Systems - Mounting Device (Fixed Mount)","r":"(O)(M)May be inoperative provided: 1. Associated EFB and hardware is stowed, secured by an alternate means, or removed from the aircraft, and 2. Alternate procedures are used."},{"n":"46-00-01D","t":"Electronic Flight Bag (EFB) Systems - Mounting Device (Fixed Mount)","r":"(M)May be inoperative provided: 1. Associated EFB and hardware is stowed, secured by an alternate means, or removed from the aircraft, and 2. Procedures do not require its use."},{"n":"46-00-02","t":"Onboard Network System (ONS) (-900ER)","r":"May be inoperative provided procedures do not require its use. Date: 15-Mar-2023"},{"n":"47-00-01","t":"NITROGEN","r":"(NGS)"},{"n":"47-00-01A","t":"Nitrogen Generation System (NGS)","r":"(M)May be inoperative provided: 1. NGS shutoff valve is deactivated closed, and 2. Repairs are made within ten flight days."},{"n":"47-00-01B","t":"Aircraft Logbook (M) PROCEDURES","r":"Nitrogen Generation System Degraded"},{"n":"49-00-01A","t":"Auxiliary Power Unit","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided: 1. Procedures do not require its use, and 2. Visual confirmation is made that no damage has occurred to APU exhaust area. Note: Use of coastal routing is recommended for operations from Alaska \"to\" 48 contiguous states. Theater Restrictions may apply"},{"n":"49-00-01B","t":"APU System – Cold Soak Not Verified","r":"(O)Inflight verification of cold soak start capability has not been acco const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const clrEl = document.getElementById('clr');
const countEl = document.getElementById('count');
document.getElementById('total').textContent = MEL.length;

// precompute search haystack + chapter
// normalize fields — a few PDF-extraction rows lost their number and came through non-string
MEL.forEach(m=>{
  m.n = (typeof m.n==='string') ? m.n : '';
  m.t = (typeof m.t==='string') ? m.t : '';
  m.r = (typeof m.r==='string') ? m.r : '';
});
// drop stray table-header rows captured during extraction
for(let i=MEL.length-1;i>=0;i--){ if(!MEL[i].n && /^(NAME|DESCRIPTION)/i.test(MEL[i].t)) MEL.splice(i,1); }
MEL.forEach(m=>{
  var p = (typeof window!=='undefined' && window.PROC) ? window.PROC[m.n] : null;
  var fl = (typeof window!=='undefined' && window.FLAGS) ? window.FLAGS[m.n] : null;
  m._h = (m.n+' '+m.t+' '+m.r+(p?' '+(p.o||'')+' '+(p.m||''):'')+(fl?((fl.da?' dispatch approval required':'')+(fl.mcc?' contact mcc':'')):'')).toLowerCase();
  m._c = /^\d{2}/.test(m.n) ? m.n.slice(0,2) : '';
});
var _tot=document.getElementById('total'); if(_tot) _tot.textContent=MEL.length;

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function idOf(n){ return 'mel-'+String(n||'').replace(/[^A-Za-z0-9]/g,''); }

// wrap query tokens in <mark> on already-escaped text
function hl(text, toks){
  let out = esc(text);
  toks.forEach(t=>{
    if(!t) return;
    const re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out;
}

// pull leading (O)/(M) markers into badges, put line breaks before numbered provisos
function fmtRemarks(r){
  let badges = '';
  let body = r || '';
  const lead = body.match(/^\s*((?:\([OM]\))+)/);
  if(lead){
    if(/\(O\)/.test(lead[1])) badges += '<span class="badge o">(O)</span>';
    if(/\(M\)/.test(lead[1])) badges += '<span class="badge m">(M)</span>';
    body = body.slice(lead[0].length);
  }
  // put each numbered proviso (1. 2. 3. …) on its own line, like the printed MEL
  body = body.trim().replace(/\s+(?=[1-9]\d?\.\s)/g, '\n');
  return { badges, body };
}

// reflow PDF soft-wraps: join continuation lines, keep steps / Notes on their own lines
function fmtProc(s){
  return String(s||'').split('\n').reduce((acc,ln)=>{
    ln=ln.trim(); if(!ln) return acc;
    if(acc==='' || /^(\d+\.|[a-z]\.|Note:|-)\s/.test(ln)) return acc + (acc?'\n':'') + ln;
    return acc + ' ' + ln;
  }, '');
}

function render(){
  const raw = qEl.value.trim();
  const toks = raw.toLowerCase().split(/\s+/).filter(Boolean);
  clrEl.style.display = raw ? '' : 'none';
  tocEl.style.display = raw ? 'none' : '';
  const hits = MEL.filter(m => toks.every(t => m._h.includes(t)));
  countEl.textContent = raw ? (hits.length + ' of ' + MEL.length + ' items') : (MEL.length + ' items');

  if(!hits.length){ listEl.innerHTML = '<div class="none">No MEL item matches &ldquo;'+esc(raw)+'&rdquo;</div>'; return; }

  let html = '', curChap = null, curBase = null;
  hits.forEach(m=>{
    if(m._c !== curChap){
      curChap = m._c; curBase = null;
      const name = ATA[curChap] || (curChap ? 'ATA '+curChap : 'OTHER');
      html += '<div class="chapter" id="chap-'+(curChap||'x')+'">'+(curChap?curChap+' &mdash; ':'')+esc(name)+'</div>';
    }
    const base = (m.n||'').replace(/[A-Za-z]+$/,'');
    if(base && base!==curBase){
      curBase = base;
      const sname = (typeof window!=='undefined' && window.SUBSEC) ? window.SUBSEC[base] : '';
      html += '<div class="subhd"><span class="sn">'+esc(base)+'</span>'+(sname?'<span class="st">'+hl(sname, toks)+'</span>':'')+'</div>';
    }
    const f = fmtRemarks(m.r);
    const remHtml = f.body ? '<div class="rem">'+hl(f.body, toks)+'</div>' : '';
    const p = (window.PROC && m.n) ? window.PROC[m.n] : null;
    let procHtml = '';
    if(p && p.o) procHtml += '<div class="proc o"><div class="proc-h">(O) OPERATIONS PROCEDURE</div><div class="txt">'+hl(fmtProc(p.o), toks)+'</div></div>';
    if(p && p.m) procHtml += '<div class="proc m"><div class="proc-h">(M) MAINTENANCE PROCEDURE</div><div class="txt">'+hl(fmtProc(p.m), toks)+'</div></div>';
    const fl = (window.FLAGS && m.n) ? window.FLAGS[m.n] : null;
    let flagsHtml = '';
    if(fl && (fl.da || fl.mcc)){
      flagsHtml = '<div class="flags">'
        + (fl.da ? '<span class="flag da">DISPATCH APPROVAL REQ’D</span>' : '')
        + (fl.mcc ? '<span class="flag mcc">CONTACT MCC</span>' : '')
        + '</div>';
    }
    html += '<div class="item" id="'+idOf(m.n)+'"><div class="top">'
      + (m.n ? '<span class="num">'+hl(m.n, toks)+'</span>' : '')
      + '<span class="ttl">'+hl(m.t, toks)+'</span>'
      + (f.badges ? '<span class="badges">'+f.badges+'</span>' : '')
      + '</div>'+flagsHtml+remHtml+procHtml+'</div>';
  });
  listEl.innerHTML = html;
}

// contents / ATA chapter index (front-of-PDF style) — click a chapter to see all its MEL numbers
const tocEl = document.getElementById('toc');
(function buildTOC(){
  const seen=[], groups={};
  MEL.forEach(m=>{ const c=m._c||''; if(!(c in groups)){ groups[c]=[]; seen.push(c); } groups[c].push(m); });
  let h='<div class="toc-inner"><div class="toc-h">CONTENTS &mdash; BY ATA CHAPTER &middot; tap a chapter to list its MEL numbers</div><div class="toc-list">';
  seen.forEach(c=>{
    const name = ATA[c] || (c ? 'ATA '+c : 'Other');
    h+='<div class="toc-chap" data-chap="'+(c||'x')+'">'
      + '<div class="toc-chaphead"><span class="tn">'+(c||'&bull;')+'</span><span class="tt">'+esc(name)+'</span><span class="tc">'+groups[c].length+' items</span><span class="tar">&#9656;</span></div>'
      + '<div class="toc-nums">';
    groups[c].forEach(m=>{
      h+='<a class="toc-num" data-id="'+idOf(m.n)+'"><span class="nn">'+esc(m.n||'?')+'</span><span class="nt">'+esc(m.t)+'</span></a>';
    });
    h+='</div></div>';
  });
  h+='</div></div>';
  tocEl.innerHTML=h;
})();

// drill-down interactions: expand a chapter, or jump to a specific MEL number
tocEl.addEventListener('click', e=>{
  const num = e.target.closest('.toc-num');
  if(num){
    e.preventDefault();
    const el = document.getElementById(num.getAttribute('data-id'));
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'start'});
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
    return;
  }
  const head = e.target.closest('.toc-chaphead');
  if(head){ head.parentElement.classList.toggle('open'); }
});

qEl.addEventListener('input', render);
clrEl.addEventListener('click', ()=>{ qEl.value=''; render(); qEl.focus(); });
render();

/* theme toggle */
(function(){
  var btn=document.getElementById('themeToggle');
  function paint(){ btn.textContent = document.body.classList.contains('dark') ? 'Light' : 'Dark'; }
  paint();
  btn.addEventListener('click', function(){
    var dark=document.body.classList.toggle('dark');
    try{ localStorage.setItem('meltheme', dark?'dark':'light'); }catch(e){}
    paint();
  });
})();

/* floating button: back to search bar + contents */
(function(){
  var b=document.getElementById('toTop'); if(!b) return;
  function upd(){ b.classList.toggle('show', window.scrollY>350); }
  window.addEventListener('scroll', upd, {passive:true}); upd();
  b.addEventListener('click', function(){
    if(qEl.value){ qEl.value=''; render(); }
    window.scrollTo({top:0, behavior:'smooth'});
  });
})();
</script>
