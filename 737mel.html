<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B737 MEL — Minimum Equipment List</title>
<style>
  :root{
    --bg:#eef1f5; --card:#ffffff; --ink:#1a2430; --dim:#5b6675; --line:#e3e8ef;
    --accent:#1a5fd1; --num:#0b3d91; --head:#0b3d91;
    --chip-o:#1f8a3a; --chip-o-bg:#e7f6ec; --chip-m:#1a5fd1; --chip-m-bg:#e7effb;
    --mark:#fff2a8; --mark-ink:#1a2430; --shadow:rgba(15,42,90,.10); --barbg:#ffffff;
  }
  body.dark{
    --bg:#0f2a5a; --card:#163a78; --ink:#eaf1ff; --dim:#a9bde0; --line:#2c4c86;
    --accent:#7fb8ff; --num:#bcd6ff; --head:#a9cdff;
    --chip-o:#8fe0a5; --chip-o-bg:#1c4a2e; --chip-m:#9cc4ff; --chip-m-bg:#123a70;
    --mark:rgba(255,210,90,.30); --mark-ink:#fff; --shadow:rgba(0,0,0,.4); --barbg:#12305f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    transition:background .25s ease,color .25s ease;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:16px 16px 12px;
  }
  .hwrap{ max-width:900px; margin:0 auto; }
  .titlerow{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  h1{ margin:0; font-size:1.15rem; letter-spacing:.5px; color:var(--head); font-weight:700; }
  h1 span{ color:var(--dim); font-weight:400; font-size:.85rem; letter-spacing:0; }
  .themebtn{
    border:1px solid var(--line); background:var(--card); color:var(--accent);
    border-radius:999px; padding:6px 12px; font-size:.8rem; cursor:pointer; font-family:inherit;
  }
  /* Google-style search pill */
  .searchbar{
    display:flex; align-items:center; gap:10px;
    background:var(--barbg); border:1px solid var(--line);
    border-radius:26px; padding:0 16px;
    box-shadow:0 2px 10px var(--shadow);
    transition:box-shadow .15s, border-color .15s;
  }
  .searchbar:focus-within{ box-shadow:0 4px 18px var(--shadow); border-color:var(--accent); }
  .searchbar svg{ flex-shrink:0; width:20px; height:20px; fill:var(--dim); }
  #q{
    flex:1; border:0; outline:0; background:transparent; color:var(--ink);
    font-family:inherit; font-size:1.05rem; padding:14px 0; min-width:0;
  }
  #q::placeholder{ color:var(--dim); }
  .clr{ border:0; background:transparent; color:var(--dim); font-size:1.4rem; cursor:pointer; padding:4px 6px; line-height:1; }
  .meta{ max-width:900px; margin:8px auto 0; color:var(--dim); font-size:.82rem; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .legend{ display:inline-flex; gap:10px; }
  .badge{ display:inline-block; font-weight:700; font-size:.7rem; padding:1px 6px; border-radius:5px; letter-spacing:.5px; }
  .badge.o{ color:var(--chip-o); background:var(--chip-o-bg); }
  .badge.m{ color:var(--chip-m); background:var(--chip-m-bg); }

  main{ max-width:900px; margin:0 auto; padding:14px 16px 80px; }
  /* contents / ATA chapter index (front of the MEL) */
  .toc{ max-width:900px; margin:14px auto 0; padding:0 16px; }
  .toc-inner{ background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 3px var(--shadow); padding:14px 16px; }
  .toc-h{ color:var(--head); font-weight:700; font-size:.85rem; letter-spacing:1.5px; margin:0 0 10px; }
  .toc-list{ display:flex; flex-direction:column; }
  .toc-chap{ border-top:1px solid var(--line); }
  .toc-chap:first-child{ border-top:0; }
  .toc-chaphead{ display:flex; align-items:baseline; gap:10px; cursor:pointer; user-select:none;
    padding:9px 6px; border-radius:6px; }
  .toc-chaphead:hover{ background:var(--chip-m-bg); }
  .toc-chaphead .tn{ font-family:"Courier New",monospace; font-weight:700; color:var(--num); min-width:24px; }
  .toc-chaphead .tt{ flex:1; font-weight:600; color:var(--ink); }
  .toc-chaphead .tc{ color:var(--dim); font-size:.78rem; }
  .toc-chaphead .tar{ color:var(--dim); transition:transform .15s; }
  .toc-chap.open .toc-chaphead .tar{ transform:rotate(90deg); }
  .toc-nums{ display:none; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1px 16px; padding:4px 6px 12px 34px; }
  .toc-chap.open .toc-nums{ display:grid; }
  .toc-num{ display:flex; align-items:baseline; gap:10px; padding:5px 8px; border-radius:6px;
    text-decoration:none; cursor:pointer; }
  .toc-num:hover{ background:var(--chip-m-bg); }
  .toc-num .nn{ font-family:"Courier New",monospace; font-weight:700; color:var(--num); min-width:96px; white-space:nowrap; }
  .toc-num .nt{ color:var(--ink); font-size:.9rem; }
  @keyframes melflash{ 0%,100%{ box-shadow:0 1px 3px var(--shadow); } 25%,75%{ box-shadow:0 0 0 3px var(--accent); } }
  .item.flash{ animation:melflash 1.1s ease-in-out 2; }
  .chapter{ margin:26px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--head);
    color:var(--head); font-weight:700; font-size:1.05rem; letter-spacing:1px;
    scroll-margin-top:150px; }
  .subhd{ margin:16px 0 8px; padding:7px 12px; border-radius:8px; background:var(--chip-m-bg);
    border-left:4px solid var(--accent); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .subhd .sn{ font-family:"Courier New",monospace; font-weight:700; color:var(--num); }
  .subhd .st{ font-weight:700; color:var(--head); letter-spacing:.3px; }
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin:0 0 8px 18px; box-shadow:0 1px 3px var(--shadow);
    scroll-margin-top:150px;
  }
  .item .top{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .num{ font-family:"Courier New",monospace; font-weight:700; color:var(--num); font-size:1rem; white-space:nowrap; }
  .ttl{ font-weight:700; color:var(--ink); }
  .badges{ display:inline-flex; gap:6px; }
  .flags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .flag{ font-weight:700; font-size:.68rem; letter-spacing:.5px; padding:3px 9px; border-radius:5px; white-space:nowrap; }
  .flag.da{ color:#9a6a00; background:#fff2d0; border:1px solid #f0d79a; }
  .flag.mcc{ color:#b42318; background:#fde5e5; border:1px solid #f3bcbc; }
  body.dark .flag.da{ color:#ffd79a; background:rgba(255,176,32,.16); border-color:rgba(255,176,32,.4); }
  body.dark .flag.mcc{ color:#ff9b9b; background:rgba(255,70,70,.16); border-color:rgba(255,70,70,.4); }
  .rem{ margin:8px 0 0; color:var(--dim); white-space:pre-line; font-size:.96rem; }
  .proc{ margin-top:10px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; }
  .proc-h{ font-weight:700; font-size:.72rem; letter-spacing:1px; margin-bottom:4px; }
  .proc .txt{ color:var(--ink); white-space:pre-line; font-size:.92rem; }
  .proc.o{ background:var(--chip-o-bg); } .proc.o .proc-h{ color:var(--chip-o); }
  .proc.m{ background:var(--chip-m-bg); } .proc.m .proc-h{ color:var(--chip-m); }
  mark{ background:var(--mark); color:var(--mark-ink); border-radius:3px; padding:0 1px; }
  .none{ text-align:center; color:var(--dim); padding:50px 10px; font-size:1.05rem; }
  .totop{ position:fixed; right:18px; bottom:18px; z-index:40; display:none;
    align-items:center; gap:8px; padding:12px 18px; border:0; border-radius:999px; cursor:pointer;
    background:var(--accent); color:#fff; font:inherit; font-weight:700; font-size:.85rem; letter-spacing:.5px;
    box-shadow:0 4px 16px var(--shadow); }
  .totop.show{ display:inline-flex; }
  .totop:hover{ filter:brightness(1.06); }
  body.dark .totop{ color:#0f2a5a; }
  @media (max-width:520px){ .totop{ right:12px; bottom:12px; padding:11px 15px; } }
  footer{ max-width:900px; margin:0 auto; padding:10px 16px 40px; color:var(--dim); font-size:.78rem; text-align:center; line-height:1.7; }
  @media (max-width:520px){
    #q{ font-size:1rem; }
    .num{ font-size:.92rem; }
  }
</style>
</head>

<script>window.PROC = {"21-00-01A":{"o":"Left Air Conditioning Pack Inoperative (B737-800 ONLY).\nNote: If operational and not restricted from use by another MEL, APU pneumatics should be used to supply the\nright pack to increase air flow when the flaps are extended for takeoff and landing.\n1. Limit altitude to FL 250.\n2. Position the left PACK switch to OFF.\n3. Perform normal engine start.\n4. If APU is unavailable and after both engines running, ISOLATION VALVE switch to CLOSED. End of procedure.\n5. If APU is available, use to supply bleed air to the right pack for increased airflow during ground operations, takeoff,\nand below 10,000’ AFE during approach and landing. The following procedure will apply:\nNote: Because this is not a performance limited takeoff, bleeds off numbers are not required. Use the TDU or\nother power setting as shown on the WDR.\nCAUTION\nAFTER DE-ICING, DUE TO DE-ICING FLUID RUNOFF, USE OF THE APU BLEED DURING TAKEOFF\nMAY CAUSE SMOKE AND/OR FUMES IN THE AIRCRAFT. WAIT APPROXIMATELY 1 MINUTE AFTER\nDEICING IS COMPLETE TO RESTORE BLEED AIR FOR PACK OPERATION.\nNote: Configure as follows after engine start unless wing anti-ice is needed for taxi.\nNote: If wing anti–ice is required for taxi, configure as follows just PRIOR to takeoff.\nA. After both engines are running and prior to takeoff:\ni. R PACK switch to AUTO.\nii. ISOLATION VALVE switch to OPEN.\niii. L PACK switch remains OFF.\niv. Engine No. 1 BLEED air switch to OFF.\nv. APU BLEED air switch to ON.\nvi. Engine No. 2 BLEED air switch to OFF.\nvii. WING ANTI-ICE switch to OFF.\nB. AFTER takeoff and prior to17,000’ MSL:\nNote: The WING ANTI-ICE switch must remain OFF until the engine BLEED air switches are repositioned to\nON.\ni. APU BLEED air switch to OFF.\nii. Engine No. 2 BLEED air switch to ON.\niii. R PACK switch remains AUTO.\niv. ISOLATION VALVE switch to CLOSE.\nv. L PACK switch remains OFF.\nvi. Engine No. 1 BLEED air switch to ON.\nvii. If no longer needed, shutdown APU.\nNote: A CHECK AIR COND PANEL message may be generated 2 minutes after takeoff.\nC. When below 17,000’ MSL and prior to landing, unless wing ANTI ICE is required:\ni. Start APU and wait two minutes, then:\nii. WING ANTI-ICE switch to OFF\niii. Engine No. 1 BLEED to OFF\niv. APU BLEED air switch to ON.\nv. Engine No. 2 BLEED to OFF\nvi. ISOLATION VALVE switch to OPEN\nvii. Right Pack switch remains in AUTO\nviii. Left Pack switch remains OFF\nCAUTION ENSURE THAT THE CABIN ALTITUDE IS STABLE OR DESCENDING. IF UNABLE TO MAINTAIN CABIN\nPRESSURIZATION, REVERT BACK TO ENGINE BLEED AIR FOR PACK OPERATION."},"21-00-01C":{"m":"Configure airplane for unpressurized flight (AMM 21-00-00/901):\n1. Manually position the outflow valve in the full open position.\nA. Position the Pressurization Mode selector to MAN.\nB. Hold the VALVE toggle switch in the OPEN position until valve position indicator indicates full open.\n2. Deactivate (locked closed) the flow control and shutoff valve for the associated pack:\nA. For the left flow control and shutoff valve, disconnect and stow the D488 electrical connector.\nB. For the right flow control and shutoff valve, disconnect and stow the D492 electrical connector.\nC. Do these steps to lock the flow control and shutoff valve in the closed position:\ni. Pull out the manual control shaft.\nii. Push in the manual control shaft.\n3. Pull and secure the P6-4 Panel circuit breaker A/C OVERBOARD EXH VALVE RECONFIG CONT.\n4. Position one of the PACK switches in HIGH and placard."},"21-00-01D":{"m":"Secure the forward cargo heat duct closed (AMM 21-00-00/901):\n1. Access the shutoff valve:\nA. Remove the forward cargo compartment forward bulkhead liner to gain access to the forward cargo heat duct\nshutoff valve.\nB. Locate the manual lever on top of the forward cargo heat duct shutoff valve and move the lever from the fully\nopen (O) position to the fully closed (C) position.\nC. Reinstall the forward cargo compartment forward bulkhead liner.\n2. Deactivate (lock closed) the flow control and shutoff valve for the associated pack:\nA. For the left flow control and shutoff valve, disconnect and stow the D488 or D15830 electrical connector.\nB. For the right flow control and shutoff valve, disconnect and stow the D492 or D15834 electrical connector.\nNote: Connectors D15830 and D15834 are applicable to Ships 3853 thru 3930.\nA. Do these steps to lock the flow control and shutoff valve in the closed position:\ni. Pull out the manual control shaft.\nii. Push in the manual control shaft.\n3. Use an operative pack or ground cart to provide cooling when the airplane is electrically powered on the ground\nand airport temperatures are at or above 73 degrees F (23 degrees C).\nLink to Learning Video (for ships 3801 thru 3852 and 3931 thru 3963)\nFigure 21-1: Flow Control and Shutoff Valve (Ships 3801 thru 3852 and 3931 thru 3963)\nFigure 21-2: Flow Control and Shutofff Valve (Ships 3853 thru 3930)"},"21-00-01E":{"m":"Secure the forward cargo heat duct closed (AMM 21-00-00/901):\n1. Access the shutoff valve:\nA. Remove the forward cargo compartment forward bulkhead liner to gain access to the forward cargo heat duct\nshutoff valve.\nB. Locate the manual lever on top of the forward cargo heat duct shutoff valve and move the lever from the fully\nopen (O) position to the fully closed (C) position.\nC. Reinstall the forward cargo compartment forward bulkhead liner.\n2. Deactivate (lock closed) the flow control and shutoff valve for the associated pack:\nA. For the left flow control and shutoff valve, disconnect and stow the D488 or D15830 electrical connector.\nB. For the right flow control and shutoff valve, disconnect and stow the D492 or D15834 electrical connector.\nNote: Connectors D15830 and D15834 are applicable to Ships 3853 thru 3930.\nA. Do these steps to lock the flow control and shutoff valve in the closed position:\ni. Pull out the manual control shaft.\nii. Push in the manual control shaft.\n3. Use an operative pack or ground cart to provide cooling when the airplane is electrically powered on the ground\nand airport temperatures are at or above 73 degrees F (23 degrees C).\nLink to Learning Video (for ships 3801 thru 3852 and 3931 thru 3963)\nFigure 21-1: Flow Control and Shutoff Valve (Ships 3801 thru 3852 and 3931 thru 3963)\nFigure 21-2: Flow Control and Shutofff Valve (Ships 3853 thru 3930)"},"21-00-01F":{"m":"Configure airplane for unpressurized flight (AMM 21-00-00/901):\n1. Manually position the outflow valve in the full open position.\nA. Position the Pressurization Mode selector to MAN.\nB. Hold the VALVE toggle switch in the OPEN position until valve position indicator indicates full open.\n2. Deactivate (lock closed) the flow control and shutoff valve for the associated pack:\nA. For the left flow control and shutoff valve, disconnect and stow the D488 or D15830 electrical connector.\nB. For the right flow control and shutoff valve, disconnect and stow the D492 or D15834 electrical connector.\nNote: Connectors D15830 and D15834 are applicable to Ships 3853 thru 3930.\nC. Do these steps to lock the flow control and shutoff valve in the closed position:\ni. Pull out the manual control shaft.\nii. Push in the manual control shaft.\n3. Secure the forward cargo heat duct closed (AMM 21-00-00/901):\nA. Locate the manual lever on top of the forward cargo heat duct shutoff valve and move the lever from the fully\nopen (O) position to the fully closed (C) position.\n4. Use an operative pack or ground cart to provide cooling when the airplane is electrically powered on the ground\nand airport temperatures are at or above 73 degrees F (23 degrees C).\nFigure 21-3: Pack Flow Control and Shutoff Valve\nNote: When deactivating the valve, push in the manual control shaft. To reactivate the valve, pull out the manual\ncontrol shaft"},"21-00-02A":{"o":"With Pack High Flow Mode or APU High Flow Mode inoperative, cabin ventilation rates will be reduced.\nIf one pack is not used refer to MEL 21-00-01A,B,D,or E for (O) procedures.","m":"1. Deactivate associated Pack Air Flow Shutoff Valve per AMM Task 21-00-00-040-805.\n2. Defer the associated air conditioning pack per MEL 21-00-01A, 21-00-01B, 21-00-01D or 21-00-01E as applicable."},"21-00-02B":{"o":"If both packs are not used refer to MEL 21-00-01C or F for (O) procedures.","m":"1. Deactivate associated Pack Air Flow Shut off Valve per AMM Task 21-00-00-040-805.\n2. Defer both air conditioning packs per MEL 21-00-01C or 21-00-01F as applicable.\nFigure 21-4: Pack Flow Control and Shutoff Valve (Ships 3853 thru 3930)\nFigure 21-5: Pack Flow Control and Shutoff Valve (All except Ships 3853 thru 3930)\nNote: When deactivating the valve, push in the manual control shaft. To reactivate the valve, pull out the manual\ncontrol shaft.\nFigure 21-6: Electrical Connectors"},"21-00-02E":{"o":"1. Use procedures to verify the aft lower cargo compartment remains empty or contains only empty cargo handling\nequipment, ballast (ballast may be loaded in ULDs), and/or Fly Away Kits. (see MEL Instructions)\nNote: Failure of the Electronic Flow Control Valve torque motor or primary Pack Flow Temperature Controller\nfailure will result in backup pneumatic flow control. PFTC fault messages 21-51036, 21-51069, 21-51070,\n21-51250, 21-51251, 21-51252, or 21-51503 may be present.\nNote: MEL dispatch options 21-00-01 maybe used as an alternative means of dispatching with one inoperative\nair conditioning pack that has failed electronic flow control and the other air conditioning pack operating\nnormally with electronic flow control."},"21-00-02F":{"m":"Note: With Pack Flow Sensor failed, the associated PACK light will illuminate during Master Caution recall and will\nextinguish when Master Caution is reset.\n1. Verify normal operation of Pack Inlet Pressure Sensor for associated air conditioning pack as follows:\nA. Check for Existing Faults on the Pack Flow Temperature Controller BITE display.\nB. Ensure the following Pack Inlet Pressure Sensor faults are not listed under Existing Faults: 21-51061, 21-51230,\n21-51231, 21-51232, 21-51233."},"21-00-02H":{"m":"Note: With Pack Inlet Pressure Sensor failed, the associated PACK light will illuminate during Master Caution recall\nand will extinguish when Master Caution is reset.\n1. Verify normal operation of Pack Flow Sensor for associated air conditioning pack as follows:\nA. Check for Existing Faults on the Pack Flow Temperature Controller BITE display.\nB. Ensure the following Pack Flow Sensor faults are not listed under Existing Faults: 21-51066, 21-51067,\n21-51068, 21-51239, 21-51240, 21-51246, 21-51247, 21-51248, 21-51249."},"21-00-10B":{"o":"1. Limit altitude to 10,000 feet for passenger flights.\n2. Non-passenger flights above 10,000 feet MSL require flight crew to be on oxygen.\n3. Except for ditching, keep the outflow valve in the 25% open position.\n4. Only one pack may be used in flight.\n5. For galley 4B food cart chiller installed, use only one chiller inflight.\n6. To avoid passenger discomfort, limit climb and descent rates to 500 FPM.\n7. For A/C 3772, and 3773 only, verify the lower forward cargo compartment remains empty or contains only ballast\nempty cargo handling equipment (ballast may be loaded in ULDs) or fly away kits.","m":"1. Position the outflow valve to the 25% open position as follows:\nA. Place the Pressurization Mode Selector in the MAN position.\nB. Hold the VALVE toggle switch in the OPEN or CLOSED position until valve position indicator indicates 25% open.\n2. Pull and secure the Air Conditioning Overboard Exhaust Valve Reconfiguration Control (A/C OVBD EXH RECONFIG\nCONT) circuit breaker on the P6-4 Panel.\n3. With Passenger Cabin Telecommunications System installed (Airphones), pull and secure the ENTERTAINMENT\nPASS TEL CTU circuit breaker located on the P6-1 Panel."},"21-00-10C":{"o":"1. Limit altitude to 10,000 feet for passenger flights.\n2. Non-passenger flights above 10,000 feet MSL require flight crew to be on oxygen.\n3. Except for ditching, keep the outflow valve in the 25% open position.\n4. Only one pack may be used in flight.\n5. For galley 4B food cart chiller installed, use only one chiller inflight.\n6. To avoid passenger discomfort, limit climb and descent rates to 500 FPM.\n7. For A/C 3772, and 3773 only, verify the lower forward cargo compartment remains empty or contains only ballast\nempty cargo handling equipment (ballast may be loaded in ULDs) or fly away kits.\nCABIN RATE OF CLIMB INDICATOR\nEFFECTIVITY -800\nFLIGHT PLANNING\nREQUIREMENTS\nNone\nNOTES None\nAWABS Performance weight corrections have been applied.\nVerify AWABS V1 is not less than minimum Vmcg. Takeoff is permitted with V1 set equal to or\ngreater than Vmcg. See ODM – Abnormal Section for Minimum Control Speed – Ground (Vmcg).\nTAKEOFF\nPERFORMANCE\nWORKSHEET\nTAKEOFF\nNone\nLANDING\nNone\nOTHER CORRECTIONS\nObtain V speeds from the ODM – Takeoff section. If the resulting V1 s less than minimum Vmcg,\ntakeoff is permitted with V1 set equal to Vmcg. See ODM – Abnormal Section for Minimum\nControl Speed – Ground (Vmcg).","m":"1. Position the outflow valve to the 25% open position as follows:\nA. Place the Pressurization Mode Selector in the MAN position.\nB. Hold the VALVE toggle switch in the OPEN or CLOSED position until valve position indicator indicates 25% open.\n2. Pull and secure the Air Conditioning Overboard Exhaust Valve Reconfiguration Control (A/C OVBD EXH RECONFIG\nCONT) circuit breaker on the P6-4 Panel.\n3. With Passenger Cabin Telecommunications System installed (Airphones), pull and secure the ENTERTAINMENT\nPASS TEL CTU circuit breaker located on the P6-1 Panel."},"21-00-10D":{"o":"1. Limit altitude to 10,000 feet for passenger flights.\n2. Non-passenger flights above 10,000 feet require flight crew to be on oxygen.\n3. Except for ditching, keep the outflow valve in the 25% open position.\n4. Use only one pack in flight.\n5. Position R RECIRC FAN switch to OFF.\n6. Position the PACK switch to HIGH after completing the AFTER TAKEOFF Normal Checklist,\n7. For galley 4B food cart chiller installed, use only one chiller in flight.\n8. Limit climb and descent rates to 500 FPM to avoid passenger discomfort.","m":"Configure the airplane for unpressurized flight (AMM 21-00-00/901).\n1. Manually position the outflow valve in the 25% open position:\nA. Position the Pressurization Mode selector to MAN.\nB. Hold the VALVE toggle switch in the OPEN position until valve position indicates 25% open.\n2. Secure the forward cargo heat duct closed:\nA. With shutoff valve 4063-20605-01 installed:\ni. Locate the manual lever on top of the forward cargo heat duct shutoff valve and move the lever from the\nfully open (O) position to the fully closed (C) position.\nB. With shutoff valve 4063-20605-01 NOT installed:\ni. Remove the forward cargo heat duct check valve.\nii. Install cap BOE2221-0011 in the heat duct.\n3. Use an operative pack or ground cart to provide cooling when the airplane is electrically powered on the ground\nand airport temperatures are at or above 73 degrees F (23 degrees C).\nRefer to MEL 21-00-10D for (M) procedures."},"21-00-11B":{"o":"1. Whenever the intermittent warning horn sounds on the ground, confirm the airplane is properly configured for\ntakeoff.\nPRIOR TO EACH DEPARTURE:\n1. Cabin altitude warning indications and procedures must be included in the takeoff briefing conducted by the flight\ncrew before engine start. This briefing must include the following:\nA. Whenever the intermittent warning horn sounds in flight at an airplane flight altitude above 10,000 MSL:\ni. Immediately don oxygen masks and set regulators to 100%.\nii. Establish crew communications.\niii. Do the Cabin Altitude Warning or Rapid Depressurization non-normal checklist.\nNote: Both pilots must verify on the overhead Cabin Altitude panel that the cabin altitude is stabilized\nbelow 10,000 feet before removing oxygen masks."},"21-00-12A":{"o":"Use the following chart to find cabin altitude."},"21-00-12B":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10B for (O) procedures.","m":"Configure the airplane for unpressurized flight using MEL 21-00-10B (M) procedures."},"21-00-12C":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10C for (O) procedures.","m":"Configure the airplane for unpressurized flight using MEL 21-00-10C (M) procedures."},"21-00-12D":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10D for (O) procedures.","m":"Configure the airplane for unpressurized flight using MEL 21-00-10D (M) procedures."},"21-00-13A":{"o":"Use the following chart to determine cabin differential pressure."},"21-00-13B":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10B for (O) procedures.","m":"Configure the airplane for unpressurized flight using MEL 21-00-10B (M) procedures."},"21-00-13C":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10C for (O) procedures.","m":"Configure the airplane for unpressurized flight using MEL 21-00-10C (M) procedures."},"21-00-13D":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10D for (O) procedures.","m":"Configure the airplane for unpressurized flight using MEL 21-00-10D (M) procedures."},"21-00-14A":{"o":"1. Normal operation of manual mode may be confirmed as follows:\nA. Position the Pressurization Mode Selector to MAN.\nB. Use the VALVE toggle switch to observe that the outflow valve position indicator moves to full open, to full\nclosed and then back to full open.\nNote: Place L and R PACK switches on the P5 forward overhead panel to OFF position or at least one\nexterior door or window is open to prevent uncontrolled pressurization of the cabin.\n2. Place Pressurization Mode Selector to ALTN prior to dispatch.\nNote: Subsequent illumination of the AUTO FAIL light during flight will require placing the Pressurization Mode\nSelector to MAN for manual mode operation.","m":"Pull and secure the associated P6-4 panel circuit breaker PRESSURIZATION CONTROL-AUTO 1 or AUTO 2 to deactivate\nthe inoperative channel."},"21-00-14B":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10B for (O) procedures.","m":"1. Configure airplane for unpressurized flight (AMM 21-00-00/901):\nA. Manually position the outflow valve in the 25% open position:\ni. Position the Pressurization Mode selector to MAN.\nii. Hold the VALVE toggle switch in the OPEN position until valve position indicator indicates 25% open.\niii. Manually position the outflow valve in the 25% open position:\niv. Pull and secure these P6-4 panel circuit breakers:\na. A/C OVERBOARD EXH VALVE RECONFIG CONT.\nb. PRESSURIZATION CONTROL AUTO 1\nc. PRESSURIZATION CONTROL AUTO 2\n2. If the outflow valve cannot be positioned to the 25% open position:\nA. Pull and secure these P6-4 panel circuit breakers:\ni. PRESSURIZATION CONTROL MANUAL\nii. PRESSURIZATION CONTROL AUTO 1\niii. PRESSURIZATION CONTROL AUTO 2\niv. PRESSURIZATION CONTROL IND\nv. PRESSURIZATION CONTROL LCD LTG\nB. Remove the outflow valve (AMM 21-31-03/401). Stow electrical connectors.\nC. Pull and secure this P6-4 panel circuit breaker:\ni. A/C OVERBOARD EXH VALVE RECONFIG CONT.\nNote: If the outflow valve cannot be positioned to the 25% open position using the above procedure, Maintenance\nis Required and Flight Crew May NOT Placard."},"21-00-14E":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10B for (O) procedures.","m":"Configure airplane for unpressurized flight (AMM 21-00-00/901)\n1. Position the outflow valve in the 25% open position:\nA. Set parking brake.\nB. Start both engines (AMM 71-00-00/201).\nC. Run the engines for two minutes to allow them to stabilize.\nD. Advance thrust levers as necessary to make sure that N1 is greater than 60% and N2 is greater than 89%.\nE. Monitor the outflow valve position indicator as it goes to the closed position.\nF. When the outflow valve is in the 25% position, pull and secure these P6-4 circuit breakers:\ni. PRESSURIZATION CONTROL AUTO 1\nii. PRESSURIZATION CONTROL AUTO 2.\nG. Retard thrust levers and shut down both engines.\n2. If the outflow valve can not be positioned to the 25% open position, remove the outflow valve (AMM\n21-31-03/401). Stow electrical connectors.\nA. Pull and secure these P6-4 Panel circuit breakers:\ni. PRESSURIZATION CONTROL MANUAL\nii. PRESSURIZATION CONTROL AUTO 1\niii. PRESSURIZATION CONTROL AUTO 2\niv. PRESSURIZATION CONTROL IND\nv. PRESSURIZATION CONTROL LCD LTG\nvi. A/C OVERBOARD EXH VALVE RECONFIG CONT."},"21-00-14C":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10C for (O) procedures.","m":"1. Configure airplane for unpressurized flight (AMM 21-00-00/901):\nA. Manually position the outflow valve in the 25% open position:\ni. Position the Pressurization Mode selector to MAN.\nii. Hold the VALVE toggle switch in the OPEN position until valve position indicator indicates 25% open.\niii. Manually position the outflow valve in the 25% open position:\niv. Pull and secure these P6-4 panel circuit breakers:\na. A/C OVERBOARD EXH VALVE RECONFIG CONT.\nb. PRESSURIZATION CONTROL AUTO 1\nc. PRESSURIZATION CONTROL AUTO 2\n2. If the outflow valve cannot be positioned to the 25% open position:\nA. Pull and secure these P6-4 panel circuit breakers:\ni. PRESSURIZATION CONTROL MANUAL\nii. PRESSURIZATION CONTROL AUTO 1\niii. PRESSURIZATION CONTROL AUTO 2\niv. PRESSURIZATION CONTROL IND\nv. PRESSURIZATION CONTROL LCD LTG\nB. Remove the outflow valve (AMM 21-31-03/401). Stow electrical connectors.\nC. Pull and secure this P6-4 panel circuit breaker:\ni. A/C OVERBOARD EXH VALVE RECONFIG CONT.\nNote: If the outflow valve cannot be positioned to the 25% open position using the above procedure, Maintenance\nis Required and Flight Crew May NOT Placard."},"21-00-14F":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10C for (O) procedures.","m":"Configure airplane for unpressurized flight (AMM 21-00-00/901)\n1. Position the outflow valve in the 25% open position:\nA. Set parking brake.\nB. Start both engines (AMM 71-00-00/201).\nC. Run the engines for two minutes to allow them to stabilize.\nD. Advance thrust levers as necessary to make sure that N1 is greater than 60% and N2 is greater than 89%.\nE. Monitor the outflow valve position indicator as it goes to the closed position.\nF. When the outflow valve is in the 25% position, pull and secure these P6-4 circuit breakers:\ni. PRESSURIZATION CONTROL AUTO 1\nii. PRESSURIZATION CONTROL AUTO 2.\nG. Retard thrust levers and shut down both engines.\n2. If the outflow valve can not be positioned to the 25% open position, remove the outflow valve (AMM\n21-31-03/401). Stow electrical connectors.\nA. Pull and secure these P6-4 Panel circuit breakers:\ni. PRESSURIZATION CONTROL MANUAL\nii. PRESSURIZATION CONTROL AUTO 1\niii. PRESSURIZATION CONTROL AUTO 2\niv. PRESSURIZATION CONTROL IND\nv. PRESSURIZATION CONTROL LCD LTG\nvi. A/C OVERBOARD EXH VALVE RECONFIG CONT."},"21-00-14D":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10D for (O) procedures.\nNote: Temperature sensitive cargo and live animals should not be carried in the forward cargo compartment.","m":"1. Configure airplane for unpressurized flight:\nA. Manually position the outflow valve in the 25% open position:\ni. Position the Pressurization Mode selector to MAN.\nii. Hold the VALVE toggle switch in the OPEN position until valve position indicator indicates 25% open.\niii. Pull and secure these P6-4 panel circuit breakers:\na. A/C OVERBOARD EXH VALVE RECONFIG CONT.\nb. PRESSURIZATION CONTROL AUTO 1\nc. PRESSURIZATION CONTROL AUTO 2\nB. If the outflow valve cannot be positioned to the 25% open position, remove the outflow valve (AMM\n21-31-03/401). Stow electrical connectors.\ni. Pull and secure these P6-4 Panel circuit breakers:\na. PRESSURIZATION CONTROL MANUAL\nb. PRESSURIZATION CONTROL AUTO 1\nc. PRESSURIZATION CONTROL AUTO 2\nd. PRESSURIZATION CONTROL IND\ne. PRESSURIZATION CONTROL LCD LTG\nii. Remove the outflow valve (AMM 21-31-03/401). Stow electrical connectors.\niii. Pull and secure this P6-4 panel circuit breaker:\na. A/C OVERBOARD EXH VALVE RECONFIG CONT.\n2. Secure the forward cargo heat duct closed:\nA. With shutoff valve 4063-20605-01 installed:\ni. Locate the manual lever on top of the forward cargo heat duct shutoff valve and move the lever from the\nfully open (O) position to the fully closed (C) position.\nB. With shutoff valve 4063-20605-01 NOT installed:\ni. Remove the forward cargo heat duct check valve.\nii. Install cap BOE2221-0011 in the heat duct.\n3. Use an operative pack or ground cart to provide cooling when the airplane is electrically powered on the ground\nand airport temperatures are at or above 73 degrees F (23 degrees C)."},"21-00-14G":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10D for (O) procedures.\nNote: Temperature sensitive cargo and live animals should not be carried in the forward cargo compartment.","m":"1. Configure airplane for unpressurized flight:\nA. Position the outflow valve in the 25% open position:\ni. Set parking brake.\nii. Start both engines (AMM 71-00-00/201).\niii. Run the engines for two minutes to allow them to stabilize.\niv. Advance thrust levers as necessary to make sure that N1 is greater than 60% and N2 is greater than 89%.\nv. Monitor the outflow valve position indicator as it goes to the closed position.\nvi. When the outflow valve is in the 25% position, pull and secure these P6-4 circuit breakers:\na. PRESSURIZATION CONTROL AUTO 1\nb. PRESSURIZATION CONTROL AUTO 2.\nvii. Retard thrust levers and shut down both engines.\nB. If the outflow valve cannot be positioned to the 25% open position, remove the outflow valve (AMM\n21-31-03/401). Stow electrical connectors.\ni. Pull and secure these P6-4 Panel circuit breakers:\na. PRESSURIZATION CONTROL MANUAL\nb. PRESSURIZATION CONTROL AUTO 1\nc. PRESSURIZATION CONTROL AUTO 2\nd. PRESSURIZATION CONTROL IND\ne. PRESSURIZATION CONTROL LCD LTG\nii. Remove the outflow valve (AMM 21-31-03/401). Stow electrical connectors.\niii. Pull and secure this P6-4 panel circuit breaker:\na. A/C OVERBOARD EXH VALVE RECONFIG CONT.\n2. Secure the forward cargo heat duct closed:\nA. With shutoff valve 4063-20605-01 installed:\ni. Locate the manual lever on top of the forward cargo heat duct shutoff valve and move the lever from the\nfully open (O) position to the fully closed (C) position.\nB. With shutoff valve 4063-20605-01 NOT installed:\ni. Remove the forward cargo heat duct check valve.\nii. Install cap BOE2221-0011 in the heat duct.\n3. Use an operative pack or ground cart to provide cooling when the airplane is electrically powered on the ground\nand airport temperatures are at or above 73 degrees F (23 degrees C)."},"21-00-15B":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10B for (O) procedures.","m":"Configure airplane for unpressurized flight:\n1. Position the outflow valve in the 25% open position using one of the two following methods:\nA. For Automatic Mode Actuators inoperative:\ni. Position the Pressurization Mode selector to MAN.\nii. Hold the VALVE toggle switch in the OPEN position until valve position indicator indicates 25% open.\nB. For Manual Mode Actuator inoperative:\ni. Set parking brake.\nii. Start both engines (AMM 71-00-00/201).\niii. Run the engines for two minutes to allow them to stabilize.\niv. Advance thrust levers as necessary to make sure that N1 is greater than 60% and N2 is greater than 89%.\nv. Monitor the outflow valve position indicator as it goes to the closed position.\nvi. When the outflow valve is in the 25% position, pull and secure these P6-4 circuit breakers:\na. PRESSURIZATION CONTROL AUTO 1\nb. PRESSURIZATION CONTROL AUTO 2.\nvii. Retard thrust levers and shut down both engines. If the outflow valve cannot be positioned to the 25%\nopen position, remove the outflow valve (AMM 21-31-03/401). Stow electrical connectors.\n2. If the outflow valve cannot be positioned to the 25% open position, remove the outflow valve (AMM\n21-31-03/401). Stow electrical connectors.\n3. Pull and secure these P-6 Panel circuit breakers:\nA. PRESSURIZATION CONTROL MANUAL\nB. PRESSURIZATION CONTROL AUTO 1\nC. PRESSURIZATION CONTROL AUTO 2\nD. PRESSURIZATION CONTROL IND\nE. PRESSURIZATION CONTROL LCD LTG\nF. A/C OVERBOARD EXH VALVE RECONFIG CONT."},"21-00-15E":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10B for (O) procedures.","m":"Configure airplane for unpressurized flight (AMM 21-00-00/901)\n1. Position the outflow valve in the 25% open position:\nA. Set parking brake.\nB. Start both engines (AMM 71-00-00/201).\nC. Run the engines for two minutes to allow them to stabilize.\nD. Advance thrust levers as necessary to make sure that N1 is greater than 60% and N2 is greater than 89%.\nE. Monitor the outflow valve position indicator as it goes to the closed position.\nF. When the outflow valve is in the 25% position, open and collar these P6-4 panel circuit breakers:\ni. PRESSURIZATION CONTROL AUTO 1\nii. PRESSURIZATION CONTROL AUTO 2\nG. Retard thrust levers and shut down both engines.\nH. Open and collar this P6-4 panel circuit breaker:\ni. A/C OVERBOARD EXH VALVE RECONFIG CONT\n2. If the outflow valve cannot be positioned to the 25% open position:\nA. Open and collar these P6-4 panel circuit breakers:\ni. PRESSURIZATION CONTROL MANUAL\nii. PRESSURIZATION CONTROL AUTO 1\niii. PRESSURIZATION CONTROL AUTO 2\niv. PRESSURIZATION CONTROL IND\nv. PRESSURIZATION CONTROL LCD LTG\nB. Remove the outflow valve (AMM 21-31-03/401). Stow electrical connectors.\nC. Open and collar this P6-4 panel circuit breaker:\ni. A/C OVERBOARD EXH VALVE RECONFIG CONT"},"21-00-15C":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10C for (O) procedures.","m":"Configure airplane for unpressurized flight:\n1. Position the outflow valve in the 25% open position using one of the two following methods:\nA. For Automatic Mode Actuators inoperative:\ni. Position the Pressurization Mode selector to MAN.\nii. Hold the VALVE toggle switch in the OPEN position until valve position indicator indicates 25% open.\nB. For Manual Mode Actuator inoperative:\ni. Set parking brake.\nii. Start both engines (AMM 71-00-00/201).\niii. Run the engines for two minutes to allow them to stabilize.\niv. Advance thrust levers as necessary to make sure that N1 is greater than 60% and N2 is greater than 89%.\nv. Monitor the outflow valve position indicator as it goes to the closed position.\nvi. When the outflow valve is in the 25% position, pull and secure these P6-4 circuit breakers:\na. PRESSURIZATION CONTROL AUTO 1\nb. PRESSURIZATION CONTROL AUTO 2.\nvii. Retard thrust levers and shut down both engines. If the outflow valve cannot be positioned to the 25%\nopen position, remove the outflow valve (AMM 21-31-03/401). Stow electrical connectors.\n2. If the outflow valve cannot be positioned to the 25% open position, remove the outflow valve (AMM\n21-31-03/401). Stow electrical connectors.\n3. Pull and secure these P-6 Panel circuit breakers:\nA. PRESSURIZATION CONTROL MANUAL\nB. PRESSURIZATION CONTROL AUTO 1\nC. PRESSURIZATION CONTROL AUTO 2\nD. PRESSURIZATION CONTROL IND\nE. PRESSURIZATION CONTROL LCD LTG\nF. A/C OVERBOARD EXH VALVE RECONFIG CONT."},"21-00-15F":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10C for (O) procedures.","m":"Configure airplane for unpressurized flight (AMM 21-00-00/901)\n1. Position the outflow valve in the 25% open position:\nA. Set parking brake.\nB. Start both engines (AMM 71-00-00/201).\nC. Run the engines for two minutes to allow them to stabilize.\nD. Advance thrust levers as necessary to make sure that N1 is greater than 60% and N2 is greater than 89%.\nE. Monitor the outflow valve position indicator as it goes to the closed position.\nF. When the outflow valve is in the 25% position, open and collar these P6-4 panel circuit breakers:\ni. PRESSURIZATION CONTROL AUTO 1\nii. PRESSURIZATION CONTROL AUTO 2\nG. Retard thrust levers and shut down both engines.\nH. Open and collar this P6-4 panel circuit breaker:\ni. A/C OVERBOARD EXH VALVE RECONFIG CONT\n2. If the outflow valve cannot be positioned to the 25% open position:\nA. Open and collar these P6-4 panel circuit breakers:\ni. PRESSURIZATION CONTROL MANUAL\nii. PRESSURIZATION CONTROL AUTO 1\niii. PRESSURIZATION CONTROL AUTO 2\niv. PRESSURIZATION CONTROL IND\nv. PRESSURIZATION CONTROL LCD LTG\nB. Remove the outflow valve (AMM 21-31-03/401). Stow electrical connectors.\nC. Open and collar this P6-4 panel circuit breaker:\ni. A/C OVERBOARD EXH VALVE RECONFIG CONT"},"21-00-15D":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10D for (O) procedures.\nNote: Temperature sensitive cargo and live animals should not be carried in the forward cargo compartment.","m":"Configure airplane for unpressurized flight:\n1. Position the outflow valve in the 25% open position using one of the two following methods:\nA. For Automatic Mode Actuators inoperative:\ni. Position the Pressurization Mode selector to MAN.\nii. Hold the VALVE toggle switch in the OPEN position until valve position indicator indicates 25% open.\nB. For Manual Mode Actuator inoperative:\ni. Set parking brake.\nii. Start both engines (AMM 71-00-00/201).\niii. Run the engines for two minutes to allow them to stabilize.\niv. Advance thrust levers as necessary to make sure that N1 is greater than 60% and N2 is greater than 89%.\nv. Monitor the outflow valve position indicator as it goes to the closed position.\nvi. When the outflow valve is in the 25% position, pull and secure these P6-4 circuit breakers:\na. PRESSURIZATION CONTROL AUTO 1\nb. PRESSURIZATION CONTROL AUTO 2.\nvii. Retard thrust levers and shut down both engines.\n2. If the outflow valve cannot be positioned to the 25% open position, remove the outflow valve (AMM\n21-31-03/401). Stow electrical connectors.\n3. Pull and secure these P-6 Panel circuit breakers:\nA. PRESSURIZATION CONTROL MANUAL\nB. PRESSURIZATION CONTROL AUTO 1\nC. PRESSURIZATION CONTROL AUTO 2\nD. PRESSURIZATION CONTROL IND\nE. PRESSURIZATION CONTROL LCD LTG\n4. Secure the forward cargo heat duct closed:\nA. With shutoff valve 4063-20605-01 installed:\ni. Locate the manual lever on top of the forward cargo heat duct shutoff valve and move the lever from the\nfully open (O) position to the fully closed (C) position.\nB. With shutoff valve 4063-20605-01 NOT installed:\ni. Remove the forward cargo heat duct check valve.\nii. Install cap BOE2221-0011 in the heat duct.\n5. Use an operative pack or ground cart to provide cooling when the airplane is electrically powered on the ground\nand airport temperatures are at or above 73 degrees F (23 degrees C)."},"21-00-15G":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10D for (O) procedures.\nNote: Temperature sensitive cargo and live animals should not be carried in the forward cargo compartment.","m":"Configure airplane for unpressurized flight (AMM 21-00-00/901)\n1. Position the outflow valve in the 25% open position:\nA. Set parking brake.\nB. Start both engines (AMM 71-00-00/201).\nC. Run the engines for two minutes to allow them to stabilize.\nD. Advance thrust levers as necessary to make sure that N1 is greater than 60% and N2 is greater than 89%.\nE. Monitor the outflow valve position indicator as it goes to the closed position.\nF. When the outflow valve is in the 25% position, open and collar these P6-4 panel circuit breakers:\ni. PRESSURIZATION CONTROL AUTO 1\nii. PRESSURIZATION CONTROL AUTO 2\nG. Retard thrust levers and shut down both engines.\nH. Open and collar this P6-4 panel circuit breaker:\ni. A/C OVERBOARD EXH VALVE RECONFIG CONT\n2. If the outflow valve cannot be positioned to the 25% open position:\nA. Open and collar these P6-4 panel circuit breakers:\ni. PRESSURIZATION CONTROL MANUAL\nii. PRESSURIZATION CONTROL AUTO 1\niii. PRESSURIZATION CONTROL AUTO 2\niv. PRESSURIZATION CONTROL IND\nv. PRESSURIZATION CONTROL LCD LTG\nB. Remove the outflow valve (AMM 21-31-03/401). Stow electrical connectors.\nC. Open and collar this P6-4 panel circuit breaker:\ni. A/C OVERBOARD EXH VALVE RECONFIG CONT\n3. Secure the forward cargo heat duct closed:\nA. With shutoff valve 4063-20605-01 installed:\ni. Locate the manual lever on top of the forward cargo heat duct shutoff valve and move the lever from the\nfully open (O) position to the fully closed (C) position.\nB. With shutoff valve 4063-20605-01 NOT installed:\ni. Remove the forward cargo heat duct check valve.\nii. Install cap BOE2221-0011 in the heat duct.\n4. Use an operative pack or ground cart to provide cooling when the airplane is electrically powered on the ground\nand airport temperatures are at or above 73 degrees F / 23 degrees C."},"21-00-16B":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10B for (O) procedures.","m":"Refer to MEL 21-00-10B for (M) procedures.\n21-0016C\nRefer to MEL 21-00-10C for (M) procedures."},"21-00-16C":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10C for (O) procedures."},"21-00-16D":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10D for (O) procedures."},"21-00-16A":{"m":"Install a blanking plate in place of the inoperative pressure relief valve per AMM Task 21-00-00-040-811.\nNote: Make certain that the holes to accept locating pins and ambient sense tube are drilled through blanking\nplate."},"21-00-19A":{"o":"PRIOR TO EACH DEPARTURE:\n1. Make sure that the passenger cabin temperature is stabilized between 70°F and 80°F.\n2. Position the AIR TEMP Selector to affected PASS CAB SUPPLY DUCT – FWD or AFT.\n3. Rotate the associated Cabin Temperature Selector full clockwise and observe that the corresponding SUPPLY DUCT\ntemperature increases.\n4. Rotate the associated Cabin Temperature Selector full counter clockwise and observe that the corresponding\nSUPPLY DUCT temperature decreases."},"21-00-19B":{"o":"Operate all zone temperature selectors normally. The left pack will control the flight deck temperature and the right\npack will control the passenger cabin temperature using the average of the two cabin zone temperature settings.","m":"Position the TRIM AIR switch OFF."},"21-00-19C":{"o":"Operate all zone temperature selectors normally. The left pack will control the flight deck temperature and the right\npack will control the passenger cabin temperature using the average of the two cabin zone temperature settings.","m":"Deactivate trim air modulating valve(s) (locked closed) (AMM 21-00-00-040-822):\n1. Position the associated Zone Temperature Selector (FWD CAB and/or AFT CAB) OFF.\n2. Locate the associated trim air modulating valve(s) in the right hand air conditioning bay. Using the valve manual\noverride, position the valve(s) to the CLOSED position as indicated on the valve visual indicator(s).\n3. Disconnect and stow the electrical connector from the valve(s). This will disable the associated cabin zone\ntemperature control and ensure the trim air modulating valve(s) remains closed.\n4. Position the associated zone temperature selectors(s) to the normal range."},"21-00-19D":{"o":"1. Use MEL 21-00-01 (O) procedures.\n2. Operate with TRIM AIR switch OFF.\n3. Use normal procedures to operate the temperature selectors.","m":"1. Position the TRIM AIR switch to OFF.\n2. Use MEL 21-00-01D or MEL 21-00-01E (M) procedures to deactivate one pack and secure the forward cargo heat\nduct closed."},"21-00-19E":{"o":"1. Use MEL 21-00-01 (O) procedures.\n2. Use normal procedures to operate the temperature selectors.\nNote: With a trim air modulating valve deactivated, the associated FWD CAB or AFT CAB ZONE TEMP light will\nilluminate during Master Caution recall and will extinguish when Master Caution is reset.","m":"Deactivate trim air modulating valve(s) (locked closed) and secure the forward cargo heat duct closed (AMM\n21-00-00-040-822):\n1. Position the FWD CAB and/or AFT CAB Temperature Selector to OFF.\n2. Locate the associated trim air modulating valve(s) in the right ECS bay.\n3. Turn the manual override until the visual position indicator shows the full closed position.\n4. Disconnect and stow the electrical connector from the valve(s).\n5. Position the associated Temperature Selector(s) to the normal temperature range.\n6. Use MEL 21-00-01D or MEL 21-00-01E (M) procedures to deactivate one pack and secure the forward cargo heat\nduct closed."},"21-00-21A":{"o":"use the following procedure to verify that one of the flight deck temperature control systems (Primary or Back-up) is\noperating normally:\n1. Press and release either system annunciator panel on the light shield. The ZONE TEMP light for the CONT CAB, the\nAIR COND annunciator panel light and the MASTER CAUTION light will illuminate if a fault in the either the primary\nor secondary controller is present.\n2. Press and release either MASTER CAUTION light on the light shield. The ZONE TEMP Iight, AIR COND panel light and\nthe MASTER CAUTION lights will extinguish. A ZONE TEMP light that extinguishes upon MASTER CAUTION reset is\nconfirmation of a single controller failure.\nNote: When an intermittent controller fault is present, Step 1 may result in the absence of a ZONE TEMP and\nAIR COND annunciator light. This indicates that both primary and secondary controllers are currently\noperable but continued MEL deferral is advised until the system can be evaluated. Continue with Step 3\nto assure that supply duct temperatures respond to temperature selector inputs.\n3. Confirm that the Flight Deck supply duct temperature responds to the Temperature Selector as follows:\nA. Select the Air Temperature Source Selector to SUPPLY DUCT – CONT CABIN.\nB. Select the CONT CAB Temperature Selector to the full clockwise position (full warm) and observe that the\nSUPPLY DUCT – CONT CABIN temperature increases.\nC. Select the CONT CAB Temperature Selector to the full counter-clockwise position (full cold) and observe that\nthe SUPPLY DUCT – CONT CABIN temperature decreases.\n4. Operate all the zone temperature selectors normally.\nNote: With both flight deck temperature control systems inoperative, the left pack will control the flight deck\ntemperature and the right pack will control the passenger cabin temperature. With the TRIM AIR switch\npositioned to OFF, the two cabin zone temperature setting will be averaged."},"21-00-21B":{"o":"Operate all the zone temperature selectors normally.\nNote: With both flight deck temperature control systems inoperative, the left pack will control the flight deck\ntemperature and the right pack will control the passenger cabin temperature. With the TRIM AIR switch\npositioned to OFF, the two cabin zone temperature setting will be averaged.","m":"Position the TRIM AIR switch to OFF."},"21-00-21C":{"o":"Operate all the zone temperature selectors normally.\nNote: With both flight deck temperature control systems inoperative, the left pack will control the flight deck\ntemperature and the right pack will control the passenger cabin temperature. With the TRIM AIR switch\npositioned to OFF, the two cabin zone temperature setting will be averaged.","m":"Deactivate flight deck trim air modulating valve (locked closed) (AMM 21-00-00-040-822):\n1. Position the CONT CAB zone temperature selector to OFF.\n2. Locate the associated trim air modulating valve in the left hand air conditioning bay. Using the valve manual over\nride, position the valve to the CLOSED position as indicated on the valve visual indicator.\n3. Disconnect and stow the electrical connector from the valve. This will disable the associated cabin zone\ntemperature control and ensure that the trim air modulating valve remains closed.\n4. Position the associated zone temperature selector to the normal range."},"21-00-21D":{"o":"1. Use MEL 21-00-01 (O) procedures.\n2. Operate with TRIM AIR switch OFF.\n3. Use normal procedures to operate the temperature selectors.","m":"1. Position the TRIM AIR switch to OFF.\n2. Defer one pack per MEL 21-00-01D or 21-00-01E as applicable."},"21-00-21E":{"o":"1. Use MEL 21-00-01 (O) procedures.\n2. Use normal procedures to operate the temperature selectors.\nNote: With a trim air modulating valve deactivated, the associated FWD CAB or AFT CAB ZONE TEMP light will\nilluminate during Master Caution recall and will extinguish when Master Caution is reset.","m":"Deactivate flight deck trim air modulating valve (locked closed) and secure the forward cargo heat duct closed (AMM\n21-00-00-040-822):\n1. Position the CONT CAB Temperature Selector to OFF.\n2. Locate the flight deck trim air modulating valve in the left ECS bay.\n3. Turn the manual override until the visual position indicator shows the full closed position.\n4. Disconnect and stow the electrical connector from the valve.\n5. Position the CONT CAB Temperature Selector to the normal temperature range.\n6. Secure the forward cargo heat duct closed and defer one pack per MEL 21-00-01D or 21-00-01E as applicable."},"21-00-26B":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10B for (O) procedures.","m":"Use MEL 21-00-10B (M) procedures to position the outflow valve to the 25% open position."},"21-00-26C":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10C for (O) procedures.","m":"Use MEL 21-00-10C (M) procedures to position the outflow valve to the 25% open position."},"21-00-26D":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10D for (O) procedures.","m":"Use MEL 21-00-10D (M) procedures to position the outflow valve to the 25% open position and secure the forward\ncargo heat duct closed."},"21-00-33A":{"o":"If the associated pack is to be used, verify that the remaining pack temperature control system operates\nnormally as follows:\n1. Press and release a system annunciator panel on the lightshield. The affected PACK light, AIR COND light, and\nMASTER CAUTION light will illuminate if a fault in the either the primary or secondary controller is present.\n2. Press and release a MASTER CAUTION light on the lightshield. The affected PACK light, AIR COND light, and MASTER\nCAUTION light will extinguish. A PACK light that extinguishes upon MASTER CAUTION reset is confirmation of a\nsingle controller failure.\nNote: When an intermittent controller fault is present, Step 1 may result in the absence of a PACK and AIR COND\nannunciator light. This indicates that both primary and secondary controllers are currently operable but\ncontinued MEL deferral is advised until the system can be evaluated."},"21-00-33B":{"o":"If the associated pack is to be used, verify that the remaining pack temperature control system operates\nnormally as follows:\n1. Press and release a system annunciator panel on the lightshield. The affected PACK light, AIR COND light, and\nMASTER CAUTION light will illuminate if a fault in the either the primary or secondary controller is present.\n2. Press and release a MASTER CAUTION light on the lightshield. The affected PACK light, AIR COND light, and MASTER\nCAUTION light will extinguish. A PACK light that extinguishes upon MASTER CAUTION reset is confirmation of a\nsingle controller failure.\nNote: When an intermittent controller fault is present, Step 1 may result in the absence of a PACK and AIR COND\nannunciator light. This indicates that both primary and secondary controllers are currently operable but\ncontinued MEL deferral is advised until the system can be evaluated.","m":"Deactivate and lock the associated Pack Temperature Control Valve closed per AMM Task 21-00-00-040-840."},"21-00-33C":{"o":"If one pack is not used refer to MEL 21-00-01A, 21-00-01B, 21-00-01D, or 21-00-01E for (O) procedures.\nIf both packs are not used refer to 21-00-01C or 21-00-01F for (O) procedures.","m":"Defer one or both packs per MEL 21-00-01A, 21-00-01B, 21-00-01C, 21-00-01D, 21-00-01E, or 21-00-01F as applicable."},"21-00-34A":{"o":"If the associated pack is to be used, verify that one of the pack temperature control systems operates normally as\nfollows:\n1. Press and release a system annunciator panel on the lightshield. The affected PACK light, AIR COND light, and\nMASTER CAUTION light may illuminate.\n2. Press and release a MASTER CAUTION light on the lightshield. The affected PACK light, AIR COND light, and MASTER\nCAUTION light will extinguish.\n3. Illumination of the affected lights when recalled and extinguishing when reset verifies that the remaining pack\ntemperature control system operates normally."},"21-00-34B":{"o":"If one pack is not used refer to MEL 21-00-01 for (O) procedures."},"21-00-34C":{"o":"If both packs are not used refer to MEL 21-00-01 for (O) procedures.","m":"21-00-034B\nDefer associated pack per MEL 21-00-01A, 21-00-01B, 21-00-01D, or 21-00-01E as applicable.\nDefer both packs per 21-00-01C or 21-00-01F as applicable."},"21-00-35B":{"o":"Refer to 21-00-01D or 21-00-01E as applicable for (O) procedures.","m":"1. Position the TRIM AIR switch to OFF.\n2. manually close the trim air pressure and regulating valve (located in the right air conditioning bay next to the keel\nbeam, inboard of the Air Cycle Machine (ACM)) using the valve manual override.\n3. Pull and secure the TRIM AIR PRESS circuit breaker on the P6-4 panel.\n4. Defer one pack per 21-00-01D or 21-00-01E as applicable."},"21-00-35A":{"m":"1. Position the TRIM AIR switch to OFF.\n2. manually close the trim air pressure and regulating valve (located in the right air conditioning bay next to the keel\nbeam, inboard of the Air Cycle Machine (ACM)) using the valve manual override.\n3. Pull and secure the TRIM AIR PRESS circuit breaker on the P6-4 panel."},"21-00-36A":{"o":"Use normal procedures to operate the temperature selectors.\nWith a trim air modulating valve closed, the associated CONT CAB, FWD CAB, or AFT CAB ZONE TEMP light will\nilluminate during Master Caution recall and will extinguish when Master Caution is reset.","m":"Secure the trim air modulating valve(s) closed (AMM 21-00-00-040-822).\n1. Position the associated CONT CAB, FWD CAB or AFT CAB temperature selector to OFF.\n2. Disconnect and stow the electrical connector from the inoperative valve.\nNote: The valve for the flight deck is in the left ECS bay. The valves for the forward and aft passenger cabin are\nin the right ECS bay.\n3. Turn the manual override on the associated Trim Air Modulating valve until the visual position indicator shows the\nfull closed position.\n4. Position the associated temperature selector back to the normal operating range."},"21-00-36B":{"o":"1. Operate with TRIM AIR switch OFF.\n2. Use normal procedures to operate the temperature selectors."},"21-00-36C":{"o":"Refer to MEL 21-00-01 for (O) procedures for inoperative pack.","m":"Secure the trim air modulating valve(s) and the forward cargo heat duct closed (AMM 21-00-00-040-822).\n1. Position the CONT CAB, FWD CAB or AFT CAB temperature selector for the inoperative valve to OFF.\n2. Disconnect and stow the electrical connector from the inoperative valve.\nNote: The valve for the flight deck is in the left ECS bay. The valves for the forward and aft passenger cabin are\nin the right ECS bay.\n3. Turn the manual override on the associated Trim Air Modulating valve until the visual position indicator shows the\nfull closed position.\n4. Position the associated temperature selector back to the normal operating range.\n5. Apply 21-00-01D or 21-00-01E to deactivate one pack and secure the forward cargo heat duct closed."},"21-00-36D":{"o":"1. Operate with TRIM AIR switch OFF.\n2. Refer to MEL 21-00-01 for (O) procedures for inoperative pack,","m":"1. Position the TRIM AIR switch to OFF.\n2. Apply 21-00-01D or 21-00-01E to deactivate one pack and secure the forward cargo heat duct closed."},"21-00-40A":{"o":"Note: Both air conditioning packs are required to maintain pressurization when the valve is failed with actuator in\nthe smoke position. Descent may be required if an air conditioning pack fails enroute.\nOperate aircraft unpressurized. Refer to MEL 21-00-10B for (O) procedures.","m":"Use MEL 21-00-10B (M) procedures to configure the airplane."},"21-00-40B":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10C for (O) procedures.","m":"Use MEL 21-00-10C (M) procedures to configure the airplane."},"21-00-40C":{"o":"Operate aircraft unpressurized. Refer to MEL 21-00-10D for (O) procedures.","m":"Use MEL 21-00-10D (M) procedures to configure the airplane."},"21-00-40D":{"o":"Refer to the Remarks or Exceptions Column.","m":"VALVE INOPERATIVE PARTIALLY OPEN.\n1. Verify that the actuator is in the SMOKE (S) position. If valve has not failed in the SMOKE position, the following\nprocedure can be attempted to position and deactivate the valve in the SMOKE position:\nA. Put the airplane in the air mode using the BITE in the Proximity Switch Electronics Unit (PSEU) (AMM 32-09-00).\nB. Position one of the air conditioning pack switches to HIGH.\nC. Position the right recirculation fan switch to OFF.\nD. After 10 seconds, pull and secure P6-4 Panel Air Conditioning Overboard Exhaust Valve Control circuit breaker.\nE. Disconnect, cap and stow electrical connector D11880 on the overboard exhaust valve.\nF. Verify valve is in the SMOKE position.\nG. Close P6-4 Panel Air Conditioning Overboard Exhaust Valve Control circuit breaker.\nH. Restore airplane to its required configuration.\nFigure 21-12: Equipment Cooling Overboard Exhaust Valve"},"21-00-41A":{"m":"Deactivate the entry door area and overwing emergency exit hatch area heater systems:\n1. To deactivate the inoperative forward entry door and overwing emergency exit hatch area heater systems, pull and\nsecure the FWD DOOR AREA HEATER (C1280) circuit breaker on the P91 Power Distribution Panel.\nNote: Opening circuit breaker C1280 deactivates both the forward entry door area heater and all overwing exit\nhatch heaters.\n2. To deactivate the inoperative aft entry door area heater system, pull and secure the AFT DOOR AREA HEATER\n(C1279) circuit breaker on the P91 Power Distribution Panel."},"21-00-41B":{"m":"Deactivate the mid-exit door area heater system:\n1. Pull and secure the MID EXIT DOOR AREA HEATER circuit breaker on the P6-12 panel."},"21-00-44C":{"o":"For Ground Operations:\n1. Pack with inoperative fan bypass check valve…………..OFF\nIn-Flight:\n2. Pack with inoperative fan bypass check valve…………..As Required\nNote: On ground at high ambient temperature (above 80 Deg. F(27 degrees C)) and high takeoff thrust setting,\nusing affected AC PACK with fan bypass valve inoperative (Fail Open / Missing) may result in Pack Light ON."},"22-00-03A":{"o":"1. Avoid areas of predicted moderate or severe turbulence.\n2. If turbulence is encountered and passenger comfort becomes affected, reduce airspeed and/or descend to a lower\naltitude.\n3. Do not exceed flaps 30."},"22-00-05A":{"o":"Program KIAS/Mach speed restriction in FMS.","m":"Verify that the elevator trailing edge is in the correct position:\nNote: A mach trim actuator and mach trim system are required to position the elevator trailing edge if it is out of\nalignment. An actuator or accessory box that does not operate must be replaced.\nNote: Dispatch with both Mach Trim Systems inoperative is not allowed if the elevator trailing edge is not aligned\nwith the index mark on the fuselage.\n1. Apply electrical power to the aircraft.\n2. Apply hydraulic power to the flight controls.\n3. Position flaps to UP.\n4. Position stabilizer to 4 units of trim.\n5. Jiggle the control column in order to place the elevators in the detent position.\n6. Visually check that the elevator trailing edge is aligned within 0.06 inches of the index mark on the fuselage.\n7. Pull and secure the following circuit breakers:\nCIRCUIT BREAKER PANEL LOCATION\nAFCS SYS A MACH TRIM AC P18-1 C4\nAFCS SYS A MACH TRIM DC P18-1 D4\nAFCS SYS B MACH TRIM AC P6-2 C1\nAFCS SYS B MACH TRIM DC P6-2 B2\nA. MACH TRIM AC\nB. MACH TRIM DC\n8. Restore electrical and hydraulic power as required."},"22-00-05B":{"m":"1. Deactivate the inoperative mach trim system and verify the remaining mach trim system is operating normally.\nA. Pull and Secure the associated MACH TRIM AC and MACH TRIM DC circuit breakers as appropriate:\nCIRCUIT BREAKER PANEL LOCATION\nAFCS SYS A MACH TRIM AC P18-1 C4\nAFCS SYS A MACH TRIM DC P18-1 D4\nAFCS SYS B MACH TRIM AC P6-2 C1\nAFCS SYS B MACH TRIM DC P6-2 B2\nB. Perform the DFCS BITE library test No. 33, Mach Trim, for the remaining system (channel A or channel B), and\nverify that the test passes."},"22-00-15I":{"o":"For RVSM operations requiring altitude hold capability, either ALT HOLD, V/S, or VNAV may be used."},"22-00-18C":{"o":"Refer to MEL item 22-00-01 Remarks or Exceptions for inoperative autopilots."},"23-00-01B":{"o":"Verify TCAS and GPWS aural alerts operate normally.\n1. Perform TCAS Supplementary Procedure (Reference Vol 1, Supplementary Procedures, Section 15). Confirm aural\nannunciation at the completion of the test is heard.\n2. Perform GPWS Supplementary Procedure (Reference Vol 1, Supplementary Procedures, Section 15). Confirm GPWS\nAural alerts are heard.","m":"Verify Altitude Aural Alert operates normally.\n1. Perform Altitude Alert test under the CURRENT STATUS item on the DFCS BITE TEST FAULT REVIEW menu from the\nControl Display unit (CDU)."},"23-00-02A":{"o":"1. Refer to FOM, Briefings and Cabin Crew Communications (Chapter 5).\n2. Refer to QRH, Non-Normal Checklist, Section 5 (Communications), PA System Inoperative.\n3. Refer to In-flight Service Onboard Manual, Aircraft Equipment/Systems (Chapter 6), System Malfunctions,\nInoperative P.A. System."},"23-00-02B":{"o":"1. Prior to departure, the pilot in command will notify flight attendants of inoperative lavatory speaker(s).\n2. Flight attendants must give instructions to lavatory occupants verbally when lavatory speakers are inoperative."},"23-00-04A":{"o":"Refer to QRH , Non-Normal Checklist, Section 5 (Communications), Cabin Interphone System Inoperative."},"23-00-04B":{"o":"Refer to In-flight Service On Board Manual, Aircraft Equipment / Systems, Inoperative Interphone System."},"23-00-04C":{"o":"1. Use operative flight or service interphone flight deck-to-ground function for communication with ground\npersonnel.\n2. If flight and service interphone flight deck-to-ground functions are inoperative, refer to FOM, Ramp Operations\n(Chapter 30)."},"23-00-04D":{"o":"1. Use operative flight or service interphone flight deck-to-ground function for communication with ground\npersonnel.\n2. If flight and service interphone flight deck-to-ground functions are inoperative, refer to FOM, Ramp Operations\n(Chapter 30).","m":"1. Deactivate the Flight Interphone System per AMM Task 23-51-00-040-801.\n2. Locate and cut the following wires approximately 2-3” downstream of the associated connector. Protect and stow\nthe unterminated/cut wire ends common to the EXT GRND PWR Panel Interphone Jack per 707, 727 Through 787\nSWPM (D6-54446) Ch. 20-10-11:\n1. Note: Gain access to the flight interphone jack, by carefully removing the upper half of the P19 External Power\nPanel. Reference B737-800/900ER SRM 51-40-02 as necessary for fastener removal and installation.\nCAUTION ENSURE THAT POWER IS REMOVED FROM THE SYSTEM TO PREVENT ELECTRICAL SHOCK HAZARD.\nELECTRICAL VOLTAGE AND CURRENT CAN CAUSE DEATH OR INJURY.\nA/C 3701-3771\nWire Number Color Location Pin Location to Cut Wire\nW0048-A-BK Black D4499J to D6009 Pin 9 on Connector D4499J\nW0048-A-RD Red D4499J to D6009 Pin 7 on Connector D4499J\nW0048-A-BL Blue D4499J to D6009 Pin 8 on Connector D4499J\nA/C 3772-3777, 3801-3963\nWire Number Color Location Pin Location to Cut Wire\nW0048-A-BK Black D40665 to D6009 Pin 30 on Connector D40665\nW0048-A-RD Red D40665 to D6009 Pin 28 on Connector D40665\nW0048-A-BL Blue D40665 to D6009 Pin 29 on Connector D40665\nReference WDM 23-41-11 as necessary.\n2. Re-activate the Flight Interphone System as per AMM Task 23-51-00-440-801.\nFigure 23-1: P19 External Power Panel"},"23-00-04E":{"o":"1. Use operative flight or service interphone flight deck-to-ground function for communication with ground\npersonnel.\n2. If flight and service interphone flight deck-to-ground functions are inoperative, refer to FOM, Ramp Operations\n(Chapter 30)."},"23-00-04F":{"o":"1. Use operative flight or service interphone flight deck-to-ground function for communication with ground\npersonnel.\n2. If flight and service interphone flight deck-to-ground functions are inoperative, refer to FOM, Ramp Operations\n(Chapter 30)."},"23-00-06A":{"o":"May be inoperative provided appropriate Company radio frequency or ACARS is monitored in flight."},"23-00-06B":{"o":"May be inoperative provided appropriate Company radio frequency or ACARS is monitored in flight."},"23-00-09A":{"o":"Refer to QRH, Non-Normal Checklists Communications, ACARS Inop or ACARS MU Fail or DU Fail.\n1. Flight Duty Period (FDP) Limit:\nA. Utlize LATT Worksheet or Contact Flight Control to determine LATT/FDP Limit and if FDP extension is required\nto complete the flight.\nPilots must monitor FDP Limit prior to OFF event.\nB. At or within 15 minutes of FDP Limit and if an FDP extension is required to complete the flight prior to IN,\ncontact ATL radio via VHF or telephone and advise Dispatcher of pilot(s) employee number and FDP Accept/\nReject.\nDispatch will send reply in Flight History for electronic documentation."},"23-00-09C":{"o":"Refer to QRH, Non-Normal Checklists Communications, ACARS Inop or ACARS MU Fail or DU Fail."},"23-00-10B":{"m":"Deactivate RIPS (AMM 23-00-00-040-806):\n1. Pull and secure VOICE RCDR/RIPS circuit breaker on the P18-2 panel located at D6."},"23-00-10C":{"m":"Remove RIPS battery (AMM 23-00-00-040-806).\n1. Open the VOICE RCDR/RIPS circuit breaker on the P18-2 panel located at D6.\n2. Remove battery from RIPS.\n3. Cover battery pack connector on the RIPS charger assembly with an electrical connector cap.\n4. Secure electrical connector cap to charger assembly with tape.\n5. Close the VOICE RCDR/RIPS circuit breaker on the P18-2 panel."},"23-00-10D":{"m":"Remove RIPS battery (AMM 23-00-00-040-806).\n1. Open the VOICE RCDR/RIPS circuit breaker on the P18-2 panel located at D6.\n2. Remove battery from RIPS.\n3. Cover battery pack connector on the RIPS charger assembly with an electrical connector cap.\n4. Secure electrical connector cap to charger assembly with tape.\n5. Close the VOICE RCDR/RIPS circuit breaker on the P18-2 panel."},"23-00-11A":{"o":"1. Confirm route to flown complies with limitations of the Remark or Exceptions column.\n2. Refer to Airway Manual 6.1.2 Communication Equipment Requirements Chart.","m":"Contact the MCC. MCC will review the procedures in SOP MCCGP07, Applying WATRS Restrictions with HF Radio\nMEL, to determine if a 30 day history review of HF Communications deferrals or application of the Long Range\nCommunication System MEL is required."},"23-00-11B":{"o":"1. Confirm route to flown complies with limitations of the Remark or Exceptions column.\n2. Refer to Airway Manual 6.1.2 Communication Equipment Requirements Chart.","m":"Contact the MCC. MCC will review the procedures in SOP MCCGP07, Applying WATRS Restrictions with HF Radio\nMEL, to determine if a 30 day history review of HF Communications deferrals or application of the Long Range\nCommunication System MEL is required."},"23-00-11C":{"o":"1. When out of VHF range, use remaining operative HF radio for required ATC communications.\n2. Refer to Operations Manual, Volume 1 737 Section 5.5 Communications for alternate procedures to follow if\nremaining HF radio fails.\n3. Refer to Airway Manual 6.1.2 Communication Equipment Requirements Chart."},"23-00-12C":{"m":"Deactivate the inoperative “fixed” ELT by performing AMM Task 23-00-00-040-808."},"23-00-12E":{"m":"Deactivate the inoperative “fixed” ELT by performing AMM Task 23-00-00-040-808."},"23-00-12D":{"m":"On an Aircraft Placard, write “ELT NOT INSTALLED” and attach it to the forward instrument panel in view of the pilot."},"23-00-16A":{"m":"1. To verify the switch has electrically failed open listen for sidetone during a trial transmission, but do not use the\nassociated PTT switch. If switch is failed open defer per MEL 23-00-16B.\nNote: If there is sidetone, the PTT switch has failed in the closed position.\n2. If the Control Wheel PTT switch is failed closed deactivate the switch per AMM Task 23-00-00-040-801."},"23-00-16C":{"m":"1. To verify the switch has electrically failed open listen for sidetone during a trial transmission, but do not use the\nassociated PTT switch.\nNote: If there is sidetone, the PTT switch has failed in the closed position."},"23-00-16D":{"m":"1. To verify the switch has electrically failed open listen for sidetone during a trial transmission, but do not use the\nassociated PTT switch.\n2. If there is sidetone, the PTT switch has failed in the closed position.\n3. If glareshield PTT switch is failed closed deactivate per AMM Task 23-00-00-040-803.\nNote: If the PTT switch needs to be deactivated, maintenance is required and “Flight Crew May NOT Placard”.\nFigure 23-2: CONTROL WHEEL PTT SWITCH – REMOVAL / INSTALLATION"},"21-00-18A":{"o":"1. Refer to Airway Manual Section 6.1 Communication Equipment Requirements."},"21-00-18C":{"o":"1. Refer to Airway Manual Section 6.1 Communication Equipment Requirements."},"23-00-19B":{"o":"Flight Attendants will use PA or establish verbal communication with inoperative call light or chime positions."},"23-00-19C":{"o":"Flight Attendants will use PA or establish verbal communication with inoperative call light or chime positions."},"23-00-20A":{"o":"Use the Cabin Interphone / PA function of the Captain’s or First Officer’s Audio Selector Panel."},"23-00-20B":{"o":"Flight Attendant occupying seat with inoperative handset will establish communication with Flight Attendant\noccupying the position with an operative handset."},"23-00-29":{"o":"1. Refer to FOM - Flight Ops Manual Section 17.4 Customer Medical Events/Emergencies, and On-Board Manual for\nprocedures in rendering medical assistance, filling out Medical Assistance Form (MAF), and communicating with\nSTAT-MD Consultants."},"23-00-99A":{"o":"Captain to brief Lead Flight Attendant that it may be necessary to do passenger briefings and emergency equipment\ndemonstrations verbally.","m":"Note: This relief should only be applied if it is necessary to deactivate the IFE system for situations such as\noverheating or safety of flight. If the system is partially operative then use the partially operative MEL relief;\nfor example, if the wrong media software was loaded or the file server was corrupted the system would not\noperate normally but would not require deactivation. For individual IFE components see the Nonessential\nEquipment and Furnishings List (NEF) for deferral.\n1. To deactivate the IFE System:\nA. For aircraft 3772-3773, pull and secure the following circuit breakers:\nCIRCUIT BREAKER PANEL LOCATION\nSeat PWR FWD P6-12 A8\nSeat PWR AFT P6-12 A5\nIVS Head End P6-1 B9\nPWR CTRL P6-1 B10\nB. For aircraft 3701-3743, pull and secure the following circuit breakers:\nCIRCUIT BREAKER PANEL LOCATION\nAMCU 1 P6-1 C9\nAMCU 2 P6-1 C12\nAI, FS P6-1 B13\nIFE DC P6-1 C5\nCELL MODEM P6-1 B10\nCREW PANEL P6-1 B8\nHDD OML P6-1 B9\nC. For aircraft 3744-3771, pull and secure the following circuit breakers:\nCIRCUIT BREAKER PANEL LOCATION\nPWR IFE DC P6-1 C8\nIFE CONTROL P6-1 C10\nAMCU 1 P6-1 B12\nAMCU 2 P6-1 B9\nADB 1 P6-1 A8\nADB 2 P6-1 A9\nADRS P6-1 A11\nD. For aircraft 3774-3777, pull and secure the following circuit breakers:\nCIRCUIT BREAKER PANEL LOCATION\nAMCU 1 P6-1 C9\nAMCU 2 P6-1 C12\nAI, FS1, FS2 P6-1 B13\nIFE DC P6-1 C5\nCELL MODEM P6-1 B10\nCREW PANEL P6-1 B8\nHDD OML P6-1 B9\nE. For aircraft 3801-3930, and for 3931-3963 post AA 2500-01847, pull and secure the following circuit breakers:\nCIRCUIT BREAKER PANEL LOCATION\nIFE DC P6-1 B10\nIFE AC P6-1 B9\nSAT TV SYS P6-1 B12\nSAT TV CONTROL P6-1 B13\nSEAT POWER FWD P6-12 A8\nSEAT POWER AFT P6-12 A5\nVIDEO-1 P6-1 D5\nF. For pre AA 2500-01847 aircraft 3943-3952 and 3955-3963, pull and secure the following circuit breakers:\nCIRCUIT BREAKER PANEL LOCATION\nIFE DC P6-1 B10\nIFE AC P6-1 B9\nSEAT POWER FWD P6-12 A8\nSEAT POWER AFT P6-12 A5\nVIDEO-1 P6-1 D5\nVIDEO-2 P6-1 D6\n2. Install a placard on the IFE control panel stating “IFE Inoperative – Do not use”.\n3. On ships 3701 thru 3777, 3801 thru 3930, and 3931-3963 post AA 2500-01847 with the AVOD, the pre-recorded\nannouncement system is considered inoperative and deferred per MEL 23-00-15.\nNote: For Business Elite Seats, deactivation of the IFE system will also remove recline and footrest power.\n24 Electrical Power\nTable of Contents"},"23-00-99B":{"o":"Captain to brief Lead Flight Attendant that it may be necessary to do passenger briefings and emergency equipment\ndemonstrations verbally."},"24-00-02":{"o":"Refer to the B737 Operations Manual Volume 1, Supplementary Procedures, Engines, APU, Engine Start with APU inop,\nor APU Generator System Inop."},"25-00-03A":{"o":"1. The flight attendant assigned to the affected seat position must occupy either a passenger seat or an excess flight\nattendant seat, whichever is most accessible to the inoperative seat. The flight attendant must be able to reach the\nassigned emergency exit in essentially the same time as from the normally assigned seat, i.e., a 2 or 3 second time\ndifference is considered ”essentially the same time”.\n2. Refer to In-Flight Service Onboard Manual, Section 7, Flight Dispatch With Inoperative Flight Attendant Seat.","m":"1. Ensure the Flight Attendant Seat automatically retracts without assistance to the fully stowed position.\n2. If the seat will not automatically retract without assistance to the fully stowed position, secure the inoperative\nseat in the fully stowed position using the following procedure (Maintenance is Required and Flight Crew May NOT\nPlacard):\nA. Secure seat in the retracted (fully stowed) position using high visibility tape.\nB. Placard the seat using high visibility tape or a section of 2 inch wide masking tape with the words\n“UNSERVICEABLE - DO NOT USE” printed legibly in 1 inch black letters.\nONCE EACH FLIGHT DAY:\n1. Ensure seat has remained in fully stowed position. If seat has been secured in the fully stowed position with tape,\nensure tape is in good condition."},"25-00-03C":{"o":"1. The flight attendant assigned to the affected seat position must occupy either a passenger seat or an excess flight\nattendant seat, whichever is most accessible to the inoperative seat. The flight attendant must be able to reach the\nassigned emergency exit in essentially the same time as from the normally assigned seat, i.e., a 2 or 3 second time\ndifference is considered ”essentially the same time”.\n2. Refer to In-Flight Service Onboard Manual, Section 7, Flight Dispatch With Inoperative Flight Attendant Seat."},"25-00-03B":{"m":"1. Ensure the Flight Attendant Seat automatically retracts without assistance to the fully stowed position.\n2. If the seat will not automatically retract without assistance to the fully stowed position, secure the inoperative\nseat in the fully stowed position using the following procedure (Maintenance is Required and Flight Crew May NOT\nPlacard):\nA. Secure seat in the retracted (fully stowed) position using high visibility tape.\nB. Placard the seat using high visibility tape or a section of 2 inch wide masking tape with the words\n“UNSERVICEABLE - DO NOT USE” printed legibly in 1 inch black letters.\nONCE EACH FLIGHT DAY:\n1. Ensure seat has remained in fully stowed position. If seat has been secured in the fully stowed position with tape,\nensure tape is in good condition."},"25-00-05A":{"m":"Refer to Aircraft Loading Manual (ALM):\nB737-900ER Weight and Balance Chapter 3943, Cargo Loading Section.\nB737-800 Weight and Balance Chapter 3991, Cargo Loading Section.\nB737 Ca
