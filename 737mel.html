ents chart. Note 2: Dual VHF Communication Required For ILS PRM Operations."},{"n":"23-00-03B","t":"Radio Tuning Panels (RTP)","r":"One may be inoperative provided: 1. left radio tuning panel operates normally, and 2. Inoperative radio tuning panel remains OFF."},{"n":"23-00-03C","t":"Off-Side Tuning Light","r":"May be inoperative."},{"n":"23-00-03D","t":"VHF Data Link","r":"May be inoperative provided procedures do not require its use. Note: Refer toPBCS Equipment Requirements chart."},{"n":"23-00-04A","t":"Flight Deck to Cabin, Cabin to Flight Deck Functions","r":"(O)May be inoperative provided: 1. Flight deck to cabin and cabin to flight deck interphone functions operate normally on at least 50% of cabin handsets, 2. Flight deck to cabin and cabin to flight deck interphone functions operate normally on forward cabin handset, and 3. Alternate communications procedures between the affected Flight Attendants stations are used. Note: Any station functions that operate normally may be used."},{"n":"23-00-04B","t":"Cabin to Cabin Function","r":"(O)May be inoperative provided alternate communication procedures between affected flight attendant stations are used. Note: Any station functions that operate normally may be used."},{"n":"23-00-04C","t":"Flight Deck to Ground Function (Includes CALL functions)","r":"(O)Flight interphone flight deck to ground / ground to flight deck function may be inoperative provided: 1. Alternate procedures are used, and 2. Nose gear / forward fuselage service interphone jack operates normally."},{"n":"23-00-04D","t":"Flight Deck to Ground Function (Includes CALL functions)","r":"(O)(M)Flight interphone flight deck to ground / ground to flight deck function may be inoperative provided: 1. Flight Interphone Jack on the EXT GRND PWR panel is deactivated, 2. Alternate procedures are used, and 3. Nose gear / forward fuselage service interphone jack operates normally. Note: If a faulty flight interphone jack is popping the circuit breaker or causing a constant nuisance noise, the faulty jack may be isolated and deferred using this MEL. Otherwise useMEL 23-00-04C. Date: 27-Aug-2025"},{"n":"23-00-04E","t":"Flight Deck to Ground Function (Includes CALL functions)","r":"(O)Service interphone flight deck to ground / ground to flight deck function may be inoperative provided: 1. Alternate procedures are used, and 2. Nose gear / forward fuselage flight interphone jack operates normally."},{"n":"23-00-04F","t":"Flight Deck to Ground Function (Includes CALL functions)","r":"(O)Flight and Service interphones flight deck to ground / ground to flight deck function may be inoperative provided alternate procedures are used."},{"n":"23-00-06A","t":"Selective Call System (SELCAL)","r":"(O)May be inoperative provided alternate procedures are used."},{"n":"23-00-06B","t":"SELCAL Channels","r":"(O)May be inoperative provided alternate procedures are used."},{"n":"23-00-09A","t":"ACARS System","r":"(O)May be inoperative provided alternate procedures are used. Note 1: Refer toAirway Manual, Communications, Dispatch Communication, ACARS inoperative Reporting Procedures and Mandatory Company Reports. Note 2: To obtain performance data, refer to FOM - Flight Ops Manual 14.7.4 WDR Delivery with Network Outage/ACARS on MEL. Downstream stations will be notified automatically after log sheet entry. Note 3: If Automatic Engine Data Reporting is inoperative, defer the Aircraft Condition Monitoring System perMEL 31-00-07A. Note 4: Any portion of system that operates normally may be used. Note 5: CPDLC and ADS-C programs are inoperative beyond VHF range. Note 6: With CVR Datalink enabled, an inoperative ACARS could cause a CVR fault. If Datalink is inoperative refer to MEL 23-00-03. If CVR and/or RIPS is inoperative refer toMEL 23-00-10. Note 7: Refer toPBCS Equipment Requirements chart."},{"n":"23-00-09B","t":"ACARS Printer","r":"May be inoperative. Note: Refer toFOM - Flight Ops Manual 14.7.2.2.2 ACARS Printer Inoperative."},{"n":"23-00-09C","t":"FMC Interface Function","r":"(O)May be inoperative provided alternate procedures are used. Note: Any portion of system that operates normally may be used. Date: 18-Dec-2024"},{"n":"23-00-09D","t":"FMC Interface Function","r":"May be inoperative provided procedures do not require its use. Note: Any portion of system that operates normally may be used."},{"n":"23-00-10","t":"COCKPIT","r":"(CVR)"},{"n":"23-00-10A","t":"Cockpit Voice Recorder System (CVR) without Recorder Independent Power Supply (RIPS) -800 (3701-3771)","r":"May be inoperative provided: 1. Flight Data Recorder (FDR) operates normally, and 2. Repairs are made within three flight days. Note: With CVR Datalink enabled, an inoperative ACARS could cause a CVR fault, refer toMEL 23-00-09."},{"n":"23-00-10B","t":"Cockpit Voice Recorder System (CVR) with Recorder Independent Power Supply (RIPS) -900ER -800 (3772 \u0026 subs)","r":"(M)May be inoperative provided: 1. Flight Data Recorder (FDR) operates normally, 2. RIPS circuit breaker is pulled and collared, 3. A 15 minute interval after pulling the c/b is achieved before departure, and 4. Repairs are made within three flight days. Note 1: CVR is inoperative with the RIPS c/b pulled and collared. Note 2: With CVR Datalink enabled, an inoperative ACARS could cause a CVR fault, refer toMEL 23-00-09."},{"n":"23-00-10C","t":"Recorder Independent Power Supply (RIPS) -900ER -800 (3772 \u0026 subs)","r":"(M)May be inoperative provided: 1. CVR operates normally, and 2. RIPS battery is removed."},{"n":"23-00-10D","t":"Recorder Independent Power Supply (RIPS) -900ER -800 (3772 \u0026 subs)","r":"(M)May be inoperative provided: 1. Flight Data Recorder operates normally, 2. RIPS battery is removed, and 3. Repairs are made within three flight days."},{"n":"23-00-11A","t":"HF Communication Systems","r":"(O)(M)May be inoperative provided route of flight does not require the use of HF radios. Note: Refer toAirway Manual 6.1.2 Communication Equipment Requirements Chart"},{"n":"23-00-11B","t":"HF Communication Systems","r":"(O)(M)One or both may be inoperative provided route to be flown does not require its use. Note: Refer toAirway Manual 6.1.2 Communication Equipment Requirements Chart"},{"n":"23-00-11C","t":"HF Communication Systems 23-00-12 Emergency Locator Transmitter (ELT)","r":"(ELT)"},{"n":"23-00-12","t":"EMERGENCY LOCATOR TRANSMITTER Emergency Locator Transmitter (ELT)","r":"(ELT)"},{"n":"23-00-12A","t":"Survival Type ELT (Portable) (Aircraft 3701-3771)","r":"One may be inoperative or missing."},{"n":"23-00-12B","t":"Survival Type ELT(Portable)(B737-900 Aircraft AA 2500-01847) (B737-800 Aircraft 3772-3777)","r":"3801-3930)(B737-900 Aircraft 3931-3963 post"},{"n":"23-00-12C","t":"Fixed ELT(B737-900, and B737-800 Aircraft 23-00-14","r":"3772-3777)"},{"n":"23-00-12D","t":"Fixed ELT (B737-900, and B737-800 Aircraft 3772-3777)","r":"(M)May be missing provided: 1. Placard stating “ELT not installed” is placed in view of the pilot, and 2. Repairs are made within 90 days."},{"n":"23-00-12E","t":"Fixed ELT (B737-900, and B737-800 Aircraft 3772-3777)","r":"(M)May be inoperative provided: 1. System is deactivated, and 2. Survival type ELT operates normally."},{"n":"23-00-12F","t":"Fixed ELT (B737-900, and B737-800 Aircraft 3772-3777)","r":"May be missing provided Survival type ELT is operational."},{"n":"23-00-14A","t":"Headset Boom Microphones","r":"May be inoperative provided: 1. Associated hand microphone is installed and operates normally, and 2. Repairs are made within three flight days."},{"n":"23-00-14B","t":"Headset Earphones / Headphones (Captain and","r":"First Officer)"},{"n":"23-00-14C","t":"Boom Microphones / Headset Earphones / Headphones 23-00-15 PRE–RECORDED","r":"(Excess or Spare) SYSTEM"},{"n":"23-00-15","t":"PRE–RECORDED","r":"SYSTEM"},{"n":"23-00-16A","t":"Control Wheel PTT Switches","r":"(M)May be inoperative provided: 1. Associated audio selector panel PTT switch operates normally, and 2. Affected switch is deactivated."},{"n":"23-00-16B","t":"Control Wheel PTT Switches","r":"May be inoperative provided: 1. Associated audio selector panel PTT switch operates normally, and 2. Affected switch is verified to be failed open. Note: If there is sidetone, the PTT switch has failed in the closed position."},{"n":"23-00-16C","t":"Flight Crew Audio Selector Panel PTT Switches","r":"(M)May be inoperative provided: 1. Associated Control Wheel PTT switch operates normally, and 2. Affected switch is verified failed open."},{"n":"23-00-16D","t":"Glareshield Panel PTT Switches (-900ER and 23-00-17","r":"ships 3772-3777) (CAPTAIN AND FIRST OFFICER)"},{"n":"23-00-17","t":"Flight Deck Hand Microphones (Captain and 23-00-18","r":"First Officer) (SATCOM)"},{"n":"23-00-18","t":"SATELLITE","r":"(SATCOM)"},{"n":"23-00-18A","t":"Satellite Communication System (SATCOM)","r":"(O)May be inoperative provided alternate procedures are used. Note 1: Refer toAirway Manual 6.1.2 Communication Equipment Requirements Chart. Note 2: CPDLC and ADS-C programs are inoperative beyond VHF range. Note 3: Refer toPBCS Equipment Requirements chart."},{"n":"23-00-18B","t":"Satellite Communication System (SATCOM)","r":"May be inoperative provided procedures do not require its use. Note 1: Refer toAirway Manual Section 6.1 Communication Equipment Requirements. Note 2: Refer toPBCS Equipment Requirements chart."},{"n":"23-00-18C","t":"SATCOM Data Link","r":"(O)May be inoperative provided alternate procedures are used. Note 1: Refer toAirway Manual 6.1.2 Communication Equipment Requirements Chart. Note 2: CPDLC and ADS-C programs are inoperative beyond VHF range. Note 3: Refer toPBCS Equipment Requirements chart."},{"n":"23-00-18D","t":"SATCOM Data Link","r":"May be inoperative provided procedures do not require its use. Note 1: Refer toAirway Manual Section 6.1 Communication Equipment Requirements Note 2: CPDLC and ADS-C programs are inoperative beyond VHF range. Note 3: Refer toPBCS Equipment Requirements chart. Date: 21-Aug-2024"},{"n":"23-00-19A","t":"Flight Deck Call Visual Alerting System (Blue","r":"Light)"},{"n":"23-00-19B","t":"Flight Attendant Visual Alerting (Call Light) System","r":"(O)May be inoperative provided: 1. PA system operates normally, and 2. Alternate procedures for contacting flight attendants are used. Note 1: Passenger to Attendant Call System is considered a Nonessential Equipment Furnishings (NEF) item. Note 2: Any visual alerting system function(s) that operates normally may be used."},{"n":"23-00-19C","t":"Flight Attendant Audio Alerting (Call Chime) System","r":"(O)May be inoperative provided: 1. PA system operates normally, and 2. Alternate procedures for contacting flight attendants are used. Note 1: Passenger to Attendant Call System is considered a Nonessential Equipment Furnishings (NEF) item. Note 2: Any audio alerting system function(s) that operates normally may be used."},{"n":"23-00-20A","t":"Flight Deck Handset","r":"(O)May be inoperative provided: 1. Flight Deck to cabin communication operates normally, and 2. Alternate procedures are used."},{"n":"23-00-20B","t":"Cabin Handsets","r":"Date: 27-Aug-2025 SYSTEM"},{"n":"23-00-29","t":"Passenger Cabin Medical Communications System(B737-800)(B737-900 23-00-30","r":"Aircraft 3801-3930) LOCATING DEVICE (LF-ULD)"},{"n":"23-00-30","t":"Low Frequency Underwater Locating Device 23-00-97","r":"(LF-ULD)"},{"n":"23-00-97","t":"PBCS Monitored Performance","r":"Aircraft is not PBCS approved due to poor monitored performance. Do not file flight plan using P2 or SUR/ RSP180 ICAO codes. FANS (CPDLC/ADS-C) functionality is normal and can be used."},{"n":"23-00-98","t":"Long Range Communication System 23-00-99 IN-FLIGHT ENTERTAINMENT (IFE)","r":"SYSTEM (SYSTEM DEACTIVATED)"},{"n":"23-00-99","t":"IN-FLIGHT ENTERTAINMENT (IFE)","r":"SYSTEM (SYSTEM DEACTIVATED)"},{"n":"23-00-99A","t":"In-flight Entertainment (IFE) System (system","r":"deactivated)"},{"n":"23-00-99B","t":"In-flight Entertainment (IFE) System (partially","r":"operative) Date: 16-Aug-2023"},{"n":"24-00-01","t":"Engine Driven Generator System","r":"(O)(M)Except for Extended Operations (ETOPS), may be inoperative provided: 1. APU generator operates normally and is used throughout flight, 2. APU oil quantity is serviced to full prior to deferral and ONCE EACH FLIGHT DAY (Log Book Entry Required), 3. RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements, and 4. Performance Correctionsare applied. Note 1: Use of coastal routing is recommended for operations from Alaska \"to\" the 48 contiguous states. Note 2: This item is AD related. Theater Restrictions may apply Repetitive Check Required (Yellow Placard)"},{"n":"24-00-02","t":"APU Generator System","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided RNAV operations do not require their use; refer toNavigation Equipment Tab (this manual) for RNAV Minimum Requirements. Note: Use of coastal routing is recommended for operations from Alaska \"to\" the 48 contiguous states. Theater restrictions may apply"},{"n":"24-00-03","t":"ENGINE","r":"LIGHTS"},{"n":"24-00-07","t":"Frequency Meter","r":"Frequency Meter INOP Date: 18-Dec-2024"},{"n":"24-00-08","t":"AC Volts Indication","r":"(O)May be inoperative except in STBY PWR position provided Standby Power Test is accomplished."},{"n":"24-00-11","t":"External Power System","r":"Note: Any portion of system which operates normally may be used."},{"n":"24-00-12","t":"GEN OFF BUS Lights","r":"May be inoperative provided associated generator AC ammeter operates normally."},{"n":"24-00-14","t":"BAT DISCHARGE Light OPERATIONS NOTE The BAT DISCHARGE light illuminates whenever the main discharging. The following tests may be performed to verify 1. Position the DC Meters Selector to the BAT position and negative. 2. If an AUX battery is installed(-800), position the DC Meters that the DC AMPS indication is not negative.","r":"BAT DISCHARGE Light INOP battery or the Auxiliary battery (if installed, -800) is that the batteries are not discharging: verify that the DC AMPS indication is not Selector to the AUX BAT position and verify Date: 29-Sep-2022"},{"n":"24-00-15","t":"TR UNIT Light OPERATIONS NOTE The TR UNIT light illuminates whenever a TR fault exists. The the TR’s are operating normally: 1. Position the DC Meters selector to the TR 1 position and than 5 amps. 2. Position the DC Meters selector to the TR 2 position and than 5 amps. 3. Position the DC Meters selector to the TR 3 position and volts.","r":"TR UNIT Light INOP following test may be performed to verify that verify that the DC AMPS indication is greater verify that the DC AMPS indication is greater verify that the DC VOLTS indication is 28 ± 6 Date: 16-Aug-2023"},{"n":"24-00-16","t":"ELEC Light","r":"(O)May be inoperative OFF provided PRIOR TO EACH DEPARTURE: 1. Standby Power Test is accomplished, and 2. Battery Charger is verified to operate normally. Repetitive Check Required (Yellow Placard)"},{"n":"24-00-17","t":"DC Ammeter Indication","r":"(O)May be inoperative provided: 1. BAT position operates normally, 2. Standby Power Test is accomplished, and 3. Procedures do not require its use."},{"n":"24-00-18","t":"DC Volts Indication","r":"(O)May be inoperative except in STBY PWR position provided Standby Power Test is accomplished."},{"n":"24-00-19","t":"APU Light","r":"Date: 15-Mar-2023"},{"n":"25-00-01","t":"Megaphones Tamper Seals or Tags (O) PROCEDURES PRIOR TO EACH DEPARTURE Captain to brief Lead Flight Attendant/Purser that one or more missing seals and proper installation and operation has to be","r":"(O)May be inoperative, damaged, or missing provided proper installation and operation is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard) megaphone(s) have inoperative, damaged, or verified. Date: 29-Sep-2022"},{"n":"25-00-03A","t":"Required Flight Attendant Seats (Refer to In-flight Service Onboard Manual for required seat locations)","r":"(O)(M)One seat or assembly (dual position) may be inoperative provided: 1. Affected seat or seat assembly is not occupied, 2. Flight attendant(s) displaced by inoperative seat(s) occupies either an adjacent flight attendant seat or passenger seat which is most accessible to inoperative seat(s), so as to most effectively perform assigned duties, 3. Alternate procedures are used for displaced Flight Attendant(s)(Ref. In-flight Service Onboard Manual), 4. Folding type seat stows automatically or is secured in retracted position and is checked ONCE EACH FLIGHT DAY (LOG BOOK ENTRY REQUIRED), and 5. Passenger seat assigned to flight attendant is placarded \"FOR FLIGHT ATTENDANT ONLY\". Note 1: An automatic folding seat that will not stow automatically is considered inoperative. Note 2: A seat position with an inoperative or missing restraint system renders that seat position inoperative. Note 3: If one side of a dual seat assembly is inoperative and a flight attendant is displaced to the adjacent seat, adjacent seat must operate normally. Repetitive Check Required (Yellow Placard) Date: 29-Sep-2022"},{"n":"25-00-03B","t":"Excess Flight Attendant Seat(s) (O) PROCEDURES","r":"(M)May be inoperative provided: 1. Affected seat position or seat assembly is not occupied, and 2. Folding type seat stows automatically or is secured in retracted position and is checked ONCE EACH FLIGHT DAY (LOG BOOK ENTRY REQUIRED). Note 1: An automatic folding seat that will not stow automatically is considered inoperative. Note 2: A seat position with an inoperative or missing restraint system is considered inoperative. Repetitive Check Required (Yellow Placard)"},{"n":"25-00-05","t":"CARGO","r":"COMPONENTS"},{"n":"25-00-05A","t":"Cargo Compartment Restraint Components (FWD Cargo Bin 1 Transverse Net)","r":"(M)May be inoperative or missing provided: 1. Cargo-loading limits from the Weight and Balance Manual are observed, and 2. Repairs are made within 120 consecutive calendar-days."},{"n":"25-00-05B","t":"Cargo Compartment Restraint Components (FWD Cargo Bin 1 Door Net)","r":"(M)May be inoperative or missing provided: 1. Cargo-loading limits from the Weight and Balance Manual are observed, and 2. Repairs are made within 120 consecutive calendar-days."},{"n":"25-00-05C","t":"Cargo Compartment Restraint Components (FWD Cargo Bin 2 Transverse Net)","r":"(M)May be inoperative or missing provided: 1. Cargo-loading limits from the Weight and Balance Manual are observed, and 2. Repairs are made within 120 consecutive calendar-days."},{"n":"25-00-05D","t":"Cargo Compartment Restraint Components (FWD Cargo Bin 2 Attach/ Tie Down Point)","r":"(M)May be inoperative or missing provided: 1. Cargo-loading limits from the Weight and Balance Manual are observed, and 2. Repairs are made within 120 consecutive calendar-days."},{"n":"25-00-05E","t":"Cargo Compartment Restraint Components (AFT Cargo Bin 3 Transverse Net)","r":"(M)May be inoperative or missing provided: 1. Cargo-loading limits from the Weight and Balance Manual are observed, and 2. Repairs are made within 120 consecutive calendar-days."},{"n":"25-00-05F","t":"Cargo Compartment Restraint Components (AFT Cargo Bin 3 Attach/Tie Down Point)","r":"(M)May be inoperative or missing provided: 1. Cargo-loading limits from the Weight and Balance Manual are observed, and 2. Repairs are made within 120 consecutive calendar-days."},{"n":"25-00-05G","t":"Cargo Compartment Restraint Components (AFT Cargo Bin 4 Door Net)","r":"(M)May be inoperative or missing provided: 1. Cargo-loading limits from the Weight and Balance Manual are observed, and 2. Repairs are made within 120 consecutive calendar-days."},{"n":"25-00-05H","t":"Cargo Compartment Restraint Components (AFT Cargo Bin 4 AFT Transverse Net)","r":"(M)May be inoperative or missing provided: 1. Cargo-loading limits from the Weight and Balance Manual are observed, and 2. Repairs are made within 120 consecutive calendar-days. Date: 16-Aug-2023"},{"n":"25-00-05I","t":"Cargo Compartment Restraint Components (FWD Cargo Nets)","r":"May be inoperative or missing provided: 1. Associated cargo compartment remains empty, or is verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions), and 2. Repairs are made within 30 consecutive calendar-days."},{"n":"25-00-05J","t":"Cargo Compartment Restraint Components (AFT Cargo Nets)","r":"May be inoperative or missing provided: 1. Associated cargo compartment remains empty, or is verified to contain only empty cargo handling equipment, ballast, and/or flyaway kits (see MEL Instructions), and 2. Repairs are made within 30 consecutive calendar-days. NET INOP NET INOP DOWN POINT INOP NET INOP DOWN POINT INOP Date: 16-Aug-2023 Section. Section. MEL Item Number 25-00-05B 25-00-05G 25-00-05A 25-00-05C 25-00-05E 25-00-05H 25-00-05D 25-00-05F Compartments Date: 27-Aug-2025"},{"n":"25-00-06A","t":"Passenger Seat(s)","r":"(M)May be inoperative provided: 1. Seat does not restrict access to any Emergency Exit, Egress Route, or Main Aisle, and 2. Affected seat(s) is blocked and placarded “DO NOT OCCUPY.” Note 1: A seat with an inoperative seat belt or shoulder harness is considered inoperative. Note 2: Inoperative seats do not affect required number of Flight Attendants. Note 3: Affected seat(s) may include seat(s) behind and / or adjacent outboard seats. Note 4: Seats with an inoperative or broken seat track attach fitting or seat frame damage affecting the integrity of the seat track attach fittings, may not be deferred using this MEL. Contact Liaison Engineering for seat row removal. Note 5: MCC must contact Flight Control for coordinating with ACS and ROC to remove seat from inventory until repaired."},{"n":"25-00-06B","t":"Recline Mechanism","r":"(M)May be inoperative and seat occupied provided seat is secured in up-right position."},{"n":"25-00-06C","t":"Recline Mechanism","r":"May be inoperative and seat occupied provided seat back is immovable in full upright position."},{"n":"25-00-06D","t":"Arm Rests with Seat Positioning Controls for Taxi, Takeoff, and Landing (TTL) and/or Other Controls","r":"(M)May be inoperative or missing and seat occupied provided: 1. Seat does not restrict access to any Emergency Exit, Egress Route, or Main Aisle, and 2. If armrest with seat control is missing or removed, seat is secured in taxi, takeoff, and landing (TTL) position. Date: 27-Aug-2025"},{"n":"25-00-06E","t":"Arm Rests without Seat Positioning Controls for Taxi, Takeoff, and Landing (TTL) and/or Other Controls","r":"May be inoperative or missing and seat occupied provided it does not restrict access to any emergency exit, egress route, or main aisle."},{"n":"25-00-06F","t":"Underseat Baggage Restraining System","r":"(O)May be inoperative provided: 1. Baggage is not stowed under seat with inoperative restraining system, 2. Associated seat is placarded “DO NOT STOW BAGGAGE UNDER THIS SEAT”, and 3. Procedures are used to alert Cabin Crew of inoperative restraining system."},{"n":"25-00-06G","t":"Seat Belt/Air Bag Restraint Systems","r":"May be inoperative provided affected seat is blocked and placarded “DO NOT OCCUPY”."},{"n":"25-00-06H","t":"Delethalization Pads (O) PROCEDURES","r":"May be inoperative or missing provided affected seat(s) is deferred perMEL 25-00-06A. ____ INOP RESTRAINT SYS INOP"},{"n":"25-00-09","t":"\"FASTEN\"","r":"SIGNS OR PLACARDS"},{"n":"25-00-10","t":"NON-ESSENTIAL","r":"FURNISHINGS (NEF)"},{"n":"25-00-11","t":"OBSERVER’S SEAT (INCLUDING ASSOCIATED","r":"EQUIPMENT)"},{"n":"25-00-11A","t":"Primary Observer’s Seat(Including Associated","r":"Equipment)"},{"n":"25-00-11B","t":"Primary Observer’s Seat (Including Associated","r":"Equipment)"},{"n":"25-00-11C","t":"Second Observers Seat(Including Associated","r":"Equipment)(Ships 3775 thru 3777)"},{"n":"25-00-11D","t":"Crotch Straps 25-00-12","r":"/ FLASHLIGHTS"},{"n":"25-00-12","t":"PORTABLE","r":"/ FLASHLIGHTS"},{"n":"25-00-12A","t":"Portable Flashlight Holders / Flashlights -Cabin","r":"(O)(M)May be inoperative or removed provided: 1. Crewmember assigned to affected position has an equivelant operative flashlight readily available, 2. Inoperative flashlight remains in a certified location or is removed from the aircraft, and 3. Location placarding is removed or obscured."},{"n":"25-00-12B","t":"Portable Flashlight Holders / Flashlights Flight","r":"Deck"},{"n":"25-00-12C","t":"Portable Flashlight Holders / Flashlights Tamper 25-00-16","r":"Seals or Tags AND FLOOR PANELS"},{"n":"25-00-16","t":"CARGO","r":"AND FLOOR PANELS"},{"n":"25-00-16A","t":"Cargo Compartment Lining Panels and Floor","r":"Panels - FWD Cargo Compartment"},{"n":"25-00-16B","t":"Cargo Compartment Lining Panels and Floor","r":"Panels - AFT Cargo Compartment"},{"n":"25-00-16C","t":"Cargo Compartment Lining Panels and Floor 25-00-17","r":"Panels - FWD and AFT Cargo Compartments"},{"n":"25-00-17A","t":"First Aid Kits and/or Associated Equipment","r":"(O)(M)One kit may be incomplete or removed provided: 1. The FAK is labeled or placarded in a manner that will identify it as a unit that can not be mistaken for a fully serviceable unit, 2. Location placarding is removed or obscured, and 3. Repairs or replacements are made within 1 flight. Note: Medical equipment installed in the aircraft as part of an Emergency Medical Service (EMS) operation is not considered part of the normal complement of equipment. No MEL relief applies to that equipment and 14 CFR maintenance and inspection requirements do not apply."},{"n":"25-00-17B","t":"First Aid Kit Tamper Seals or Tags","r":"(O)May be inoperative, damaged, or missing provided proper FAK servicing is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"25-00-17C","t":"AED (Automatic External Defibrillator)","r":"(O)(M)May be incomplete, inoperative or removed provided: 1. AED is labeled or placarded in a manner that will identify it as a unit that can not be mistaken for a fully serviceable unit, 2. Location placarding is removed or obscured, and 3. Repairs or replacements are made within 1 flight. Note: Medical equipment installed in the aircraft as part of an Emergency Medical Service (EMS) operation is not considered part of the normal complement of equipment. No MEL relief applies to that equipment and 14 CFR maintenance and inspection requirements do not apply."},{"n":"25-00-17D","t":"AED Tamper Seals or Tags","r":"(O)May be inoperative, damaged, or missing provided proper installation and operation is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard) Date: 27-Aug-2025"},{"n":"25-00-17E","t":"AED Bracket / Lock","r":""},{"n":"25-00-17F","t":"EEMK (Enhanced Emergency Medical Kit)","r":"(O)(M)May be incomplete or removed provided: 1. EEMK is labeled or placarded in a manner that will identify it as a unit that can not be mistaken for a fully serviceable unit, 2. Location placarding is removed or obscured, and 3. Repairs or replacements are made within 1 flight. Note: Medical equipment installed in the aircraft as part of an Emergency Medical Service (EMS) operation is not considered part of the normal complement of equipment. No MEL relief applies to that equipment and 14 CFR maintenance and inspection requirements do not apply."},{"n":"25-00-17G","t":"EEMK (Enhanced Emergency Medical Kit)","r":"Any in excess of those required by 14 CFR may be incomplete or removed."},{"n":"25-00-17H","t":"EEMK Tamper Seals or Tags","r":"(O)May be inoperative, damaged, or missing provided proper EMK servicing is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"25-00-17I","t":"EEMK Bracket / Lock","r":""},{"n":"25-00-17J","t":"Red Pouch (Medical Accessory Pouch)","r":"May be inoperative, missing, or contain less than minimum required contents. Date: 27-Aug-2025 _______ _____ MISSING that cannot be mistaken for a fully serviceable or missing emergency equipment."},{"n":"25-00-18A","t":"Passenger Life Vests","r":"May be inoperative or missing provided extended overwater operations are not conducted."},{"n":"25-00-18B","t":"Passenger Life Vests","r":"May be inoperative or missing provided associated seat is blocked off, placarded DO NOT OCCUPY, and deferred perMEL Item 25-00-06A."},{"n":"25-00-18C","t":"Spare Life Vests","r":"May be inoperative or missing."},{"n":"25-00-18D","t":"Infant Life Vests (If Installed)","r":"(O)May be inoperative or missing."},{"n":"25-00-18E","t":"Life Rafts (If Installed) (O) PROCEDURES","r":"(O)May be inoperative, missing, or not easily accessible. Refer toAirway Manual 4.2.13.1 Limited Overwater Operationsfor requirements and limitations."},{"n":"25-00-20A","t":"Exterior Lavatory Door Ashtrays","r":"Up to 50% may be missing or inoperative provided it is replaced within 10 calendar days. Note: This item is AD related."},{"n":"25-00-20B","t":"Exterior Lavatory Door Ashtrays Note: Interior lavatory ashtrays are considered Non-essential 40-40-08for the NEF deferral process.","r":"More than 50% may be missing or inoperative for 3 days. Note: This item is AD related. Equipment Furnishings items. SeeTOPP Date: 29-Sep-2022"},{"n":"25-00-21A","t":"Recline","r":"(M)May be inoperative provided: 1. Seat is secured in a position acceptable to affected crewmember, and 2. Repairs are made within two flight days."},{"n":"25-00-21B","t":"Vertical Adjustment","r":"Date: 27-Aug-2025"},{"n":"25-00-21C","t":"Armrests","r":"(M)May be inoperative in the up position or removed provided seat is acceptable to affected crewmember."},{"n":"25-00-21D","t":"Lumbar / Thigh Supports","r":"May be inoperative provided seat is acceptable to affected crewmember."},{"n":"25-00-21E","t":"Headrests 25-00-22","r":"ACCESS DOORS / COVERS ACCESS DOORS / COVERS"},{"n":"25-00-22","t":"GALLEY /","r":"ACCESS DOORS / COVERS"},{"n":"25-00-22A","t":"Galley Waste Receptacles Access Doors / Covers","r":"(O)(M)May be inoperative provided: 1. Associated container is empty, 2. Container access is secured to prevent waste introduction into compartment, and 3. Procedures are used to ensure that sufficient galley waste receptacles are available to accommodate all waste that may be generated on a flight. Note: This MEL item cannot be used to defer galley waste carts."},{"n":"25-00-22B","t":"Lavatory Waste Receptacles Access Doors / 25-00-24(S) / CABIN,","r":"Covers GALLEY AND LAVATORY STORAGE"},{"n":"25-00-24","t":"OVERHEAD STORAGE BIN(S) / CABIN,","r":"GALLEY AND LAVATORY"},{"n":"25-00-24A","t":"Overhead Storage Bin(s) / Cabin, Galley and","r":"Lavatory Storage Compartment / Closets"},{"n":"25-00-24B","t":"Overhead Storage Bin(s) / Cabin, Galley and","r":"Lavatory Storage Compartment / Closets"},{"n":"25-00-24C","t":"Overhead Storage Bin(s) / Cabin, Galley and","r":"Lavatory Storage Compartment / Closets"},{"n":"25-00-24D","t":"Multi Latch/Quarter Turn Lug Installations","r":"One latch/lug per compartment may be inoperative provided: 1. Remaining latch(es)/lug(s) on affected compartments operate normally, and 2. If affected compartment is used for a galley cart, cart remains empty."},{"n":"25-00-24E","t":"Storage Compartment Key Locks (O) PROCEDURES","r":"(M)May be inoperative in the unlocked position provided doors can be secured by other means. Compartment / Closets INOP Compartment / Closets INOP Compartment / Closets INOP"},{"n":"25-20-148","t":"Page 8001.","r":"Date: 27-Aug-2025 3953,3954, 3957-3963, and Post AA First Class Recline Mechanism by locking out the recline as follows: the control cable assembly from the hydraulic hydraulic lock. (Refer toGraphic 25-5 Date: 27-Aug-2025 Lock Assembly nuts touch the stop. (Refer toGraphic will stop turning. Lock Stop the tabs to lock the adjustment into place. Date: 27-Aug-2025 Notches and Tabs the backrest needs to be moved backrest simultaneously to upright position. rod of the actuator as required for until required adjustment is reached. position, alloy washer (5). Date: 27-Aug-2025 Seat Recline"},{"n":"25-99-01A","t":"PED Mount","r":"Reconfigure cockpit for two (2) operative PED mounts. SeeTOPP 40-40-05for instructions."},{"n":"25-99-01B","t":"PED Mount","r":"Reconfigure cockpit for one (1) operative PED mount. SeeTOPP 40-40-05for instructions."},{"n":"25-99-01C","t":"PED Mount","r":"Date: 10-Apr-2024"},{"n":"26-00-01","t":"FIRE","r":"LIGHTS"},{"n":"26-00-01A","t":"Engine Fire Extinguisher Bottle Discharge Light(s)","r":"____ Engine Fire Extinguisher Bottle Discharge Light(s) INOP"},{"n":"26-00-01B","t":"APU Fire Extinguisher Bottle Discharge Light(s)","r":"____ APU Fire Extinguisher Bottle Discharge Light(s) INOP Date: 10-Apr-2024"},{"n":"26-00-02","t":"ENGINE","r":"SYSTEMS"},{"n":"26-00-03","t":"PORTABLE","r":"(PASSENGER CABIN ONLY)"},{"n":"26-00-03A","t":"Portable Fire Extinguishers (Passenger Cabin Only)","r":"(M)One H2O type extinguisher in any location may be inoperative provided: 1. Inoperative fire extinguisher remains in a certified location until removed from the aircraft at the next suitable maintenance facility, 2. Location placarding is removed or obscured, and 3. Required distribution is maintained. Note: Inoperative fire extinguishers removed from a certified location or removed from the aircraft, are subject to 49 CFR dangerous goods regulations."},{"n":"26-00-03B","t":"Portable Fire Extinguishers Tamper Seals or Tags (O) PROCEDURES","r":"(O)May be inoperative, damaged, or missing provided proper installation and servicing is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"26-00-04","t":"Wheel Well Fire Detection System","r":"(O)(M)May be inoperative provided: 1. Wheel Well Fire Detection System is deactivated, 2. Landing gear remain extended for ten minutes after takeoff, and 3. Appropriateperformance correctionsare applied. Note: In case of engine failure after V1, landing gear should be retracted until takeoff obstacles are cleared."},{"n":"26-00-06","t":"APU Fire Shutoff System","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided APU is not used."},{"n":"26-00-07","t":"APU Fire Extinguisher System","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided APU is not used."},{"n":"26-00-08A","t":"Single Loop","r":"(O)(M)Except for Extended Operations (ETOPS), May be inoperative provided APU is considered inoperative and deferred perMEL 49-00-01A. Theater Restrictions may apply"},{"n":"26-00-08B","t":"APU DET INOP Light","r":"(O)May be inoperative extinguished provided: 1. APU fire detection system operates normally, and 2. A fire warning test is performed PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"26-00-08C","t":"External Warning Horn / Warning Light","r":"May be inoperative for ground operation provided system is continuously monitored at flight deck control panel."},{"n":"26-00-09","t":"ENGINE /)","r":"TEST SYSTEM (EXT TEST) (SQUIB"},{"n":"26-00-09A","t":"Engine / APU Fire Extinguisher Test System (EXT TEST) (Squib Test)","r":"(M)May be inoperative provided: 1. Failure is verified to be in squib test circuit, and 2. Squib circuit is checked ONCE EACH FLIGHT DAY. (Log Book Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"26-00-09B","t":"APU Fire Extinguisher Squib Test Circuits (EXT TEST)","r":"(O)May be inoperative provided remaining APU Squib test circuit is verified to operate normally PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"26-00-09C","t":"APU Squib Light","r":"(O)Except for Extended Operations (ETOPS), may be inoperative provided APU is not used."},{"n":"26-00-10A","t":"Bell Cutout Switch (Overheat / Fire Protection Panel)","r":"May be inoperative provided: 1. Bell Cutout Function of both Master Fire Warning lights operates normally, and 2. Fire Warning Bell operates normally."},{"n":"26-00-10B","t":"Bell Cutout Function of Master Fire Warning Light","r":"May be inoperative provided: 1. Bell Cutout Switch operates normally, and 2. Fire Warning Bell operates normally."},{"n":"26-00-12","t":"WING-BODY-BODY (LEFT)","r":"SYSTEM (LEFT)"},{"n":"26-00-12A","t":"Wing-Body Overheat Detector System (Left)(-800","r":"aircraft)"},{"n":"26-00-12B","t":"Wing-Body Overheat Detector System (Left)(-900ER 26-00-13","r":"aircraft) SYSTEM (RIGHT) (RIGHT)"},{"n":"26-00-13","t":"WING-BODY-BODY (RIGHT)","r":"SYSTEM (RIGHT)"},{"n":"26-00-13A","t":"Wing-Body Overheat Detector System (Right)(-800","r":"aircraft)"},{"n":"26-00-13B","t":"Wing-Body Overheat Detector System (Right)(-900ER 26-00-15","r":"aircraft)"},{"n":"26-00-15A","t":"Lavatory Fire Extinguisher Systems","r":"For each lavatory, lavatory fire extinguisher system may be inoperative provided lavatory smoke detector system operates normally."},{"n":"26-00-15B","t":"Lavatory Fire Extinguisher Systems (O) PROCEDURES","r":"(O)(M)For each lavatory, lavatory fire extinguisher system may be inoperative provided: 1. Lavatory waste receptacle is empty, 2. Associated lavatory door is locked closed and placarded, \"UNSERVICEABLE - DO NOT USE\", and 3. Lavatory is used only by crewmembers. Note: These provisos are not intended to prohibit lavatory use or inspections by crewmembers."},{"n":"26-00-16A","t":"Lavatory Smoke Detection Systems","r":"(O)(M)For each lavatory, lavatory smoke detection system may be inoperative provided: 1. Lavatory waste receptacle is empty, 2. Associated lavatory door is locked closed and placarded, \" UNSERVICEABLE – DO NOT USE\", and 3. Lavatory is used only by crewmembers. Note: These provisos are not intended to prohibit lavatory use or inspections by crewmembers."},{"n":"26-00-16B","t":"Lavatory Smoke Detector TEST Switch on Cabin","r":"Attendants Panel"},{"n":"26-00-16C","t":"Lavatory Smoke Detector SELF TEST Switch 26-00-18","r":"(FLIGHT DECK TEST FEATURE)"},{"n":"26-00-18","t":"Wing-Body Overheat Test System (Flight Deck 26-00-19","r":"Test Feature) DETECTION SYSTEMS / SUPPRESSION"},{"n":"26-00-19","t":"LOWER","r":"DETECTION SYSTEMS /"},{"n":"26-00-19A","t":"Lower Cargo Compartment Fire Detection Systems","r":"/ Suppression Systems"},{"n":"26-00-19B","t":"Fwd/ Aft Detection Loops","r":"(O)One loop (A or B) in each compartment may be inoperative provided opposite loop is checked to operate normally."},{"n":"26-00-19C","t":"Extinguisher Bottle No.","r":"(O)(M)Except for Extended Operations (ETOPS), may be inoperative with cargo carried in compartment provided flight remains within 60 minutes of landing at a suitable airport."},{"n":"26-00-19D","t":"DISCH Light","r":"(M)May be inoperative provided associated extinguisher bottle(s) is verified to have an adequate charge ONCE EACH FLIGHT DAY. (Log Book Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"26-00-19E","t":"EXT Lights (FWD and AFT)","r":"(M)May be inoperative provided: 1. Failure is verified to be in squib light circuit, and 2. Squib circuit is verified to operate normally ONCE EACH FLIGHT DAY. (Log Book Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"26-00-19F","t":"DETECTOR FAULT Light 26-00-25","r":"LIGHTS"},{"n":"26-00-25","t":"Engine Start Lever Fire Indication Lights","r":"Date: 29-Sep-2022"},{"n":"27-00-04","t":"LEADING","r":"LIGHT SYSTEMS"},{"n":"27-00-04A","t":"Leading Edge Flap/Slat Position Light Systems - Aft Overhead LE DEVICES Annunciator Panel","r":"Aft overhead LE DEVICES Annunciator panel may be inoperative provided forward panel lights operate normally."},{"n":"27-00-04B","t":"Leading Edge Flap/Slat Position Light Systems - Forward Panel Lights","r":"(M)Forward panel lights may be inoperative provided: 1. Aft overhead LE DEVICES Annunciator panel operates normally and is used to verify proper LE DEVICE position, and 2. A placard is installed to indicate proper position for flap configuration in use."},{"n":"27-00-04C","t":"Leading Edge Slat Indications (-800)","r":"(O)(M)Indication lights on forward panel, and in addition, indication lights for one leading edge slat, except for slats 3, 4, 5 and 6 on overhead annunciator panel may be inoperative provided: 1. Normal operation is verified by flight crew PRIOR TO each takeoff and landing, 2. Maximum speed is limited to 300 KIAS at/ below FL 200 or .65 Mach above FL 200, 3. Aircraft is not operated within the boundaries of a Critical Terrain Box, 4. All remaining indications on overhead annunciator panel operate normally, and 5. Stall warning operation of both systems is verified to operate normally. Theater restrictions may Apply Repetitive Check Required (Yellow Placard)"},{"n":"27-00-04D","t":"Leading Edge Slat Indications (-900ER)","r":"(O)(M)Indication lights on forward panel, and in addition, indication lights for one leading edge slat, except for slats 2, 3, 4, 5, 6, and 7 on overhead annunciator panel may be inoperative provided: 1. Normal operation is verified by flight crew PRIOR TO EACH TAKEOFF AND LANDING, 2. Maximum speed is limited to 300 KIAS at/ below FL 200 or .65 Mach above FL 200, 3. Aircraft is not operated within the boundaries of a Critical Terrain Box, 4. All remaining indications on overhead annunciator panel operate normally, and 5. Stall warning operation of both systems is verified to operate normally. Theater restrictions may Apply Repetitive Check Required (Yellow Placard) Date: 09-Apr-2025"},{"n":"27-00-07","t":"Auto Speed Brake System","r":"(O)(M)May be inoperative provided: 1. System is deactivated, 2. Performance correctionsare applied, and 3. Speed Brake Load Alleviation System (if installed) is considered inop and deferred per MEL 27-00-20A, or27-00-20Bas applicable. Note: Refer to MEL 27-00-20A, or 27-00-20B (Speedbrake Load Alleviation System) as applicable."},{"n":"27-00-08A","t":"Flap Load Limiter System (-800 aircraft except 3774 thru 3777)","r":"(O)May be inoperative provided: 1. TAKEOFF – Flaps 25: Structural Takeoff Weight is restricted to 104,875 lbs (47,570 kg), 2. LANDING – Flaps 40: Structural Landing Weight is restricted to 93,995 lbs (42,635 kg), and 3. LANDING – Flaps 30: Structural Landing Weight is restricted to 104,875 lbs (47,570 kg)."},{"n":"27-00-08B","t":"Flap Load Limter System (-900ER)","r":"(O)May be inoperative provided: 1. TAKEOFF – Flaps 25: Structural Takeoff Weight is restricted to 155,600 lbs (70,578 kg), 2. TAKEOFF – Flaps 10 and Flaps 15: Structural Takeoff Weight is restricted to 176,000 lbs (79,832 kg), 3. LANDING – Flaps 40: Structural Landing Weight is restricted to 105,800 lbs (47,990 kg), 4. LANDING – Flaps 30: Structural Landing Weight is restricted to 113,400 lbs (51,437 kg), and 5. LANDING – Flaps 15: Structural Landing Weight is restricted to 135,600 lbs (61,507 kg)."},{"n":"27-00-08C","t":"Flap Load Limiter System (Aircraft 3774 thru 3777)","r":"(O)May be inoperative provided: 1. TAKEOFF – Flaps 25: Structural Takeoff Weight is restricted to 105,000 lbs (47,627 kg), 2. TAKEOFF – Flaps 15: Structural Takeoff Weight is restricted to 135,800 lbs (61,597 kg), 3. LANDING – Flaps 40: Structural Landing Weight is restricted to 95,800 lbs (43,454 kg), and 4. LANDING – Flaps 30: Structural Landing Weight is restricted to 105,000 lbs (47,627 kg)."},{"n":"27-00-10","t":"FEEL DIFF PRESS Light System","r":"(M)May be inoperative provided elevator feel system is verified to operate normally ONCE EACH FLIGHT DAY (Log Book Entry Required). Repetitive Check Required (Yellow Placard)"},{"n":"27-00-11","t":"Auto Slat Fail Light System","r":"(M)May be inoperative provided: 1. Auto slat systems are verified to operate normally, and 2. Verification is repeated EVERY TWO FLIGHT DAYS. (Log Book Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"27-00-12","t":"Auto Slat Systems","r":"(O)May be inoperative provided: 1. Remaining auto slat system is checked to operate normally, and 2. Auto slat fail light operates normally."},{"n":"27-00-14","t":"Rudder Trim Indicator","r":"(O)May be inoperative provided: 1. Rudder trim actuator is checked to operate normally, and 2. Rudder trim is checked to be centered PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"27-00-16","t":"SPEED BRAKES EXTENDED Light","r":"(M)May be inoperative provided speedbrakes are verified to operate normally."},{"n":"27-00-17","t":"WHEEL","r":"SYSTEM (WTRIS)"},{"n":"27-00-20","t":"SPEED","r":"SYSTEM"},{"n":"27-00-20A","t":"Speed Brake Load Alleviation System (-800) Y 1 0 C","r":"(O)(M)May be inoperative provided : 1. Speedbrake handle forces are normal from the full down to the full up position, 2. Airspeed does not exceed 265 KIAS when the inflight gross weight is in excess of 155,000 lbs. (70,306 kg.), 3. Severe turbulent air penetration speed is 265 KIAS or 0.76 Mach, whichever is lower, when the inflight gross weight is in excess of 155,000 lbs. (70,306 kg.), 4. Aircraft is not operated within the boundaries of a Critical Terrain Box, and 5. Automatic Speed Brake System is considered inoperative and deferred perMEL 27-00-07. Note: Refer to MEL Item 27-00-07 (Auto Speed Brake System) Theater restrictions may Apply OR (O)(M)May be inoperative provided: 1. Speedbrake handle forces are normal from the full down to the full up position, and 2. Takeoff weight does not exceed 155,500 lbs. (70,533 kg.)."},{"n":"27-00-20B","t":"Speed Brake Load Alleviation System (-900ER)","r":"(O)(M)May be inoperative provided : 1. Speedbrake handle forces are normal from the full down to the full up position, 2. Airspeed does not exceed 265 KIAS when the inflight gross weight is in excess of 170,000 lbs. (77,110 kg.), 3. Severe turbulent air penetration speed is 265 KIAS or 0.76 Mach, whichever is lower, when the inflight gross weight is in excess of 170,000 lbs. (77,110 kg.), 4. Aircraft is not operated within the boundaries of a Critical Terrain Box, and 5. Automatic Speed Brake System is considered inoperative and deferred perMEL 27-00-07. Note: Refer to MEL Item 27-00-07 (Auto Speed Brake System) Theater restrictions may Apply OR Date: 09-Apr-2025 (O)(M)May be inoperative provided: 1. Speedbrake handle forces are normal from the full down to the full up position,and 2. Takeoff weight does not exceed 170,500 lbs. (77,337 kg.)."},{"n":"27-00-21","t":"STBY RUD ON Light","r":"(O)(M)May be inoperative provided: 1. Rudder is verified to operate normally on hydraulic system A and B independently, 2. Standby hydraulic pump is verified to operate normally, and 3. Rudder force fight monitor is deactivated."},{"n":"27-00-23","t":"Elevator Tab Control Springs","r":"Date: 09-Apr-2025"},{"n":"28-00-01A","t":"Fuel Boost Pumps (Main Tanks) Aft Pumps","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Both main tank forward pumps operates normally, 2. At start of takeoff, fuel quantity in associated tank is not less 7,500 lb., 3. A minimum fuel quantity of 2,500 lb. is maintained in associated tank and fuel is considered unusable, and 4. Boost pump is deactivated. Note: Observe the Flight Manual limitations concerning lateral fuel imbalance. Plan fuel load to allow for the appropriate minimum fuel. Range and/or payload restrictions may result."},{"n":"28-00-01B","t":"Fuel Boost Pumps (Main Tanks) Forward Pumps","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Both main tank aft pumps operates normally, 2. At start of takeoff, fuel quantity in associated tank is not less 4,800 lb., 3. A minimum fuel quantity of 1,800 lb. is maintained in associated tank and fuel is considered unusable, and 4. Boost pump is deactivated. Note: Observe the Flight Manual limitations concerning lateral fuel imbalance. Plan fuel load to allow for the appropriate minimum fuel. Range and/or payload restrictions may result."},{"n":"28-00-02A","t":"Fuel Boost Pumps (Center Tank)","r":"(M)May be inoperative provided: 1. Tank remains empty, and 2. Boost pump is deactivated."},{"n":"28-00-02B","t":"Fuel Boost Pumps (Center Tank)","r":"(O)(M)May be inoperative with center tank fueled provided: 1. Fuel quantity remaining in main wing tanks is adequate to reach a suitable airport if remaining center pump fails at any time, 2. Maximum zero fuel weight limit is reduced by center tank fuel weight, 3. Effect on aircraft balance, in event fuel cannot be used is accounted for, 4. Low PRESS light of operating center fuel tank pump operates normally, 5. Center tank quantity indication operates normally, and 6. Boost pump is deactivated."},{"n":"28-00-02C","t":"Fuel Boost Pumps (Center Tank)","r":"(M)May be inoperative provided: 1. Center tank quantity indication operates normally, 2. Center tank remains empty or fuel is included as part of zero fuel weight and fuel must be considered unusable, and 3. Boost pump is deactivated. Note 1: AFM fuel loading and usage limitations are for usable fuel. Note 2: Fuel loading limitations must be observed."},{"n":"28-00-02D","t":"Universal Fault Interrupter (UFI) (For Ships 3701-3771)","r":"(O)(M)May be inoperative provided associated center tank boost pump is considered inoperative and deferred per MEL 28-00-02. Note 1: Refer to MEL 28-00-02 Fuel Boost Pumps (Center Tank) Note 2: This item is AD related. Date: 15-Mar-2023"},{"n":"28-00-03","t":"FUEL","r":"WARNING LIGHT SYSTEM"},{"n":"28-00-03A","t":"Main Tank Pump Low Pressure Warning Light Systems","r":"(O)(M)May be inoperative provided: 1. Associated fuel pump is considered inoperative and deferred perMEL 28-00-01, and 2. MASTER CAUTION lights and FUEL system annunciator light are verified to operate normally."},{"n":"28-00-03B","t":"Main Tank Pump Lights","r":"May be inoperative provided: 1. Both pumps in associated tank operate normally, and 2. Associated tank quantity indicator operates normally."},{"n":"28-00-03C","t":"Main Tank Pump Lights","r":"May be inoperative for an associated inoperative pump."},{"n":"28-00-03D","t":"Center Tank Pump Low Pressure Warning Light Systems","r":"(O)(M)May be inoperative provided: 1. Associated fuel pump is considered inoperative and deferred perMEL 28-00-02, and 2. MASTER CAUTION lights and FUEL system annunciator light are verified to operate normally."},{"n":"28-00-03E","t":"Center Tank Pump Low Pressure Warning Light Systems","r":"May be inoperative provided: 1. Center tank fuel is not required for flight, 2. Center tank fuel boost pumps are turned off, 3. Center tank remains empty or maximum zero fuel weight calculations are adjusted by weight of center tank fuel, and 4. Effect on aircraft balance is accounted for."},{"n":"28-00-03F","t":"Center Tank Pump Lights","r":"(O)(M)May be inoperative provided: 1. Center tank fuel quantity indicator operates normally, and 2. MASTER CAUTION lights and FUEL system annunciator light are verified to operate normally. Date: 09-Apr-2025"},{"n":"28-00-04","t":"APU Fuel Valve","r":"(O)(M)Except for Extended Operations (ETOPS), may be inoperative provided: 1. APU is not used, and 2. Valve is deactivated closed."},{"n":"28-00-05","t":"Crossfeed VALVE OPEN Light","r":"(M)Except for Extended Operations (ETOPS), may be inoperative provided: 1. Crossfeed valve is verified to operate normally, and 2. Fuel quantity indication for both main tanks operates normally."},{"n":"28-00-06","t":"FLIGHT","r":"(MAIN TANKS)"},{"n":"28-00-07","t":"FLIGHT","r":"(CENTER TANK)"},{"n":"28-00-07A","t":"Flight Deck Fuel Quantity Indicator (Center Tank)","r":"(O)(M)May be inoperative provided: 1. One center tank boost pump operates normally, 2. Center tank remains empty."},{"n":"28-00-07B","t":"Flight Deck Fuel Quantity Indicator (Center Tank)","r":"(O)(M)Except for Extended Operations (ETOPS), may be inoperative provided: 1. Both center tank boost pumps operate normally, 2. Fuel quantity in center tank is verified by an alternate means PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"28-00-08","t":"Fuel Temperature Indicator","r":"May be inoperative provided Total Air Temperature or Ram Air Temperature is substituted as an indication of fuel temperature."},{"n":"28-00-09","t":"1. Fuel Totalizer Indicator 1. 2. FMS CDU 2. 3. Mode Switch 3. Note 1: The FMC CDU will display a VERIFY GW AND receives a “no valid data” signal from the Fuel Quantity need to deactivate the FQIS input to the FMC. board via the FMC Performance Page to calculate destination. Periodic manual updating is required Note 2: If VNAV capability is desired during approach, decent.","r":"Fuel Quantity Totalizer INOP FMS Gross Weight Calculation INOP AFCS VNAV Mode INOP FUEL message if the FMC receives no data or Processor Unit (FQPU). There is no Flight crews may manually enter current fuel on reference speeds or fuel remaining at for information to be valid. enter current fuel on board into FMC at top of Date: 18-Dec-2024"},{"n":"28-00-10A","t":"Pressure Fueling System","r":"(M)May be inoperative provided alternate procedures are used. Note: Flight Crew members may request ramp agents or fueling personnel to install the placard on Pressure Fueling Panel."},{"n":"28-00-10B","t":"Fueling Manifold Check Valves","r":"(M)May be inoperative provided associated fueling shutoff valve is verified to operate normally."},{"n":"28-00-10C","t":"Fueling Shutoff Valves","r":"(M)May be inoperative closed provided: 1. The refuel valve is verified closed by pressurizing the fueling manifold to verify that fuel does not flow to the tank with the failed refuel valve, and 2. After removal of the fueling nozzle, check the fueling receptacle for leakage. Leakage is not allowed. Note: Flight Crew members may request ramp agents or fueling personnel to install the placard on Pressure Fueling Panel."},{"n":"28-00-10D","t":"Refuel Panel Fueling Power Control Switch 28-00-12","r":"INDICATORS"},{"n":"28-00-12","t":"REFUELING","r":"INDICATORS"},{"n":"28-00-16","t":"Fuel Measuring Sticks / Dripsticks","r":"(M)May be inoperative provided: 1. Fuel quantity is verified by an acceptable procedure, and 2. No evidence of fuel leakage exists."},{"n":"28-00-21","t":"Fuel Quantity Test Switch","r":"Fuel Quantity Test System INOP Date: 27-Aug-2025"},{"n":"28-00-22","t":"SPAR VALVE CLOSED Lights 28-00-25","r":"AUTOMATIC SHUTOFF SYSTEM"},{"n":"28-00-25","t":"CENTER","r":"AUTOMATIC SHUTOFF SYSTEM"},{"n":"28-00-25A","t":"Center Tank Fuel Boost Pump Automatic Shutoff 3801-3930, 3931-3963)","r":"System(A/C 3772,3773, 3774-3777,"},{"n":"28-00-25B","t":"Center Tank Fuel Boost Pump Automatic Shutoff 3801-3930, 3931-3963)","r":"System(A/C 3772,3773, 3774-3777,"},{"n":"28-00-25C","t":"Center Tank Fuel Boost Pump Automatic Shutoff 3801-3930, 3931-3963) 28-00-26","r":"System(A/C 3772,3773, 3774-3777, CHARGER (ENGINE SPAR VALVE)"},{"n":"28-00-26","t":"Fuel Shutoff Valve Battery and Charger (Engine","r":"Spar Valve) Date: 29-Sep-2022"},{"n":"29-00-02","t":"SYSTEM","r":"PUMP DEPRESSURIZATION"},{"n":"29-00-03","t":"SYSTEM","r":"(A AND B)"},{"n":"29-00-04","t":"SYSTEM","r":"INDICATION SYSTEMS"},{"n":"29-00-05","t":"SYSTEM","r":"INDICATION SYSTEMS"},{"n":"29-00-07","t":"SYSTEM","r":"SYSTEM"},{"n":"29-00-09","t":"HYDRAULIC)","r":"LIGHT SYSTEM (STANDBY"},{"n":"29-00-10","t":"SYSTEM","r":"PUMP DEPRESSURIZATION"},{"n":"29-00-11","t":"SYSTEM","r":"SYSTEM (FLIGHT DECK)"},{"n":"29-00-12","t":"STANDBY","r":"LIGHT"},{"n":"29-00-13","t":"HYDRAULIC","r":"SYSTEM SOURCES"},{"n":"29-00-15","t":"SYSTEM","r":"SYSTEM (FLIGHT DECK)"},{"n":"29-00-16","t":"Hydraulic Reservoir Air Pressure Indicator (Wheel 29-00-17","r":"Well) INDICATOR (WHEEL WELL)"},{"n":"29-00-17","t":"Hydraulic Reservoir Quantity Indicator (Wheel 29-00-18","r":"Well) (WHEEL WELL)"},{"n":"29-00-18","t":"Hydraulic Reservoir Fill System (Wheel Well)","r":"Date: 29-Sep-2022"},{"n":"30-00-01A","t":"Wing Anti-Ice Valves","r":"(O)(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative closed provided aircraft is not operated in known or forecast icing conditions. Theater Restrictions may apply"},{"n":"30-00-01B","t":"Wing Anti-Ice Valves","r":"(O)(M)May be inoperative open provided: 1. Except for engine start, associated manifold is depressurized when outside temperature is above 50 degrees F (10 degrees C) on the ground or above 10 degrees C TAT in flight, 2. Associated engine bleed thrust limits are followed when manifold is pressurized, 3. Air conditioning and pressurization requirements are followed when one manifold is depressurized, 4. Use the appropriate(M)procedure section to provide bleed air for engine start PRIOR TO EACH DEPARTURE, and 5. Performance corrections are applied. Theater Restrictions may apply Repetitive Check Required (Yellow Placard)"},{"n":"30-00-02","t":"Wing Anti-Ice Valve Position Lights","r":"(M)May be inoperative provided valve is verified to operate normally before operating in known or forecast icing conditions."},{"n":"30-00-03","t":"ENGINE","r":"VALVES"},{"n":"30-00-03A","t":"Engine and Nose Cowl Anti- Ice Valves","r":"(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative closed provided aircraft is not operated in known or forecast icing conditions. Theater Restrictions may apply"},{"n":"30-00-03B","t":"Engine and Nose Cowl Anti- Ice Valves","r":"(O)(M)May be inoperative locked open provided: 1. Associated High Stage Valve is considered inoperative and deferred perMEL 36-00-09, 2. Opposite side engine bleed air system and air conditioning system is operational, 3. Ambient temperature is below 100 degrees F (38 degrees C), 4. A minimum of 60% N1 is maintained on associated engine during flight above FL300 or in icing conditions, and 5. Performance corrections are applied. Note: Refer to MMEL item 36-00-09 (High Stage Valves). Theater Restrictions may apply"},{"n":"30-00-04","t":"ENGINE","r":"VALVE POSITION LIGHTS OR TAI"},{"n":"30-00-04A","t":"Engine and Nose Cowl Anti- Ice Valve Position Lights or TAI Indications","r":"(O)May be inoperative provided proper valve operation is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"30-00-04B","t":"Engine and Nose Cowl Anti- Ice Valve Position Lights or TAI Indications","r":"One valve position indication (either COWL VALVE OPEN light or TAI indication) for each engine may be inoperative provided other valve position indication for that engine operates normally."},{"n":"30-00-04C","t":"Engine and Nose Cowl Anti- Ice Valve Position Lights or TAI Indications","r":"May be inoperative provided associated valve is considered inoperative and deferred perMEL 30-00-03Aor30-00-03B. Note: Refer to MEL 30-00-03 Engine and Nose Cowl Anti-Ice Valves."},{"n":"30-00-05A","t":"Left / Right Pitot Heaters","r":"Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative for day VMC provided: 1. Aux Pitot heater operates normally, 2. Airplane is not operated in visible moisture, and 3. Airplane is not operated in known or forecast icing conditions."},{"n":"30-00-05B","t":"Aux Pitot Heater (Right Lower Probe)","r":"Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Both Left and Right Pitot heaters operate normally, and 2. Airplane is not operated in known or forecast icing conditions."},{"n":"30-00-06","t":"VERTICAL)","r":"(ELEVATOR AND RUDDER FEEL"},{"n":"30-00-07","t":"TOTAL","r":"HEATER"},{"n":"30-00-08","t":"ANGLE OF(S) SENSOR HEATER(S) /","r":"/ STALL WARNING SYSTEM HEATER(S)"},{"n":"30-00-09","t":"PITOT, PITOT /,","r":"PROBE HEATER LIGHTS"},{"n":"30-00-09A","t":"Amber (Heater Off) Lights Pitot and Pitot / Static","r":"(M)Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided: 1. Associated heater function is verified to operate normally, and 2. Airplane is not operated in known or forecast icing conditions."},{"n":"30-00-09B","t":"Temp Probe","r":"(M)May be inoperative provided associated heater function is verified to operate normally PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"30-00-09C","t":"Temp Probe","r":"May be inoperative provided: 1. associated heater is inoperative, and 2. airplane is not operated in known or forecast icing conditions."},{"n":"30-00-11A","t":"No. Window","r":"(O)Except for Extended Operations (ETOPS) beyond 120 minutes, one may be inoperative provided: 1. Aircraft is not operated in known or forecast icing conditions, 2. Both No. 2 window heaters operate normally, 3. Windshield de-fog system operates normally, 4. Airspeed is limited to 250 KIAS below 10,000 feet MSL, and 5. Associated switch remains OFF. Theater restrictions may Apply"},{"n":"30-00-11B","t":"No. Window","r":"(O)May be inoperative provided: 1. Both No.1 window heaters operate normally, 2. Windshield de-fog system operates normally, 3. Airspeed is limited to 250 KIAS below 10,000 feet MSL, and 4. Associated switch remains OFF. Theater restrictions may Apply"},{"n":"30-00-12","t":"Windshield De-Fog System","r":"May be inoperative provided electrically heated windshields for No.1 and No.2 windows operate normally."},{"n":"30-00-13A","t":"Windshield Wiper System","r":"(M)May be inoperative provided: 1. Aircraft is not operated in precipitation within 5 statute miles of airport of takeoff or intended landing, and 2. Approach minimums do not require their use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"30-00-13B","t":"Park Function","r":"May be inoperative for all flight conditions provided blade(s) can be positioned in a location that will not obstruct forward vision."},{"n":"30-00-13C","t":"Windshield Wiper Selector ____","r":"W/S Wiper(s) Intermittent Speed Function INOP"},{"n":"30-00-13D","t":"Low Speed Function","r":"May be inoperative provided associated high speed function operate normally."},{"n":"30-00-13E","t":"High Speed Function","r":"May be inoperative provided associated low speed function operates normally."},{"n":"30-00-13F","t":"High Speed Function","r":"May be inoperative provided both low speed functions operate normally and rain intensity is less than moderate."},{"n":"30-00-17A","t":"Cowl Anti-Ice Lights","r":"Except for Extended Operations (ETOPS) beyond 120 minutes, may be inoperative provided aircraft is not operated in known or forecast icing conditions."},{"n":"30-00-17B","t":"Cowl Anti-Ice Lights","r":"(O)(M)May be inoperative provided: 1. Associated Cowl Anti-Ice Valve is locked OPEN and deferred perMEL 30-00-03B 2. Associated High Stage Valve is considered inoperative and deferred perMEL 36-00-09"},{"n":"30-00-18A","t":"Alpha Vane Heater Light Systems","r":"(M)May be inoperative provided associated heater function operates normally and is verified PRIOR TO EACH DEPARTURE. Repetitive Check Required (Yellow Placard)"},{"n":"30-00-18B","t":"Alpha Vane Heater Light Systems","r":"May be inoperative provided associated heater is considered inoperative and is deferred perMEL 30-00-08. Note: Refer to MEL 30-00-08 Angle of Attack Sensor Heater(s) / Stall Warning System Sensor Heater(s) / Alpha Vane Heater(s)"},{"n":"30-00-19","t":"Drain Mast Heaters 30-00-21-ICE","r":"SWITCHES"},{"n":"30-00-21A","t":"Control Stand Wing Anti-Ice Switches","r":"(O)One or both may be inoperative closed."},{"n":"30-00-21B","t":"Control Stand Wing Anti-Ice Switches (O) PROCEDURES","r":"(O)One or both may be inoperative open. INOP INOP"},{"n":"30-00-22","t":"AUTO Activation","r":"Date: 09-Apr-2025"},{"n":"31-00-01A","t":"Clocks","r":"One may be inoperative at either pilot or copilot station."},{"n":"31-00-01B","t":"Automatic UTC Update Function","r":"(O)May be inoperative provided manual mode is set and operates normally."},{"n":"31-00-02","t":"FLIGHT DATA RECORDER (FDR) (DFDAU)","r":"WITH TELEDYNE DIGITAL"},{"n":"31-00-02A","t":"Flight Data Recorder (FDR) System with Teledyne Digital Flight Data Acquisition Unit (DFDAU)","r":"May be inoperative provided: 1. Cockpit Voice Recorder (CVR) operates normally, 2. Airplane may not depart from ATL, BOS, LAX, or SLC unless: A. FDR failure occurs after pushback but prior to takeoff, or B. FDR repair was attempted but was not successful. 3. In those cases where repair is attempted but not successful, aircraft may be dispatched on a flight or series of flights but shall not continue beyond ATL, BOS, LAX, or SLC where repair must be accomplished prior to dispatch, 4. It is required that the MCC initiate a Corrective Action Required (CAR) for the next designated airport (ATL,BOS, LAX, or SLC), and 5. Repairs are made within three flight days."},{"n":"31-00-02B","t":"DFDR Recording Parameters Required by 14 CFR","r":"Up to three (3) recording parameters may be inoperative provided: 1. Cockpit Voice Recorder (CVR) operates normally, and 2. Repairs are made within 20 calendar days. Note: Refer toTOPP 40-20-40for a listing of DFDR parameters required by 14 CFR."},{"n":"31-00-02C","t":"DFDR Recording Parameters Not Required by 14 CFR","r":"May be inoperative provided repairs are made prior to the completion of the next heavy maintenance visit (PSV or higher). Note: Refer toTOPP 40-20-40for a listing of DFDR parameters required by 14 CFR."},{"n":"31-00-07","t":"AIRCRAFT","r":"SYSTEM (ACMS)"},{"n":"31-00-07A","t":"Aircraft Condition Monitoring System (ACMS)","r":"(O)May be inoperative provided engine trend data is entered using ACARS or manually entered onto Engine Performance Report Forms. Note: If ACMS is deferred due to inoperative pitch awareness, Engine Performance Report Forms are not required."},{"n":"31-00-07B","t":"Quick Access Recorder (QAR) (O) PROCEDURES","r":"Record Data in Engine Performance Report Forms Aircraft Condition Monitoring System INOP"},{"n":"31-00-08A","t":"Display Units (Lower DU)","r":"(O)(M)May be inoperative provided: 1. All remaining DU’s operate normally, and 2. It is checked that engine display can be switch to an alternate DU."},{"n":"31-00-08B","t":"CDS MAINT Annunciation PFD/ND","r":"May be dispatched with faults indicated by CDS MAINT annunciation."},{"n":"31-00-09","t":"Remote Light Sensor System","r":"May be inoperative provided all manual display brightness controls operate normally."},{"n":"31-00-10","t":"Speed Reference Selector","r":"May be inoperative provided speeds can be set using CDU."},{"n":"31-00-14","t":"TAKEOFF CONFIG Light","r":"(O)May be inoperative provided the associated CABIN ALTITUDE warning light operates normally and flight crew performs a briefing on cabin altitude warning indications and procedures before engine start PRIOR TO THE FIRST FLIGHT OF THE DAY or following any change of either flight crew member. Repetitive Check Required (Yellow Placard)"},{"n":"32-00-02","t":"Anti-Skid System","r":"0 B (O)(M)May be inoperative provided: 1. MCC must provide authorization prior to use, 2. No revenue passengers or cargo are carried, 3. A maximum of 19 persons are carried as authorized by 14 CFR for non-passenger carrying operations, 4. Associated Antiskid channel(s) is deactivated, 5. Both Thrust Reversers must be operative, 6. Flight crew is briefed by Flight Ops, 7. Approach minimums do not require their use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, and 8. Performance correctionsare applied."},{"n":"32-00-03","t":"Parking Brake Valve","r":"(O)(M)May be inoperative provided: 1. Antiskid is deactivated and deferred perMEL 32-00-02, 2. Approach minimums do not require its use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements, and 3. Performance correctionsare applied."},{"n":"32-00-04","t":"Parking Brake Light","r":"(M)May be inoperative provided parking brake shutoff valve is verified to operate normally."},{"n":"32-00-07A","t":"Automatic Brake System","r":"(M)May be inoperative provided system is deactivated and secured. Note: If AUTOBRAKE DISARM or INOP light EXTINGUISHESwith autobrake select switch in OFF, dispatch is allowed without deactivating the autobrake system (autobrake select switch in the OFF position). Use MEL 32-00-07B"},{"n":"32-00-07B","t":"Automatic Brake System","r":"May be inoperative provided: 1. AUTOBRAKE DISARM or INOP light does not illuminate with auto-brake select switch in OFF position. 2. Select switch is left in OFF position."},{"n":"32-00-08","t":"RUDDER)","r":"SYSTEM (ROTARY"},{"n":"32-00-09","t":"DIRECT","r":"GAUGE"},{"n":"32-00-10","t":"Alternate Anti-Skid Valves","r":"(M)May be inoperative provided: 1. Manual braking capability of alternate brake system is verified on associated wheels, and 2. Approach minimums do not require their use; refer toNavigation Equipment Tab (this manual) for Lower Landing Minimum Requirements."},{"n":"32-00-12","t":"Nose Wheel Steering Switch","r":"(M)may be inoperative provided; 1. Nose wheel steering is powered by Hydraulic System A, and 2. Landing gear transfer valve is verified to operate normally."},{"n":"32-00-13A","t":"Wheel Well Brake Accumulator Indicator","r":"May be inoperative provided Flight Deck brake pressure indicator operates normally."},{"n":"32-00-13B","t":"Flight Deck Indication System","r":"(M)May be inoperative provided brake accumulator charge is verified normal ONCE EACH FLIGHT DAY. (Log Book Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"32-00-14","t":"Gear Retraction Braking System","r":"(O)May be inoperative provided; 1. After takeoff, landing gear remains extended for two minutes before retraction, 2. Takeoff performance is based on Landing Gear Extended, and 3. Performance corrections are applied. Note: This relief should only be applied for an inoperative Main Landing Gear Retraction Braking System. Do not use this item for Nose Landing Gear de-spin brakes/snubbers."},{"n":"32-00-16","t":"Landing Gear Actuation System 32-00-17","r":"UNIT (PSEU) SYSTEM (PSEU) SYSTEM"},{"n":"32-00-17","t":"PROXIMITY (PSEU) SYSTEM","r":"UNIT (PSEU) SYSTEM"},{"n":"32-00-17A","t":"PSEU Fault","r":"(M)May be dispatched with faults indicated by PSEU light provided PSEU is checked for faults PRIOR TO EACH DEPARTURE. (Log Book Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"32-00-17B","t":"PSEU Fault","r":"(M)May be dispatched with faults indicated by PSEU light provided PSEU light can be extinguished."},{"n":"32-00-17C","t":"PSEU Light","r":"(M)May be inoperative provided PSEU is checked for faults PRIOR TO EACH DEPARTURE. (Log Book Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"32-00-17D","t":"SPSEU Light","r":"(M)May be inoperative provided SPSEU is checked for faults PRIOR TO EACH DEPARTURE. (Log Book Entry Required) Repetitive Check Required (Yellow Placard)"},{"n":"32-00-19","t":"Main Landing Gear Uplock Springs","r":"(O)(M)One spring on one main gear uplock mechanism may be missing provided landing gear lever remains in UP position for duration of flight until gear extension is required."},{"n":"32-00-20","t":"Landing Gear Frangible Fitting 32-00-21,","r":"S138"},{"n":"32-00-21","t":"Flap Landing Warning Switch, S138 32-00-22 (-900ER and aircraft","r":"3774 thru 3777)"},{"n":"32-00-22A","t":"Retraction Mechanism","r":"(O)(M)May be inoperative provided: 1. Tail skid is secured in retracted position, and 2. Performance correctionsare applied."},{"n":"32-00-22B","t":"Retraction Mechanism","r":"(O)(M)May be inoperative provided: 1. Tail skid is secured in extended position, and 2. Performance correctionsare applied."},{"n":"32-00-22C","t":"Cartridge Core Assembly","r":"Date: 21-Aug-2024"},{"n":"33-00-01","t":"COCKPIT /","r":"COMPARTMENT AND INSTRUMENT"},{"n":"33-00-01A","t":"Cockpit / Flight Deck / Flight Compartment and Instrument Lighting System","r":"Individual lights may be inoperative provided: 1. Remaining Lighting System lights are sufficient to clearly illuminate all required instruments, controls, and other devices for which it is provided, 2. Remaining Lighting System lights are positioned so that direct rays are shielded from flight crewmember"},{"n":"33-00-01B","t":"Cockpit / Flight Deck / Flight Compartment and Instrument Lighting System","r":"(O)Individual lights may be inoperative for DAY OPERATIONS ONLY provided: 1. Remaining Lighting System lights are sufficient to clearly illuminate all required instruments, controls, and other devices for which it is provided, 2. Remaining Lighting System lights are positioned so that direct rays are shielded from flight crewmember"},{"n":"33-00-02A","t":"Cabin Interior Illumination (For aircraft without Photoluminescent Escape Path Lighting System installed) (All Ships except 3931-3963 without AA 3352-01043)","r":"Individual lights may be inoperative provided sufficient lighting remains for cabin attendants to perform their duties. Note: Emergency lights in the overwing exit sidewall assemblies must remain operational when deferring this item."},{"n":"33-00-02B","t":"Ceiling Lights (For aircraft with Photoluminescent Escape Path Lighting System installed) (Ships 3931-3963 without AA 3352-01043)","r":"Every two adjacent ceiling light modules may be inoperative provided: 1. Adjacent two ceiling light modules FWD and AFT (if installed) are operative, 2. All remaing light modules at the same body station are operative, and 3. Adjacent diagonal light modules are operative."},{"n":"33-00-02C","t":"Sidewall Lights – Single Window Light Module (For aircraft with Photoluminescent Escape Path Lighting System installed) (Ships 3931-3963 without AA 3352-01043)","r":"Single window (sidewall) light modules may be inoperative provided: 1. Adjacent window (sidewall) light modules FWD and AFT (if installed) are operative, 2. All remaining light modules at the same bodystation are operative, and 3. Adjacent diagonal light modules are operative."},{"n":"33-00-02D","t":"Sidewall Lights (For aircraft with Photoluminescent Escape Path Lighting System installed) (Ships 3931-3963 without AA 3352-01043)","r":"Every two adjacent window (sidewall) light modules may be inoperative provided: 1. Adjacent two window (sidewall) light modules FWD and AFT (if installed) are operative, 2. All remaining light modules at the same bodystation are operative, and 3. Adjacent diagonal light modules, including the ceiling light modules on opposite side of the aisle at the same bodystations, are operative."},{"n":"33-00-03","t":"PASSENGER","r":"SIGNS AND NOTICE SYSTEM"},{"n":"33-00-03A","t":"Passenger Notice System (\"NO SMOKING / / Return to Seat\") Signs","r":"(M)May be inoperative provided: 1. Associated passenger seat or lavatory is not occupied from which a passenger lighted information sign is not readily legible, and 2. Associated seat or lavatory is blocked and placarded-DO NOT OCCUPY. Note: These conditions are not intended to prohibit lavatory use or inspections by crewmembers."},{"n":"33-00-03B","t":"Passenger Notice System (\"NO SMOKING / / Return to Seat\") Signs","r":"(O)May be inoperative and associated passenger seat or lavatory may be occupied provided: 1. PA system operates normally, and 2. PA system is used to notify passengers and cabin crew when associated sign(s) are placed on or off."},{"n":"33-00-03C","t":"Fasten Seat Belt Switch ____","r":"Fasten Seat Belt / No Smoking Aural Tone INOP"},{"n":"33-00-03D","t":"Flight Deck Automatic Function","r":"(O)May be inoperative provided: 1. Manual control function operates normally, and 2. Alternate procedures are used."},{"n":"33-00-04","t":"LOWER","r":"SYSTEMS (FWD / AFT)"},{"n":"33-00-04A","t":"Lower Cargo Compartment Light Systems (Fwd / Aft)","r":"(M)Light Lens excluded."},{"n":"33-00-04B","t":"Light Lens (A/C 3701-3771, 3774-3777, 3801-3963)","r":"May be broken / missing provided associated light bulb is removed. For LED lights, no associated LED Module removal is required."},{"n":"33-00-04C","t":"Light Lens (A/C 3772, 3773) (M) PROCEDURES","r":"Any number from aft lower cargo compartment and one from forward lower cargo compartment may be broken/missing provided associated light bulb is removed. For LED lights, no associated LED Module removal is required."},{"n":"33-00-05","t":"HIGH","r":"SYSTEM"},{"n":"33-00-06A","t":"Anti-Collision Beacons","r":"(M)May be inoperative provided wing tip/winglet and tail strobe lights are installed and operate normally."},{"n":"33-00-06B","t":"Anti-Collision Beacons","r":"(M)May be inoperative provided: 1. At least one tail or wing tip/winglet strobe light operates normally, and 2. Operations are not conducted between sunset to sunrise."},{"n":"33-00-07","t":"Wing Illumination Lights","r":"(O)(M)May be inoperative provided ground de-icing procedures do not require their use."},{"n":"33-00-08A","t":"Landing Lights","r":"One may be inoperative on each side provided one of two operating lights is in fixed position."},{"n":"33-00-08B","t":"Landing Lights","r":"May be inoperative provided operations are not conducted between sunset to sunrise."},{"n":"33-00-08C","t":"Retractable Light Extend / Retract Motors","r":"(O)(M)May be inoperative provided: 1. Light is in extended position, 2. Light illuminates normally, and 3. Performance correctionsare applied."},{"n":"33-00-08D","t":"Retractable Light Extend / Retract Motors","r":"(O)May be inoperative provided: 1. Associated light is considered inop and deferred per MEL 33-00-08(A or B), and 2. Appropriate performance adjustments are applied when associated light is not in the fully retracted position."},{"n":"33-00-08E","t":"Landing Lights – LED Array","r":"One may be inoperative on each side provided Taxi Light is deferred perMEL 33-00-09B. Note: There is an inboard LED array (light assembly) and an outboard LED array (light assembly) inside the strakelet on each wing. These same lights are also used for the taxi lights. Taxi lights may also be affected (seeFigure 33-00-08.1)."},{"n":"33-00-08F","t":"Landing Lights – LED Array","r":"Both may be inoperative on one side provided: 1. The Runway Turn Off light on the same side operates normally, and 2. Taxi Light is deferred perMEL 33-00-09B. Note: There is an inboard LED array (light assembly) and an outboard LED array (light assembly) inside the strakelet on each wing. These same lights are also used for the taxi lights. Taxi lights may also be affected (seeFigure 33-00-08.1). Date: 18-Dec-2024"},{"n":"33-00-08G","t":"Landing Lights – LED Array","r":"May be inoperative provided: 1. Operations are not conducted between sunset to sunrise, and 2. Taxi Light is deferred perMEL 33-00-09B. Note: There is an inboard LED array (light assembly) and an outboard LED array (light assembly) inside the strakelet on each wing. These same lights are also used for the taxi lights. Taxi lights may also be affected (seeFigure 33-00-08.1)."},{"n":"33-00-09A","t":"Taxi Light Switch","r":"Taxi Light INOP"},{"n":"33-00-09B","t":"Taxi Light LED Array","r":"May be inoperative provided Landing Lights are deferred perMEL 33-00-08E,33-00-08For 33-00-08G. Note: There is an inboard LED array (light assembly) and an outboard LED array (light assembly) inside the strakelet on each wing. These same lights are also used for the landing lights. Landing lights may also be affected (seeFigure 33-00-09.1)."},{"n":"33-00-10","t":"Runway Turn Off Lights","r":"One or both may be inoperative. Note 1: If both LED Landing Light Arrays on one side are inoperative (seeMEL 33-00-08F), the Runway Turn Off Light on the affected side must be operative for night operations. Note 2: LED Array (Light Assembly), a Runway Turnoff Light (RTO) may be considered to operate normally when the RTO assembly contains one inoperative LED."},{"n":"33-00-11A","t":"Wing Tip Position Lights","r":"(M)May be inoperative provided operations are not conducted from sunset to sunrise."},{"n":"33-00-11B","t":"Wing Tip Position Light Bulbs / Lamps / LED 33-00-14","r":"Modules SYSTEM"},{"n":"33-00-14","t":"Exterior Emergency Lighting System 33-00-15","r":"SYSTEM"},{"n":"33-00-15","t":"INTERIOR","r":"SYSTEM"},{"n":"33-00-15A","t":"Emergency Aisle Lights","r":"Light assemblies installed above aisle may be inoperative provided no two adjacent (opposite side) light assemblies are inoperative."},{"n":"33-00-1
